<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Digital Infohub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#0a0a0a">
<meta name="description" content="Digital Infohub — a unified hub for news, tools, games, and AI.">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://api.rss2json.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://pagead2.googlesyndication.com">

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5443646750699471" crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
  --radius: 12px;
  --radius-sm: 8px;
  --modal-z: 1000;
}

[data-theme="dark"] {
  --bg: #0a0a0a;
  --surface: #111111;
  --surface-2: #161616;
  --surface-3: #1a1a1a;
  --border: rgba(255,255,255,0.06);
  --border-strong: rgba(255,255,255,0.1);
  --text: #f5f5f5;
  --text-sub: #a1a1aa;
  --text-muted: #71717a;
  --accent: #6366f1;
  --accent-soft: rgba(99,102,241,0.1);
  --shadow: 0 4px 24px -6px rgba(0,0,0,0.4);
}

[data-theme="light"] {
  --bg: #fafafa;
  --surface: #ffffff;
  --surface-2: #f4f4f5;
  --surface-3: #e4e4e7;
  --border: rgba(0,0,0,0.06);
  --border-strong: rgba(0,0,0,0.12);
  --text: #0a0a0a;
  --text-sub: #52525b;
  --text-muted: #a1a1aa;
  --accent: #4f46e5;
  --accent-soft: rgba(79,70,229,0.08);
  --shadow: 0 4px 24px -6px rgba(0,0,0,0.08);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
  font-feature-settings: 'cv11', 'ss01';
  -webkit-font-smoothing: antialiased;
  transition: background 0.3s ease, color 0.3s ease;
}

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ═══ LAYOUT ═══ */
.shell {
  max-width: 820px;
  margin: 0 auto;
  padding: 32px 24px 80px;
}

/* ═══ TOP BAR ═══ */
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 48px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: -0.01em;
}
.brand-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.topbar-actions { display: flex; gap: 6px; align-items: center; }
.icon-btn {
  width: 36px; height: 36px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-sub);
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s var(--ease);
  font-family: inherit;
}
.icon-btn:hover { color: var(--text); border-color: var(--border-strong); background: var(--surface-2); }
.clock {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text-muted);
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  font-variant-numeric: tabular-nums;
}

/* ═══ CHAT HERO ═══ */
.chat-hero {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 32px;
  margin-bottom: 48px;
  box-shadow: var(--shadow);
}
.chat-intro {
  margin-bottom: 28px;
}
.chat-intro h1 {
  font-size: clamp(28px, 5vw, 38px);
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1.1;
  margin-bottom: 10px;
  background: linear-gradient(180deg, var(--text) 0%, var(--text-sub) 140%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.chat-intro p {
  color: var(--text-sub);
  font-size: 15px;
  max-width: 560px;
}

.chat-thread {
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-height: 60px;
  margin-bottom: 20px;
}

.msg {
  display: flex;
  gap: 12px;
  animation: slideUp 0.4s var(--ease);
}
@keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.msg-avatar {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-sub);
}
.msg-avatar.bot {
  background: var(--accent-soft);
  color: var(--accent);
  border-color: transparent;
}

.msg-body {
  flex: 1;
  min-width: 0;
  padding-top: 3px;
}
.msg-role {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-sub);
  margin-bottom: 4px;
  font-family: var(--mono);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.msg-content {
  font-size: 14.5px;
  line-height: 1.6;
  color: var(--text);
}
.msg-content p + p { margin-top: 8px; }
.msg-content strong { color: var(--text); font-weight: 600; }
.msg-content a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }

.typing-cursor::after {
  content: '▊';
  color: var(--accent);
  margin-left: 2px;
  animation: blink 0.8s step-end infinite;
  font-weight: 400;
}
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

/* Rich elements inside messages */
.rich-card {
  margin-top: 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  overflow: hidden;
  background: var(--surface-2);
  transition: border-color 0.2s var(--ease);
}
.rich-card:hover { border-color: var(--border-strong); }

.rich-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 10px;
  margin-top: 14px;
}

/* Blog cards (inside chat & showcase) */
.blog-card {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  overflow: hidden;
  cursor: pointer;
  transition: all 0.25s var(--ease);
  display: flex;
  flex-direction: column;
}
.blog-card:hover { border-color: var(--border-strong); transform: translateY(-2px); box-shadow: var(--shadow); }
.blog-cover {
  aspect-ratio: 16 / 9;
  overflow: hidden;
  background: var(--surface-3);
  position: relative;
}
.blog-cover img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s ease; }
.blog-card:hover .blog-cover img { transform: scale(1.04); }
.blog-cover-fallback {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px;
  color: var(--text-sub);
}
.blog-info { padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.blog-title { font-size: 13px; font-weight: 600; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.blog-meta { font-size: 11px; color: var(--text-muted); font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.05em; }

/* Tool / action tiles */
.tile {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  cursor: pointer;
  transition: all 0.2s var(--ease);
  display: flex;
  flex-direction: column;
  gap: 2px;
  font-family: inherit;
  color: var(--text);
  text-align: left;
}
.tile:hover { border-color: var(--border-strong); background: var(--surface-3); transform: translateY(-1px); }
.tile-name { font-size: 13px; font-weight: 600; }
.tile-desc { font-size: 11px; color: var(--text-muted); }

/* Chat input */
.chat-input-shell {
  position: relative;
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 10px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  transition: border-color 0.2s var(--ease);
}
.chat-input-shell:focus-within { border-color: var(--accent); }
.chat-input {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
  padding: 8px 4px;
  line-height: 1.5;
}
.chat-input::placeholder { color: var(--text-muted); }
.chat-send {
  width: 36px;
  height: 36px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-family: inherit;
  font-weight: 700;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.2s var(--ease), transform 0.2s var(--ease);
  flex-shrink: 0;
}
.chat-send:hover { opacity: 0.9; }
.chat-send:active { transform: scale(0.95); }
.chat-send:disabled { opacity: 0.4; cursor: not-allowed; }

/* Suggestion chips */
.suggestions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 14px;
}
.chip {
  padding: 7px 14px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text-sub);
  font-size: 12px;
  font-weight: 500;
  border-radius: 999px;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s var(--ease);
}
.chip:hover { color: var(--text); border-color: var(--border-strong); background: var(--surface-3); }
.chip.accent { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }

/* Inline tool renderers (password, converter, etc.) */
.inline-tool {
  margin-top: 14px;
  padding: 16px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
}
.tool-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
.tool-row:last-child { margin-bottom: 0; }
.tool-input, .tool-select {
  padding: 9px 12px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  border-radius: var(--radius-sm);
  font-family: var(--mono);
  font-size: 13px;
  outline: none;
  transition: border-color 0.2s var(--ease);
}
.tool-input:focus, .tool-select:focus { border-color: var(--accent); }
.tool-input { flex: 1; min-width: 120px; }
.tool-btn {
  padding: 9px 16px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  transition: opacity 0.2s var(--ease);
}
.tool-btn:hover { opacity: 0.9; }
.tool-output {
  padding: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-family: var(--mono);
  font-size: 13px;
  color: var(--accent);
  text-align: center;
  word-break: break-all;
  cursor: pointer;
  transition: border-color 0.2s var(--ease);
}
.tool-output:hover { border-color: var(--accent); }
.tool-result {
  padding: 14px;
  background: var(--accent-soft);
  border-radius: var(--radius-sm);
  color: var(--accent);
  font-family: var(--mono);
  font-size: 18px;
  font-weight: 600;
  text-align: center;
}
.tool-tag {
  padding: 4px 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 999px;
  font-size: 11px;
  color: var(--text-sub);
  font-family: var(--mono);
  cursor: pointer;
  transition: all 0.2s var(--ease);
}
.tool-tag:hover, .tool-tag.active { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.tool-hint {
  font-size: 10px;
  color: var(--text-muted);
  font-family: var(--mono);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-top: 4px;
}
.color-preview {
  height: 50px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  margin-bottom: 8px;
  cursor: pointer;
}

/* ═══ SECTIONS ═══ */
.section { margin-bottom: 48px; }
.section-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-bottom: 20px;
  gap: 16px;
}
.section-head h2 {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.section-head .eyebrow {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-muted);
  font-weight: 600;
  font-family: var(--mono);
  margin-bottom: 4px;
}
.section-link {
  font-size: 12px;
  color: var(--text-sub);
  background: none;
  border: 1px solid var(--border);
  padding: 7px 14px;
  border-radius: 999px;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s var(--ease);
}
.section-link:hover { color: var(--text); border-color: var(--border-strong); }

/* Blog showcase row */
.blog-row {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 260px;
  gap: 14px;
  overflow-x: auto;
  padding: 4px 4px 12px;
  scroll-snap-type: x proximity;
}
.blog-row .blog-card { scroll-snap-align: start; }

/* Apps grid */
.apps-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 10px;
}
.app-tile {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 18px 12px 14px;
  cursor: pointer;
  transition: all 0.2s var(--ease);
  font-family: inherit;
  color: var(--text);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  text-align: center;
  animation: fade 0.4s var(--ease) backwards;
  animation-delay: var(--stagger, 0s);
}
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.app-tile:hover { border-color: var(--border-strong); background: var(--surface-2); transform: translateY(-2px); }
.app-icon {
  width: 40px; height: 40px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}
.app-icon.ai { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
.app-icon.notes { background: linear-gradient(135deg, #f59e0b, #f97316); }
.app-icon.tasks { background: linear-gradient(135deg, #10b981, #059669); }
.app-icon.convert { background: linear-gradient(135deg, #06b6d4, #3b82f6); }
.app-icon.games { background: linear-gradient(135deg, #ec4899, #f43f5e); }
.app-icon.pages { background: linear-gradient(135deg, #8b5cf6, #6366f1); }
.app-label { font-size: 12px; font-weight: 600; }
.app-sub { font-size: 10px; color: var(--text-muted); margin-top: 2px; }

/* Filter row */
.filter-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 18px;
}
.filter-btn {
  padding: 6px 12px;
  background: none;
  border: 1px solid var(--border);
  color: var(--text-sub);
  border-radius: 999px;
  cursor: pointer;
  font-family: inherit;
  font-size: 12px;
  transition: all 0.2s var(--ease);
}
.filter-btn:hover { color: var(--text); border-color: var(--border-strong); }
.filter-btn.active { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }

/* Footer ad */
.footer-ad {
  margin-top: 48px;
  padding: 24px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  min-height: 120px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ═══ MODAL ═══ */
.modal {
  position: fixed; inset: 0;
  z-index: var(--modal-z);
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s var(--ease);
  padding: 20px;
}
.modal.active { opacity: 1; pointer-events: all; }
.modal-box {
  width: 100%;
  max-width: 1200px;
  height: 90vh;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transform: scale(0.96);
  transition: transform 0.3s var(--ease);
}
.modal.active .modal-box { transform: scale(1); }
.modal-head {
  height: 44px;
  padding: 0 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.modal-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-sub);
  font-family: var(--mono);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.modal-close {
  width: 28px; height: 28px;
  background: none;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-sub);
  cursor: pointer;
  font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s var(--ease);
}
.modal-close:hover { color: var(--text); border-color: var(--border-strong); }
.modal-frame { flex: 1; border: none; background: #fff; width: 100%; }
.modal-loader {
  position: absolute; inset: 44px 0 0 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--surface);
  color: var(--text-sub);
  font-family: var(--mono);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* Toast */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 18px;
  color: var(--text);
  font-size: 13px;
  z-index: 2000;
  animation: toastIn 0.3s var(--ease);
  box-shadow: var(--shadow);
}
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

@media (max-width: 640px) {
  .shell { padding: 20px 16px 60px; }
  .chat-hero { padding: 24px 20px; }
  .topbar { margin-bottom: 32px; }
  .chat-intro h1 { font-size: 26px; }
  .rich-grid { grid-template-columns: 1fr; }
  .apps-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
  .blog-row { grid-auto-columns: 220px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>

<div class="shell">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <span>Digital Infohub</span>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="themeToggle" title="Toggle theme" aria-label="Toggle theme">
        <svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
      </button>
      <button class="icon-btn" id="notifToggle" title="Subscribe" aria-label="Subscribe">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
      </button>
      <div class="clock" id="clock">--:--</div>
    </div>
  </div>

  <!-- CHAT HERO -->
  <section class="chat-hero">
    <div class="chat-intro">

function tokenize(s) {
  return s.toLowerCase().replace(/[^\w\s]/g, '').split(/\s+/).filter(w => w.length > 1);
}

function scoreQuery(query, items) {
  const tokens = tokenize(query);
  if (!tokens.length) return [];
  const STOP = new Set(['the','a','an','is','are','was','were','be','been','can','could','will','would','should','do','does','did','have','has','had','i','you','he','she','we','they','me','my','your','this','that','of','in','on','at','to','for','with','by','from','it','its','and','or','but','so','then','than','now','please','show','give','open','launch','get','find','tell','look','see']);
  const qTokens = tokens.filter(t => !STOP.has(t));
  return items.map(item => {
    let score = 0;
    const kws = (item.keywords || []).map(k => k.toLowerCase());
    qTokens.forEach(qt => {
      kws.forEach(kw => {
        if (kw === qt) score += 3;
        else if (kw.startsWith(qt) || qt.startsWith(kw)) score += 1.5;
        else if (kw.includes(qt) || qt.includes(kw)) score += 0.8;
      });
    });
    // Name exact match bonus
    if (item.name) {
      const nameL = item.name.toLowerCase();
      qTokens.forEach(qt => { if (nameL === qt) score += 5; else if (nameL.includes(qt)) score += 2; });
    }
    return { item, score };
  }).filter(x => x.score > 0).sort((a, b) => b.score - a.score);
}

function detectIntent(query) {
  const q = query.toLowerCase();

  // Direct tool patterns
  const toolMatches = {
    password: /password|pw|pass/i,
    converter: /convert|converter|km|mile|celsius|fahrenheit|pound|kilogram/i,
    color: /color|colour|hex|rgb|hsl|pick/i,
    timer: /timer|pomodoro|focus|countdown/i,
    notes: /notes|note/i,
  };
  for (const [tool, re] of Object.entries(toolMatches)) {
    if (re.test(q)) return { type: 'tool', tool };
  }

  // Conversational fallbacks
  if (/^(hi|hey|hello|sup|yo)\b/.test(q)) return { type: 'greet' };
  if (/^(thanks|thank you|thx)/.test(q)) return { type: 'thanks' };
  if (/^(bye|goodbye|see you)/.test(q)) return { type: 'bye' };
  if (/who are you|what are you|your name/.test(q)) return { type: 'identity' };
  if (/help|what can you do|what do you do/.test(q)) return { type: 'help' };

  return { type: 'search' };
}

async function typeBot(html, el) {
  const target = el.querySelector('.msg-content');
  target.classList.add('typing-cursor');
  target.innerHTML = '';
  let i = 0, rendered = '';
  return new Promise(resolve => {
    const tick = () => {
      if (i >= html.length) { target.classList.remove('typing-cursor'); resolve(); return; }
      if (html[i] === '<') {
        const ci = html.indexOf('>', i);
        if (ci !== -1) { rendered += html.substring(i, ci + 1); i = ci + 1; }
        else { rendered += html[i]; i++; }
        target.innerHTML = rendered;
        requestAnimationFrame(tick);
        return;
      }
      rendered += html[i]; i++;
      target.innerHTML = rendered;
      const ch = html[i - 1];
      let delay = 10;
      if (ch === ' ') delay = 4;
      else if ('.!?'.includes(ch)) delay = 60;
      else if (ch === ',') delay = 30;
      delay += Math.random() * 8;
      setTimeout(tick, delay);
    };
    tick();
  });
}

        <span style="font-size:11px;color:var(--text-muted);font-family:var(--mono);">→</span>

          <option value="ft">Feet</option><option value="m">Meters</option>
          <option value="lb">Pounds</option><option value="kg">Kilograms</option>
          <option value="f">Fahrenheit</option><option value="c">Celsius</option>
        </select>
      </div>
      <div class="tool-result" id="convResult" style="margin-top:12px;">0.621 mi</div>

}

/* Wire up interactive tools after injection */
function wireTools(root) {
  // Password
  const pwTool = root.querySelector('#pwTool');
  if (pwTool) {
    const opts = { upper: true, lower: true, nums: true, syms: true };
    const CS = { upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', lower: 'abcdefghijklmnopqrstuvwxyz', nums: '0123456789', syms: '!@#$%^&*()_+-=[]{}|;:,.<>?' };
    const lenEl = pwTool.querySelector('#pwLen');
    const lenVal = pwTool.querySelector('#pwLenVal');
    const out = pwTool.querySelector('#pwOut');
    const gen = () => {
      let chars = '';
      if (opts.upper) chars += CS.upper;
      if (opts.lower) chars += CS.lower;
      if (opts.nums) chars += CS.nums;
      if (opts.syms) chars += CS.syms;
      if (!chars) { out.textContent = 'Select options'; return; }
      const arr = new Uint32Array(parseInt(lenEl.value));
      crypto.getRandomValues(arr);
      let pw = '';
      for (let i = 0; i < arr.length; i++) pw += chars[arr[i] % chars.length];
      out.textContent = pw;
    };
    lenEl.oninput = () => lenVal.textContent = lenEl.value;
    pwTool.querySelectorAll('.tool-tag').forEach(b => b.onclick = () => {
      opts[b.dataset.opt] = !opts[b.dataset.opt];
      b.classList.toggle('active', opts[b.dataset.opt]);
    });
    pwTool.querySelector('#pwGen').onclick = gen;
    out.onclick = () => {
      if (out.textContent && out.textContent !== 'Click Generate' && out.textContent !== 'Select options') {
        navigator.clipboard.writeText(out.textContent);
        toast('Copied to clipboard');
      }
    };
    gen();
  }

  // Converter
  const convTool = root.querySelector('#convTool');
  if (convTool) {
    const C = { km: { mi: 0.621371, m: 1000, ft: 3280.84 }, mi: { km: 1.60934, m: 1609.34, ft: 5280 }, m: { km: 0.001, mi: 0.000621371, ft: 3.28084 }, ft: { km: 0.0003048, mi: 0.000189394, m: 0.3048 }, kg: { lb: 2.20462 }, lb: { kg: 0.453592 }, c: { f: 'c2f' }, f: { c: 'f2c' } };
    const upd = () => {
      const v = parseFloat(convTool.querySelector('#convIn').value);
      const f = convTool.querySelector('#convFrom').value;
      const t = convTool.querySelector('#convTo').value;
      if (isNaN(v)) { convTool.querySelector('#convResult').textContent = '--'; return; }
      const tb = C[f]; const fc = tb?.[t];
      if (!fc) { convTool.querySelector('#convResult').textContent = 'N/A'; return; }
      let r;
      if (fc === 'c2f') r = (v * 9 / 5) + 32;
      else if (fc === 'f2c') r = (v - 32) * 5 / 9;
      else r = v * fc;
      const lb = { km: 'km', mi: 'mi', m: 'm', ft: 'ft', kg: 'kg', lb: 'lb', c: '°C', f: '°F' };
      convTool.querySelector('#convResult').textContent = `${parseFloat(r.toFixed(4))} ${lb[t]}`;
    };
    convTool.querySelectorAll('input, select').forEach(el => el.oninput = upd);
    upd();
  }

  // Color
  const colorTool = root.querySelector('#colorTool');
  if (colorTool) {
    const upd = () => {
      const hex = colorTool.querySelector('#colorIn').value;
      colorTool.querySelector('#colorPrev').style.background = hex;
      colorTool.querySelector('#colorHex').textContent = hex;
      const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
      colorTool.querySelector('#colorRgb').textContent = `rgb(${r},${g},${b})`;
    };
    colorTool.querySelector('#colorIn').oninput = upd;
    colorTool.querySelectorAll('.tool-output').forEach(o => o.onclick = () => {
      navigator.clipboard.writeText(o.textContent);
      toast('Copied');
    });
    colorTool.querySelector('#colorPrev').onclick = () => colorTool.querySelector('#colorIn').click();
    upd();
  }

  // Timer
  const timerTool = root.querySelector('#timerTool');
  if (timerTool) {
    let t = 25 * 60, int = null, running = false;
    const disp = timerTool.querySelector('#timerDisplay');
    const startBtn = timerTool.querySelector('#timerStart');
    const upd = () => disp.textContent = `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`;
    startBtn.onclick = () => {
      if (running) { clearInterval(int); startBtn.textContent = 'Resume'; }
      else { int = setInterval(() => { if (t <= 0) { clearInterval(int); running = false; toast('Time up!'); return; } t--; upd(); }, 1000); startBtn.textContent = 'Pause'; }
      running = !running;
    };
    timerTool.querySelector('#timerReset').onclick = () => {
      clearInterval(int); running = false; t = 25 * 60; upd(); startBtn.textContent = 'Start';
    };
  }

  // Blog card clicks inside messages
  root.querySelectorAll('[data-blog-idx]').forEach(card => {
    card.onclick = () => {
      const post = cachedBlogs[parseInt(card.dataset.blogIdx)];
      if (post) openEmbed(post.link, post.title);
    };
  });

  // Tool tile clicks
  root.querySelectorAll('[data-app]').forEach(tile => {
    tile.onclick = () => {
      const app = APPS.find(a => a.name === tile.dataset.app);
      if (app) launchApp(app);
    };
  });
}

/* ═══ RESPONSE BUILDER ═══ */
async function buildResponse(query) {
  const intent = detectIntent(query);

  if (intent.type === 'greet') {
    return `<p>Hey there! I'm <strong>Digital Infohub</strong> — your assistant for everything on this site.</p>
      <p>I can show you blogs, launch tools, fetch news, generate passwords, and more. Try a suggestion below, or just ask naturally.</p>`;
  }
  if (intent.type === 'thanks') return `<p>You're welcome! Let me know if there's anything else.</p>`;
  if (intent.type === 'bye') return `<p>See you next time 👋</p>`;
  if (intent.type === 'identity') return `<p>I'm <strong>Digital Infohub</strong> — an AI assistant built into this dashboard. I can search articles, launch tools, and help you navigate everything on the site.</p>`;
  if (intent.type === 'help') {
    return `<p>Here's what I can do:</p>
      <p>• <strong>Show blogs & articles</strong> — "show me blogs about AI"<br>
      • <strong>Launch tools</strong> — "open games", "open Scout"<br>
      • <strong>Fetch news</strong> — "tech news", "crypto news"<br>
      • <strong>Run utilities</strong> — "generate password", "convert 10 km to miles", "pick a color", "start a timer"<br>
      • <strong>Navigation</strong> — "subscribe", "donate", "about"</p>`;
  }

  if (intent.type === 'tool') {
    if (intent.tool === 'password') return `<p>Here's a secure password generator. I use cryptographically strong randomness:</p>${renderPasswordTool()}`;
    if (intent.tool === 'converter') return `<p>Here's a unit converter. Works with length, weight, and temperature:</p>${renderConverterTool()}`;
    if (intent.tool === 'color') return `<p>Here's a color picker. Click any value to copy:</p>${renderColorTool()}`;
    if (intent.tool === 'timer') return `<p>Here's a focus timer (Pomodoro, 25 min):</p>${renderTimerTool()}`;
    if (intent.tool === 'notes') return `<p>Opening QuickNotes for you…</p>`;
  }

  // Search phase: score against all knowledge
  const toolScores = scoreQuery(query, KNOWLEDGE.tools);
  const feedScores = scoreQuery(query, KNOWLEDGE.feeds);
  const actionScores = scoreQuery(query, KNOWLEDGE.actions);
  const blogScores = scoreQuery(query, cachedBlogs.map(b => ({ ...b, name: b.title })));

  const bestTool = toolScores[0];
  const bestFeed = feedScores[0];
  const bestAction = actionScores[0];
  const bestBlog = blogScores[0];

  // Determine dominant match
  const candidates = [
    bestTool && { type: 'tool', score: bestTool.score, data: bestTool.item },
    bestFeed && { type: 'feed', score: bestFeed.score, data: bestFeed.item },
    bestAction && { type: 'action', score: bestAction.score, data: bestAction.item },
    bestBlog && { type: 'blog', score: bestBlog.score, data: bestBlog.item }
  ].filter(Boolean).sort((a, b) => b.score - a.score);

  // Strong single match: tool with score > 4 and > 2x second best
  if (candidates[0] && candidates[0].type === 'tool' && candidates[0].score >= 4) {
    const t = candidates[0].data;
    const top3 = toolScores.slice(0, 3);
    let html = `<p>Opening <strong>${esc(t.name)}</strong> for you. ${esc(t.desc)}.</p>`;
    if (top3.length > 1) {
      html += `<p style="font-size:12px;color:var(--text-muted);margin-top:8px;">You might also like:</p>`;
      html += renderToolTiles(top3.slice(1).map(x => x.item), 3);
    }
    setTimeout(() => launchApp(t), 800);
    return html;
  }

  // Blog query
  const qL = query.toLowerCase();
  const isBlogQuery = /blog|post|article|written|writing/.test(qL);
  if (isBlogQuery || (candidates[0]?.type === 'blog' && candidates[0].score >= 2)) {
    const blogsToShow = isBlogQuery
      ? (blogScores.length ? blogScores.map(x => x.data).slice(0, 6) : cachedBlogs.slice(0, 6))
      : [candidates[0].data, ...(blogScores.slice(1, 5).map(x => x.data))];
    if (blogsToShow.length === 0) {
      return `<p>Sorry, I couldn't find any matching blog posts right now. Try "show me blogs" to see everything.</p>`;
    }
    return `<p>Here are the blog posts I found:</p>${renderBlogCards(blogsToShow)}`;
  }

  // Feed query
  if (candidates[0]?.type === 'feed' && candidates[0].score >= 2) {
    const feed = candidates[0].data;
    const articles = await loadFeed(feed.id);
    if (articles.length) {
      return `<p>Here are the latest from <strong>${esc(feed.name)}</strong>:</p>${renderFeed(articles, feed.name)}`;
    }
    return `<p>Couldn't load ${esc(feed.name)} right now. Try again in a moment.</p>`;
  }

  // Action query
  if (candidates[0]?.type === 'action' && candidates[0].score >= 2) {
    const a = candidates[0].data;
    let html = `<p>${esc(a.desc)}:</p><div class="rich-grid"><button class="tile" data-action="${a.id}"><div class="tile-name">${esc(a.label)}</div></button></div>`;
    return html;
  }

  // Generic tool match with moderate confidence
  if (candidates[0]?.type === 'tool' && candidates[0].score >= 2) {
    const matches = toolScores.slice(0, 4);
    let html = `<p>I found a few tools that might match what you're looking for:</p>`;
    html += renderToolTiles(matches.map(x => x.item), 4);
    return html;
  }

  // Fallback: try blog as last resort if we have any
  if (cachedBlogs.length && !isBlogQuery) {
    return `<p>I'm not sure I understand that one. Here's what I can help with:</p>
      <p>• Ask for <strong>blogs</strong>, <strong>news</strong>, or a specific <strong>tool</strong><br>
      • Say <strong>"help"</strong> to see everything I can do</p>
      <p style="font-size:12px;color:var(--text-muted);margin-top:8px;">Or try one of these:</p>
      ${renderToolTiles(APPS.slice(0, 4), 4)}`;
  }

  return `<p>I'm not sure what you mean. Try asking for a tool, blog, or news feed, or say <strong>"help"</strong>.</p>`;
}

/* Handle action tile clicks (subscribe/donate/etc) */
chatThread.addEventListener('click', e => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const id = btn.dataset.action;
  if (id === 'subscribe') openEmbed('/subscribe', 'Subscribe');
  else if (id === 'donate') window.open('https://www.paypal.com/ncp/payment/QTX8WWTX8SBAG', '_blank', 'noopener');
  else if (id === 'advertise') window.location.href = 'mailto:services@digitalinfohub.net?subject=Advertising%20Inquiry';
  else if (id === 'about') openEmbed('/about', 'About Digital Infohub');
});

/* ═══ SEND ═══ */
async function handleSend() {
  const text = chatInput.value.trim();
  if (!text || isTyping) return;
  addUserMsg(text);
  chatInput.value = '';
  isTyping = true;
  chatSend.disabled = true;

  const botMsg = addMsg('bot', '');
  const html = await buildResponse(text);
  await typeBot(html, botMsg);
  wireTools(botMsg);

  isTyping = false;
  chatSend.disabled = false;
  chatInput.focus();
}

chatForm.onsubmit = e => { e.preventDefault(); handleSend(); };

/* Suggestions */
$$('#suggestions .chip').forEach(chip => {
  chip.onclick = () => {
    chatInput.value = chip.dataset.q;
    handleSend();
  };
});

/* Welcome message */
(async () => {
  isTyping = true;
  chatSend.disabled = true;
  const msg = addMsg('bot', '');
  await new Promise(r => setTimeout(r, 300));
  await typeBot(`<p>Welcome to <strong>Digital Infohub</strong>. I can show you blogs, launch tools, fetch news, and more — just ask.</p><p>Try something like <em>"show me blogs"</em>, <em>"open games"</em>, or <em>"generate a password"</em>.</p>`, msg);
  wireTools(msg);
  isTyping = false;
  chatSend.disabled = false;
})();
</script>
