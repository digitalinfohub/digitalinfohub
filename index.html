<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="Digital Infohub OS: A premium, macOS-inspired AI research terminal for real-time markets, tech insights, and productivity.">
<title>Digital Infohub OS | AI Research Terminal</title>

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5443646750699471" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link rel="icon" href="https://static.wixstatic.com/media/94ccfe_dec2763dd58148e78d3d8aaef72cf2fe~mv2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
  --mono: 'JetBrains Mono', monospace;
  --ease: cubic-bezier(0.16, 1, 0.3, 1); 
  --radius: 16px; --radius-sm: 10px; --radius-pill: 99px;
  --glow-color: 59, 130, 246; 
  --topbar-h: 48px;
  --glass-bg: rgba(30, 30, 30, 0.6);
  --glass-border: rgba(255, 255, 255, 0.1);
  --glass-highlight: rgba(255, 255, 255, 0.05);
}

[data-theme="dark"] {
  --bg: #050505; --surface: rgba(28, 28, 28, 0.7); --surface-2: rgba(44, 44, 46, 0.6); --surface-3: rgba(58, 58, 60, 0.5);
  --border: rgba(255,255,255,0.08); --border-strong: rgba(255,255,255,0.15);
  --text: #F5F5F7; --text-sub: #A1A1A6; --text-muted: #6E6E73;
  --accent: #0A84FF; --accent-soft: rgba(10,132,255,0.15); --accent-glow: rgba(10,132,255,0.3);
  --green: #30D158; --red: #FF453A; --orange: #FF9F0A;
}

[data-theme="light"] {
  --bg: #F5F5F7; --surface: rgba(255, 255, 255, 0.7); --surface-2: rgba(245, 245, 247, 0.8); --surface-3: rgba(230, 230, 232, 0.6);
  --border: rgba(0,0,0,0.06); --border-strong: rgba(0,0,0,0.1);
  --text: #1D1D1F; --text-sub: #515154; --text-muted: #86868B;
  --accent: #007AFF; --accent-soft: rgba(0,122,255,0.1); --accent-glow: rgba(0,122,255,0.2);
  --green: #28A745; --red: #FF3B30; --orange: #FF9500;
  --glass-bg: rgba(255, 255, 255, 0.6);
  --glass-border: rgba(0, 0, 0, 0.08);
  --glass-highlight: rgba(255, 255, 255, 0.5);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
*:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
html, body { height: 100%; height: 100dvh; font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.6; -webkit-font-smoothing: antialiased; overflow: hidden; }

/* macOS Style Wallpaper/Background */
body::before {
  content: ''; position: fixed; inset: 0; z-index: -1;
  background: radial-gradient(circle at 20% 20%, rgba(10, 132, 255, 0.15) 0%, transparent 50%),
              radial-gradient(circle at 80% 80%, rgba(255, 69, 58, 0.1) 0%, transparent 50%),
              radial-gradient(circle at 50% 50%, rgba(48, 209, 88, 0.05) 0%, transparent 70%);
}

/* OS TOPBAR (macOS Menu Bar Style) */
.os-topbar { 
  height: var(--topbar-h); 
  background: var(--glass-bg); 
  backdrop-filter: blur(30px) saturate(180%); 
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  border-bottom: 1px solid var(--glass-border); 
  display: flex; align-items: center; padding: 0 16px; z-index: 100; flex-shrink: 0; gap: 16px; 
}
.os-logo { font-weight: 700; font-size: 14px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; color: var(--text); }
.os-logo-icon { width: 20px; height: 20px; background: linear-gradient(135deg, var(--accent), #5E5CE6); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: white; }
.ticker-shell { flex: 1; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; mask-image: linear-gradient(90deg, transparent, black 5%, black 95%, transparent); }
.ticker-shell::-webkit-scrollbar { display: none; }
.ticker-bar { display: inline-flex; padding: 6px 0; animation: scroll 60s linear infinite; }
@keyframes scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
.ticker-item { display: inline-flex; align-items: center; gap: 6px; padding: 0 16px; font-size: 11px; font-family: var(--mono); color: var(--text-sub); border-right: 1px solid var(--border); white-space: nowrap; }
.ticker-item strong { color: var(--text); font-weight: 600; }
.ticker-item .up { color: var(--green); } .ticker-item .down { color: var(--red); }
.os-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
.os-btn { 
  height: 28px; padding: 0 12px; background: var(--glass-highlight); border: 1px solid var(--glass-border); color: var(--text-sub); 
  border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; 
  font-size: 12px; font-weight: 500; font-family: var(--font); gap: 6px; backdrop-filter: blur(10px);
}
.os-btn:hover { background: rgba(255,255,255,0.1); color: var(--text); }
.os-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
.os-clock { font-family: var(--mono); font-size: 11px; color: var(--text-sub); padding: 4px 10px; border: 1px solid var(--glass-border); border-radius: 6px; background: var(--glass-highlight); }

/* OS DESKTOP & DESKTOP ICONS */
.os-desktop { flex: 1; display: flex; flex-direction: column; height: calc(100dvh - var(--topbar-h)); position: relative; overflow: hidden; }
.chat-container { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding: 24px 16px; scroll-behavior: smooth; position: relative; }
.chat-thread { width: 100%; max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; position: relative; z-index: 2; }

/* Desktop Folders (macOS style) */
.desktop-icons { position: absolute; top: 24px; right: 24px; display: flex; flex-direction: column; gap: 24px; z-index: 1; }
.desktop-folder { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; transition: transform 0.2s var(--ease); }
.desktop-folder:hover { transform: scale(1.05); }
.desktop-folder:active { transform: scale(0.95); }
.desktop-folder-icon { 
  width: 64px; height: 64px; background: var(--glass-bg); backdrop-filter: blur(20px) saturate(180%); 
  border: 1px solid var(--glass-border); border-radius: 16px; display: flex; align-items: center; justify-content: center; 
  font-size: 32px; box-shadow: 0 8px 24px rgba(0,0,0,0.2); transition: all 0.2s;
}
.desktop-folder:hover .desktop-folder-icon { box-shadow: 0 12px 32px rgba(0,0,0,0.3); border-color: var(--accent); }
.desktop-folder-label { font-size: 11px; color: var(--text); font-weight: 500; text-shadow: 0 1px 4px rgba(0,0,0,0.5); background: rgba(0,0,0,0.3); padding: 2px 8px; border-radius: 4px; }

/* AD CONTAINERS */
.ad-container { width: 100%; max-width: 760px; margin: 0 auto 20px; min-height: 90px; background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: var(--radius); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
.ad-label { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: var(--surface-3); border: 1px solid var(--border); font-size: 9px; color: var(--text-muted); padding: 2px 8px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; z-index: 2; }
.ad-container.bottom-ad { margin: 12px auto; min-height: 60px; max-width: 600px; }

/* CHAT MESSAGES (Glassmorphic Bubbles) */
.msg { display: flex; gap: 12px; animation: fadeInUp 0.4s var(--ease); max-width: 100%; word-wrap: break-word; }
.msg.user { flex-direction: row-reverse; }
@keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.msg-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--glass-border); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; overflow: hidden; }
.msg-avatar.bot { background: linear-gradient(135deg, rgba(10,132,255,0.2), rgba(94,92,230,0.2)); border-color: rgba(10,132,255,0.3); color: var(--accent); }
.msg-avatar img { width: 100%; height: 100%; object-fit: cover; }
.msg-body { flex: 1; min-width: 0; }
.msg-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.msg-role { font-size: 12px; font-weight: 600; color: var(--text); }
.msg-time { font-size: 10px; color: var(--text-muted); font-family: var(--mono); }
.msg-content { font-size: 14px; line-height: 1.7; color: var(--text); }
.msg.user .msg-content { background: var(--accent); color: white; padding: 12px 16px; border-radius: 18px 18px 4px 18px; display: inline-block; max-width: 100%; box-shadow: 0 4px 12px rgba(10,132,255,0.2); }
.msg.bot .msg-content { background: var(--glass-bg); backdrop-filter: blur(20px) saturate(180%); padding: 16px; border-radius: 18px 18px 18px 4px; border: 1px solid var(--glass-border); box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
.msg-content p + p { margin-top: 12px; }
.msg-content strong { color: var(--text); font-weight: 700; }
.msg-content a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-soft); }
.msg-content ul { margin-left: 20px; margin-top: 12px; color: var(--text-sub); font-size: 13px; line-height: 1.8; }
.msg-content ul li { margin-bottom: 6px; }
.msg-content.data-fade-in { animation: fadeInUp 0.4s var(--ease) forwards; }

/* AI INSIGHT & DATA CARDS */
.ai-insight-box { background: linear-gradient(135deg, rgba(10,132,255,0.08), rgba(94,92,230,0.08)); border: 1px solid rgba(10,132,255,0.2); border-radius: 12px; padding: 16px; margin-top: 16px; backdrop-filter: blur(10px); }
.ai-insight-box h4 { font-size: 13px; font-weight: 700; color: var(--accent); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.ai-insight-box p { font-size: 13px; color: var(--text-sub); line-height: 1.6; margin: 0; }

/* MARKET GRID (FIXED HORIZONTAL LAYOUT) */
.market-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 12px; }
.market-item { 
  display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; 
  background: var(--glass-highlight); border: 1px solid var(--glass-border); border-radius: 12px; 
  cursor: pointer; transition: all 0.2s; gap: 12px; backdrop-filter: blur(10px);
}
.market-item:hover { background: rgba(255,255,255,0.08); border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
.market-info { display: flex; flex-direction: column; min-width: 0; flex-shrink: 0; }
.market-symbol { font-size: 14px; font-weight: 700; color: var(--text); font-family: var(--mono); white-space: nowrap; }
.market-name { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.market-sparkline-wrapper { flex: 1; display: flex; justify-content: center; min-width: 40px; }
.market-sparkline { width: 100%; max-width: 60px; height: 30px; }
.market-price-area { text-align: right; display: flex; flex-direction: column; align-items: flex-end; flex-shrink: 0; }
.market-price { font-size: 14px; font-weight: 700; color: var(--text); white-space: nowrap; }
.market-change { font-size: 11px; font-weight: 600; white-space: nowrap; }
.market-change.up { color: var(--green); } .market-change.down { color: var(--red); }

.news-card { display: block; padding: 16px; background: var(--glass-highlight); border: 1px solid var(--glass-border); border-radius: 12px; text-decoration: none; color: var(--text); transition: all 0.2s; margin-bottom: 12px; backdrop-filter: blur(10px); }
.news-card:hover { border-color: var(--accent); background: rgba(255,255,255,0.08); }
.news-category { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
.news-title { font-size: 14px; font-weight: 600; line-height: 1.4; margin-bottom: 8px; }
.news-tldr { font-size: 12px; color: var(--text-sub); line-height: 1.5; padding: 10px; background: var(--surface-3); border-radius: 8px; border-left: 2px solid var(--accent); }

.chat-follow-ups { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.follow-up-btn { background: var(--glass-highlight); border: 1px solid var(--glass-border); color: var(--text-sub); padding: 8px 14px; border-radius: var(--radius-pill); font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.2s; font-family: var(--font); backdrop-filter: blur(10px); }
.follow-up-btn:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

.research-steps { display: flex; flex-direction: column; gap: 6px; font-family: var(--mono); font-size: 11px; color: var(--text-sub); padding: 10px 0; }
.step { display: flex; align-items: center; gap: 8px; }
.step.active { color: var(--accent); font-weight: 600; }
.step.done { color: var(--text-sub); opacity: 0.6; }
.step.done .step-icon { color: var(--green); }

/* INPUT AREA (macOS Spotlight / Floating Bar) */
.os-input-area { flex-shrink: 0; padding: 12px 16px max(12px, env(safe-area-inset-bottom)); background: transparent; z-index: 50; display: flex; justify-content: center; }
.input-wrapper { max-width: 760px; width: 100%; position: relative; }
.input-shell { 
  background: var(--glass-bg); backdrop-filter: blur(30px) saturate(180%); 
  border: 1px solid var(--glass-border); border-radius: 20px; padding: 6px 6px 6px 20px; 
  display: flex; align-items: center; gap: 10px; transition: all 0.3s var(--ease); 
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}
.input-shell:focus-within { border-color: var(--accent); box-shadow: 0 10px 40px rgba(10,132,255,0.2), 0 0 0 4px var(--accent-glow); }
.ai-input { flex: 1; background: none; border: none; outline: none; color: var(--text); font-size: 15px; font-weight: 400; font-family: inherit; min-width: 0; padding: 10px 0; }
.ai-input::placeholder { color: var(--text-muted); }
.ai-send { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: white; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; font-size: 16px; flex-shrink: 0; box-shadow: 0 4px 12px rgba(10,132,255,0.3); }
.ai-send:hover:not(:disabled) { transform: scale(1.05); }
.ai-send:disabled { opacity: 0.3; cursor: not-allowed; }

/* WIDGETS (macOS Window Style) */
.widget-layer { position: fixed; inset: 0; pointer-events: none; z-index: 9999; }
.floating-widget { 
  position: fixed; width: 320px; background: var(--glass-bg); backdrop-filter: blur(40px) saturate(180%); 
  border: 1px solid var(--glass-border); border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.4); 
  pointer-events: auto; display: flex; flex-direction: column; overflow: hidden; animation: widgetPopIn 0.4s var(--ease); z-index: 10000; transition: box-shadow 0.2s; 
}
.floating-widget:hover { box-shadow: 0 25px 60px rgba(0,0,0,0.5); }
@keyframes widgetPopIn { 0% { opacity: 0; transform: scale(0.9) translateY(20px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
.widget-header { 
  padding: 10px 14px; background: rgba(255,255,255,0.03); border-bottom: 1px solid var(--glass-border); 
  display: flex; justify-content: space-between; align-items: center; cursor: grab; user-select: none; 
}
.widget-header:active { cursor: grabbing; }
.widget-title { font-size: 13px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 8px; }
.widget-close { background: #FF5F56; border: none; color: transparent; cursor: pointer; font-size: 12px; width: 12px; height: 12px; border-radius: 50%; transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
.widget-close:hover { background: #FF5F56; color: white; }
.widget-body { padding: 16px; flex: 1; overflow-y: auto; max-height: 60vh; }

/* MODALS (Glassmorphic) */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); z-index: 5000; display: none; align-items: center; justify-content: center; padding: 20px; }
.modal-overlay.active { display: flex; animation: fadeIn 0.2s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-content { width: 100%; max-width: 600px; background: var(--glass-bg); backdrop-filter: blur(40px) saturate(180%); border: 1px solid var(--glass-border); border-radius: 16px; overflow: hidden; max-height: 80vh; display: flex; flex-direction: column; box-shadow: 0 30px 80px rgba(0,0,0,0.5); }
.modal-header { padding: 16px 20px; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; }
.modal-header h2 { font-size: 16px; font-weight: 700; font-family: var(--font); }
.modal-body { padding: 20px; overflow-y: auto; flex: 1; }
.app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 20px; }
.app-card { background: var(--glass-highlight); border: 1px solid var(--glass-border); border-radius: 16px; padding: 20px 12px; text-align: center; cursor: pointer; transition: all 0.2s; backdrop-filter: blur(10px); }
.app-card:hover { background: rgba(255,255,255,0.1); transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
.app-icon { font-size: 36px; margin-bottom: 10px; display: block; }
.app-name { font-size: 13px; font-weight: 600; }
.app-status { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
.app-status.installed { color: var(--green); }

#toast-container { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); z-index: 10000; display: flex; flex-direction: column; gap: 8px; pointer-events: none; width: 90%; max-width: 400px; }

@media (max-width: 767px) {
  .os-topbar { padding: 0 12px; gap: 8px; }
  .os-logo { font-size: 12px; }
  .os-btn { padding: 0 10px; font-size: 11px; height: 26px; }
  .os-clock { display: none; }
  .chat-container { padding: 16px 12px; }
  .msg { gap: 10px; }
  .desktop-icons { top: 12px; right: 12px; gap: 16px; }
  .desktop-folder-icon { width: 48px; height: 48px; font-size: 24px; border-radius: 12px; }
  .desktop-folder-label { font-size: 10px; }
  .floating-widget { width: 92vw !important; max-width: 360px !important; left: 50% !important; top: 50% !important; transform: translate(-50%, -50%) !important; max-height: 75vh; }
  .widget-header { cursor: default; }
  .market-grid { grid-template-columns: 1fr; }
  .market-sparkline-wrapper { display: none; } /* Hide sparklines on small screens to save space */
}
</style>
</head>
<body>

<!-- OS TOPBAR -->
<header class="os-topbar">
  <div class="os-logo"><div class="os-logo-icon">◆</div> Digital Infohub</div>
  <div class="ticker-shell"><div class="ticker-bar" id="tickerBar"></div></div>
  <div class="os-actions">
    <button class="os-btn" onclick="window.openAppStore()">📦 Apps</button>
    <button class="os-btn" onclick="window.toggleTheme()">◑</button>
    <div class="os-clock" id="clock">--:--</div>
  </div>
</header>

<!-- OS DESKTOP -->
<main class="os-desktop">
  <div class="chat-container" id="chatContainer">
    <!-- Desktop Folders (macOS Style) -->
    <div class="desktop-icons">
      <div class="desktop-folder" onclick="window.handleSend('Market briefing')">
        <div class="desktop-folder-icon">📊</div>
        <div class="desktop-folder-label">Markets</div>
      </div>
      <div class="desktop-folder" onclick="window.handleSend('Latest tech news')">
        <div class="desktop-folder-icon">💡</div>
        <div class="desktop-folder-label">News</div>
      </div>
      <div class="desktop-folder" onclick="window.handleSend('Show investing tips')">
        <div class="desktop-folder-icon">🧠</div>
        <div class="desktop-folder-label">Insights</div>
      </div>
      <div class="desktop-folder" onclick="window.openAppStore()">
        <div class="desktop-folder-icon">📦</div>
        <div class="desktop-folder-label">Apps</div>
      </div>
    </div>

    <!-- Top Ad -->
    <div class="ad-container">
      <span class="ad-label">Sponsored</span>
      <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-5443646750699471" data-ad-slot="4228545300" data-ad-format="auto" data-full-width-responsive="true"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>

    <div class="chat-thread" id="chatThread" role="log"></div>
    
    <!-- Bottom Ad -->
    <div class="ad-container" style="min-height: 250px; margin-top: 32px;">
      <span class="ad-label">Sponsored Insight</span>
      <ins class="adsbygoogle" style="display:block; text-align:center;" data-ad-layout="in-article" data-ad-format="fluid" data-ad-client="ca-pub-5443646750699471" data-ad-slot="6977708598"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>
  </div>

  <!-- Horizontal Fixed Ad -->
  <div class="ad-container bottom-ad">
    <ins class="adsbygoogle" style="display:inline-block;width:300px;height:90px" data-ad-client="ca-pub-5443646750699471" data-ad-slot="5114952266"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
  </div>

  <!-- INPUT AREA -->
  <div class="os-input-area">
    <div class="input-wrapper">
      <form class="input-shell" id="chatForm" autocomplete="off">
        <input class="ai-input" id="chatInput" type="text" placeholder="Ask anything... (e.g., 'Market briefing', 'Install Weather')" aria-label="Message">
        <button class="ai-send" id="chatSend" type="submit" aria-label="Send">→</button>
      </form>
    </div>
  </div>

function showToast(message, type = 'success') {

function createSparklineSVG(isUp) {
  const points = 20; let path = "M 0 50 "; let y = 50; const trend = isUp ? -1.5 : 1.5;
  for (let i = 1; i <= points; i++) { 
    const x = (i / points) * 100; 
    y = Math.max(10, Math.min(90, y + trend + (Math.random() - 0.5) * 15)); 
    path += `L ${x} ${y} `; 
  }
  const color = isUp ? 'var(--green)' : 'var(--red)'; 
  const gid = isUp ? 'gU' : 'gD';
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="none" class="market-sparkline">

    <path d="${path} L 100 100 L 0 100 Z" fill="url(#${gid})" />

  </svg>`;
}

async function fetchStocks(tickers = CONFIG.STOCK_TICKERS) {
  try {
    const results = await Promise.allSettled(tickers.map(sym => fetch(`https://finnhub.io/api/v1/quote?symbol=${sym}&token=${CONFIG.FINNHUB_KEY}`).then(r => r.json()).then(data => ({ sym, data }))));
    return results.filter(r => r.status === 'fulfilled' && r.value.data?.c).map(r => ({ symbol: r.value.sym, price: r.value.data.c.toFixed(2), changePct: (r.value.data.dp||0).toFixed(2), up: (r.value.data.d||0) >= 0 }));
  } catch(e) { return []; }
}

async function fetchCrypto(symbols = ['BTC','ETH','SOL','XRP']) {
  const ids = symbols.map(s => ({ 'BTC':'bitcoin', 'ETH':'ethereum', 'SOL':'solana', 'XRP':'ripple' }[s])).filter(Boolean);
  try {
    const r = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids.join(',')}&vs_currencies=usd&include_24hr_change=true`);
    const data = await r.json();
    return symbols.map(sym => {
      const id = { 'BTC':'bitcoin', 'ETH':'ethereum', 'SOL':'solana', 'XRP':'ripple' }[sym];
      if (data[id]) return { symbol: sym, price: data[id].usd.toLocaleString('en-US',{minimumFractionDigits:2}), changePct: (data[id].usd_24h_change||0).toFixed(2), up: (data[id].usd_24h_change||0) >= 0 };
      return null;
    }).filter(Boolean);
  } catch(e) { return []; }
}

async function fetchRSS(url, categoryName) {
  try {
    const r = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`);
    const data = await r.json();
    return (data.items || []).slice(0, 3).map(i => {
      let desc = (i.description || '').replace(/<[^>]*>/g, '').trim();
      return { title: i.title.replace(/<[^>]*>/g, '').trim(), link: i.link, date: new Date(i.pubDate).toLocaleDateString('en-US', { month:'short', day:'numeric' }), source: categoryName, tldr: desc.substring(0, 140) + '...' };
    });
  } catch(e) { return []; }
}

function renderChart(price, isUp, timeframe) {
  const ctx = $('#priceChart').getContext('2d');
  if (chartInstance) chartInstance.destroy();
  
  const points = timeframe === '1D' ? 24 : timeframe === '1W' ? 7 : 30;
  const labels = [], data = [];
  let p = price * (isUp ? 0.95 : 1.05);
  
  for (let i = 0; i < points; i++) {
    p += (Math.random() - (isUp ? 0.4 : 0.6)) * (price * 0.02);
    data.push(p);
    labels.push(timeframe === '1D' ? `${i}:00` : `D${i+1}`);
  }
  data[data.length - 1] = price;
  
  const color = isUp ? '#30D158' : '#FF453A';
  
  chartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        data,
        borderColor: color,
        backgroundColor: color + '20',
        borderWidth: 2,
        fill: true,
        tension: 0.4,
        pointRadius: 0
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 800 },
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { display: false }, ticks: { color: '#6E6E73', maxTicksLimit: 6 } },
        y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#6E6E73' } }
      }
    }
  });
}

// SMART INTENT DETECTION (Forgiving & Natural)

const Intent = {
  detect(input) {
    const lower = input.toLowerCase().trim();
    
    // Greetings & Chitchat
    if (/^(hi|hello|hey|howdy|greetings|yo)\b/i.test(lower)) return { type:'greeting' };
    if (/\b(thank|thanks|cheers|ty)\b/i.test(lower)) return { type:'thanks' };
    if (/\b(who are you|what are you|your name)\b/i.test(lower)) return { type:'identity' };
    if (/\b(what can you do|help|commands|how to use)\b/i.test(lower)) return { type:'help' };
    if (/\b(clear|reset|start over|new chat)\b/i.test(lower)) return { type:'clear_chat' };

    // App Store & Widgets (Highly Forgiving)
    if (/\b(app store|apps|store)\b/i.test(lower)) return { type: 'app_store' };
    if (/\b(widgets|my widgets|show widgets)\b/i.test(lower)) return { type: 'view_widgets' };
    if (/\binstall\b/i.test(lower)) {
      const widgetMatch = lower.match(/\b(weather|calculator|calc|notes|timer|converter|password)\b/i);
      if (widgetMatch) return { type: 'install_widget', widget: widgetMatch[1] === 'calculator' ? 'calc' : widgetMatch[1] };
      return { type: 'app_store' }; // Just "install" opens the store
    }
    
    // Markets & News
    if (/\b(market|stocks|crypto|bitcoin|btc|eth|s&p|nasdaq)\b/i.test(lower)) return { type:'market_briefing' };
    if (/\b(news|headlines|tech|updates)\b/i.test(lower)) return { type:'news', category: /\btech\b/i.test(lower) ? 'tech' : 'markets' };
    if (/\b(tips|advice|strategy|invest|investing|learn)\b/i.test(lower)) return { type: 'investing_tips' };
    
    // Fallback
    return { type:'fallback', query: input };
  }
};

let isProcessing = false;
function addMsg(role, html) {
  const div = document.createElement('div'); div.className = `msg ${role}`;
  const avatar = role === 'bot' ? `<img src="${CONFIG.LOGO_URL}" alt="AI">` : 'U';
  div.innerHTML = `<div class="msg-avatar ${role}">${avatar}</div><div class="msg-body"><div class="msg-header"><span class="msg-role">${role === 'bot' ? CONFIG.BOT_NAME : 'You'}</span><span class="msg-time">${new Date().toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' })}</span></div><div class="msg-content">${html}</div></div>`;
  thread.appendChild(div);
  scrollToBottom(true);
  return div.querySelector('.msg-content');
}

function showResearching() {
  const div = document.createElement('div'); div.className = 'msg bot';
  div.innerHTML = `<div class="msg-avatar bot"><img src="${CONFIG.LOGO_URL}" alt="AI"></div><div class="msg-body"><div class="research-steps"><div class="step active"><span class="step-icon">◌</span> Analyzing request...</div><div class="step"><span class="step-icon">◌</span> Fetching live data...</div></div></div>`;
  thread.appendChild(div); scrollToBottom(true); return div;
}

async function handleSend(text) {
  if (isProcessing || !text.trim()) return;
  isProcessing = true;
  $('#chatInput').disabled = true; $('#chatSend').disabled = true;
  
  addMsg('user', esc(text));
  $('#chatInput').value = '';
  
  const researchEl = showResearching();
  const stepInterval = setInterval(() => {
    const active = researchEl.querySelector('.step.active');
    if (active) { active.classList.remove('active'); active.classList.add('done'); active.querySelector('.step-icon').textContent = '✓'; const next = active.nextElementSibling; if (next) next.classList.add('active'); }
  }, 500);

  try {
    await new Promise(r => setTimeout(r, 600));
    const response = await AI.process(text.trim());
    clearInterval(stepInterval); researchEl.remove();
    
    if (response.includes('Chat cleared')) {
       const contentEl = addMsg('bot', '');
       contentEl.innerHTML = response;
       return;
    }

    const contentEl = addMsg('bot', '');
    contentEl.innerHTML = response;
    contentEl.classList.add('data-fade-in');
    scrollToBottom(false);
  } catch(err) {
    clearInterval(stepInterval); researchEl.remove();
    addMsg('bot', '<p>⚠️ Something went wrong. Please try again.</p>');
  } finally {
    isProcessing = false;
    $('#chatInput').disabled = false; $('#chatSend').disabled = false;
    $('#chatInput').focus({ preventScroll: true });
  }
}

window.handleSend = handleSend;
$('#chatForm').addEventListener('submit', e => { e.preventDefault(); handleSend($('#chatInput').value); });

// WIDGET MANAGER
// ==========================================
const WidgetManager = {
  state: { open: [] },
  init() { 
    try { const saved = localStorage.getItem('dih_widgets_v4'); if (saved) this.state = JSON.parse(saved); } catch(e) {} 
    this.state.open.forEach(type => this.createWidgetElement(type)); 
    this.renderAppGrid();
  },
  save() { localStorage.setItem('dih_widgets_v4', JSON.stringify(this.state)); },
  open(type) { 
    if (!this.state.open.includes(type)) { 
      this.state.open.push(type); 
      this.save(); 
      this.createWidgetElement(type); 
      this.renderAppGrid();
      showToast(`${type} widget installed`, 'success');
    } 
  },
  close(type) { 
    this.state.open = this.state.open.filter(w => w !== type); 
    this.save(); 
    document.getElementById(`widget-${type}`)?.remove(); 
    this.renderAppGrid();
  },
  renderAppGrid() {
    const grid = $('#appGrid');
    if(!grid) return;
    const apps = [
      { type: 'weather', icon: '🌤️', name: 'Weather' },
      { type: 'notes', icon: '📝', name: 'Notes' },
      { type: 'calc', icon: '🧮', name: 'Calculator' },
      { type: 'timer', icon: '⏱️', name: 'Focus Timer' },
      { type: 'converter', icon: '⚖️', name: 'Converter' },
      { type: 'password', icon: '🔑', name: 'Password Gen' }
    ];
    grid.innerHTML = apps.map(a => {
      const isInstalled = this.state.open.includes(a.type);
      return `<div class="app-card" onclick="WidgetManager.toggle('${a.type}')">
        <div class="app-icon">${a.icon}</div>
        <div class="app-name">${a.name}</div>
        <div class="app-status ${isInstalled ? 'installed' : ''}">${isInstalled ? '✅ Installed' : 'Tap to Install'}</div>
      </div>`;
    }).join('');
  },
  toggle(type) { this.state.open.includes(type) ? this.close(type) : this.open(type); },
  
  createWidgetElement(type) {
    if (document.getElementById(`widget-${type}`)) return;
    const el = document.createElement('div');
    el.id = `widget-${type}`; 
    el.className = 'floating-widget';
    
    if (window.innerWidth < 768) {
      el.style.left = '50%'; el.style.top = '50%'; el.style.transform = 'translate(-50%, -50%)';
    } else {
      const offset = this.state.open.length * 40;
      el.style.right = `${20 + offset}px`; el.style.top = `${80 + offset}px`;
    }
    
    let content = '';
    if (type === 'weather') content = this.getWeatherHTML();
    else if (type === 'calc') content = this.getCalcHTML();
    else if (type === 'notes') content = this.getNotesHTML();
    else if (type === 'timer') content = this.getTimerHTML();
    else if (type === 'converter') content = this.getConverterHTML();
    else if (type === 'password') content = this.getPasswordHTML();
    
    el.innerHTML = `<div class="widget-header"><span class="widget-title">${this.getTitle(type)}</span><button class="widget-close" onclick="WidgetManager.close('${type}')"></button></div><div class="widget-body">${content}</div>`;
    $('#widgetLayer').appendChild(el);
    
    if (type === 'weather') this.initWeather(el);
    else if (type === 'calc') this.initCalc(el);
    else if (type === 'notes') this.initNotes(el);
    else if (type === 'timer') this.initTimer(el);
    else if (type === 'converter') this.initConverter(el);
    else if (type === 'password') this.initPassword(el);
  },
  getTitle(type) {
    const titles = { weather: '🌤️ Weather', calc: '🧮 Calculator', notes: '📝 Notes', timer: '⏱️ Focus Timer', converter: '⚖️ Converter', password: '🔑 Password Gen' };
    return titles[type] || type;
  },
  getWeatherHTML() {
    const city = localStorage.getItem('dih_weather_city') || '';
    return city ? `<div id="wx-display">Loading weather for ${city}...</div>` : `
      <div style="text-align:center; padding:10px;">
        <p style="font-size:13px;color:var(--text-sub);margin-bottom:12px;">Enter a city to get started</p>
        <form id="wx-form" style="display:flex;gap:6px;">
          <input type="text" id="wx-city-input" placeholder="e.g. London" style="flex:1;min-width:0;padding:8px 12px;background:var(--surface-3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;outline:none;">
          <button type="submit" style="padding:8px 16px;background:var(--accent);color:white;border:none;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;">Go</button>
        </form>
      </div>`;
  },
  initWeather(el) {
    const city = localStorage.getItem('dih_weather_city');
    if (city) this.fetchWeather(city, el);
    const form = el.querySelector('#wx-form');
    if (form) {
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const val = el.querySelector('#wx-city-input').value.trim();
        if (val) {
          localStorage.setItem('dih_weather_city', val);
          el.querySelector('.widget-body').innerHTML = `<div id="wx-display">Loading weather for ${val}...</div>`;
          this.fetchWeather(val, el);
        }
      });
    }
  },
  async fetchWeather(city, el) {
    const display = el.querySelector('#wx-display');
    try {
      const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1`);
      const geoData = await geoRes.json();
      if (!geoData.results || !geoData.results.length) throw new Error('City not found');
      const loc = geoData.results[0];
      const wxRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}&current_weather=true`);
      const wxData = await wxRes.json(); const wx = wxData.current_weather;
      const emoji = this.getWeatherEmoji(wx.weathercode);
      display.innerHTML = `<div style="text-align:center;"><div style="font-size:14px;font-weight:700;margin-bottom:8px;">${loc.name}${loc.country ? ', ' + loc.country : ''}</div><div style="font-size:48px;">${emoji}</div><div style="font-size:36px;font-weight:800;font-family:var(--mono);margin:8px 0;">${wx.temperature}°C</div><div style="font-size:12px;color:var(--text-muted);">Wind: ${wx.windspeed} km/h</div><button onclick="WidgetManager.changeWeatherCity()" style="margin-top:12px;background:none;border:1px solid var(--border);color:var(--text-sub);padding:4px 10px;border-radius:6px;cursor:pointer;font-size:11px;">Change City</button></div>`;
    } catch (e) {
      display.innerHTML = `<p style="color:var(--red);font-size:12px;text-align:center;">Could not find "${city}". <button onclick="WidgetManager.changeWeatherCity()" style="background:none;border:none;color:var(--accent);cursor:pointer;font-size:12px;">Try again</button></p>`;
    }
  },
  changeWeatherCity() {
    localStorage.removeItem('dih_weather_city');
    const el = document.getElementById('widget-weather');
    if (el) { el.querySelector('.widget-body').innerHTML = this.getWeatherHTML(); this.initWeather(el); }
  },
  getWeatherEmoji(code) {
    if (code === 0) return '☀️'; if (code <= 3) return '⛅'; if (code <= 48) return '🌫️';
    if (code <= 67) return '🌧️'; if (code <= 77) return '🌨️'; if (code <= 82) return '🌧️';
    if (code <= 86) return '🌨️'; if (code >= 95) return '⛈️'; return '🌡️';
  },
  getCalcHTML() {
    return `<input type="text" id="calc-disp" readonly style="width:100%;padding:12px;background:var(--surface-3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--mono);font-size:20px;text-align:right;margin-bottom:12px;outline:none;"><div style="display:grid;grid-template-columns:repeat(4, 1fr);gap:8px;">${['C','(',')','/','7','8','9','*','4','5','6','-','1','2','3','+','0','.','=',''].map(b => { if (!b) return '<div></div>'; const isOp = ['+','-','*','/','=','C','(',')'].includes(b); return `<button class="calc-btn" data-val="${b}" style="padding:12px;background:${isOp ? 'var(--accent-soft)' : 'var(--surface-3)'};color:${isOp ? 'var(--accent)' : 'var(--text)'};border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:16px;font-weight:600;">${b}</button>`; }).join('')}</div>`;
  },
  initCalc(el) {
    const display = el.querySelector('#calc-disp');
    el.querySelectorAll('.calc-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const val = btn.dataset.val;
        if (val === 'C') display.value = '';
        else if (val === '=') { try { if (/[^0-9+\-*/().\s]/.test(display.value)) throw new Error(); display.value = Function('"use strict"; return (' + display.value + ')')(); } catch (e) { display.value = 'Error'; } }
        else display.value += val;
      });
    });
  },
  getNotesHTML() {
    const notes = localStorage.getItem('dih_notes') || '';
    return `<textarea id="notes-area" style="width:100%;height:200px;background:var(--surface-3);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:12px;font-family:var(--font);font-size:13px;resize:none;outline:none;line-height:1.6;" placeholder="Type your notes here...">${notes}</textarea><div style="margin-top:8px;font-size:11px;color:var(--text-muted);text-align:right;">Auto-saved locally</div>`;
  },
  initNotes(el) {
    el.querySelector('#notes-area').addEventListener('input', (e) => localStorage.setItem('dih_notes', e.target.value));
  },
  getTimerHTML() {
    return `<div style="text-align:center;padding:10px;"><div id="timer-display" style="font-size:48px;font-weight:800;font-family:var(--mono);margin:20px 0;color:var(--text);">25:00</div><div style="display:flex;gap:10px;justify-content:center;"><button id="timer-start" style="padding:10px 24px;background:var(--green);color:white;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:14px;">Start</button><button id="timer-reset" style="padding:10px 24px;background:var(--surface-3);color:var(--text);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-weight:700;font-size:14px;">Reset</button></div></div>`;
  },
  initTimer(el) {
    let timeLeft = 25 * 60, interval = null;
    const display = el.querySelector('#timer-display'); const startBtn = el.querySelector('#timer-start'); const resetBtn = el.querySelector('#timer-reset');
    const updateDisplay = () => { const m = Math.floor(timeLeft / 60).toString().padStart(2, '0'); const s = (timeLeft % 60).toString().padStart(2, '0'); display.textContent = `${m}:${s}`; };
    startBtn.addEventListener('click', () => {
      if (interval) { clearInterval(interval); interval = null; startBtn.textContent = 'Start'; startBtn.style.background = 'var(--green)'; } 
      else { interval = setInterval(() => { if (timeLeft > 0) { timeLeft--; updateDisplay(); } else { clearInterval(interval); interval = null; startBtn.textContent = 'Start'; startBtn.style.background = 'var(--green)'; display.textContent = "Done!"; } }, 1000); startBtn.textContent = 'Pause'; startBtn.style.background = 'var(--orange)'; }
    });
    resetBtn.addEventListener('click', () => { clearInterval(interval); interval = null; timeLeft = 25 * 60; updateDisplay(); startBtn.textContent = 'Start'; startBtn.style.background = 'var(--green)'; });
  },
  getConverterHTML() {
    return `<div style="display:flex;flex-direction:column;gap:16px;"><div><label style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;">Temperature (°C to °F)</label><div style="display:flex;gap:8px;margin-top:6px;align-items:center;"><input type="number" id="conv-temp-c" placeholder="°C" style="flex:1;min-width:0;padding:8px;background:var(--surface-3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;outline:none;"><span style="padding:8px;flex-shrink:0;color:var(--text-muted);">=</span><input type="text" id="conv-temp-f" readonly placeholder="°F" style="flex:1;min-width:0;padding:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--accent);font-size:13px;outline:none;"></div></div><div><label style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;">Length (ft to m)</label><div style="display:flex;gap:8px;margin-top:6px;align-items:center;"><input type="number" id="conv-len-ft" placeholder="ft" style="flex:1;min-width:0;padding:8px;background:var(--surface-3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;outline:none;"><span style="padding:8px;flex-shrink:0;color:var(--text-muted);">=</span><input type="text" id="conv-len-m" readonly placeholder="m" style="flex:1;min-width:0;padding:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--accent);font-size:13px;outline:none;"></div></div></div>`;
  },
  initConverter(el) {
    const c = el.querySelector('#conv-temp-c'), f = el.querySelector('#conv-temp-f');
    c.addEventListener('input', () => { f.value = c.value ? (parseFloat(c.value) * 9/5 + 32).toFixed(1) : ''; });
    const ft = el.querySelector('#conv-len-ft'), m = el.querySelector('#conv-len-m');
    ft.addEventListener('input', () => { m.value = ft.value ? (parseFloat(ft.value) * 0.3048).toFixed(2) : ''; });
  },
  getPasswordHTML() {
    return `<div style="display:flex;flex-direction:column;gap:16px;padding:10px;"><div style="display:flex;justify-content:space-between;align-items:center;"><span style="font-size:12px;color:var(--text-sub);">Length: <span id="pw-len-val">16</span></span><input type="range" id="pw-len" min="8" max="32" value="16" style="width:120px;accent-color:var(--accent);"></div><div style="background:var(--surface-3);padding:16px;border-radius:8px;border:1px solid var(--border);font-family:var(--mono);font-size:16px;word-break:break-all;text-align:center;color:var(--accent);min-height:50px;display:flex;align-items:center;justify-content:center;" id="pw-result">Generating...</div><button id="pw-gen-btn" style="padding:12px;background:var(--accent);color:white;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:14px;">Generate New</button><button id="pw-copy-btn" style="padding:12px;background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-weight:700;font-size:14px;">Copy to Clipboard</button></div>`;
  },
  initPassword(el) {
    const lenInput = el.querySelector('#pw-len'), lenVal = el.querySelector('#pw-len-val');
    const result = el.querySelector('#pw-result'), genBtn = el.querySelector('#pw-gen-btn'), copyBtn = el.querySelector('#pw-copy-btn');
    const generate = () => { const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+-=[]{}|;:,.<>?"; let pw = ""; for(let i=0; i<lenInput.value; i++) pw += chars.charAt(Math.floor(Math.random() * chars.length)); result.textContent = pw; };
    lenInput.addEventListener('input', () => { lenVal.textContent = lenInput.value; generate(); });
    genBtn.addEventListener('click', generate);
    copyBtn.addEventListener('click', () => { navigator.clipboard.writeText(result.textContent).then(() => { copyBtn.textContent = "Copied!"; setTimeout(() => copyBtn.textContent = "Copy to Clipboard", 2000); }); });
    generate();
  }
};
window.WidgetManager = WidgetManager;

// ==========================================
// WIDGET DRAG LOGIC
// ==========================================
let activeWidget = null, offsetX = 0, offsetY = 0, zCounter = 10000;

document.addEventListener('pointerdown', (e) => {
  const handle = e.target.closest('.widget-header');
  if (!handle || e.target.closest('.widget-close')) return;
  activeWidget = handle.closest('.floating-widget');
  if (!activeWidget) return;
  const rect = activeWidget.getBoundingClientRect();
  offsetX = e.clientX - rect.left; offsetY = e.clientY - rect.top;
  activeWidget.style.zIndex = ++zCounter;
  activeWidget.style.cursor = 'grabbing';
  activeWidget.style.transition = 'none';
  document.body.style.userSelect = 'none';
});

document.addEventListener('pointermove', (e) => {
  if (!activeWidget) return;
  e.preventDefault();
  let x = e.clientX - offsetX; let y = e.clientY - offsetY;
  x = Math.max(0, Math.min(x, window.innerWidth - activeWidget.offsetWidth));
  y = Math.max(0, Math.min(y, window.innerHeight - activeWidget.offsetHeight));
  activeWidget.style.left = x + 'px'; activeWidget.style.top = y + 'px';
  activeWidget.style.right = 'auto'; activeWidget.style.transform = 'none';
});

document.addEventListener('pointerup', () => {
  if (activeWidget) {
    activeWidget.style.cursor = 'grab';
    activeWidget.style.transition = '';
    document.body.style.userSelect = '';
  }
  activeWidget = null;
});

// ==========================================

function updateClock() { $('#clock').textContent = new Date().toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' }); }
