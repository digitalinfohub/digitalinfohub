<style>
:root {
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
  --radius: 12px;
  --radius-sm: 8px;
  --modal-z: 1000;
}

[data-theme="dark"] {
  --bg: #0a0a0a;
  --surface: #111111;
  --surface-2: #161616;
  --surface-3: #1a1a1a;
  --border: rgba(255,255,255,0.06);
  --border-strong: rgba(255,255,255,0.1);
  --text: #f5f5f5;
  --text-sub: #a1a1aa;
  --text-muted: #71717a;
  --accent: #6366f1;
  --accent-soft: rgba(99,102,241,0.1);
  --shadow: 0 4px 24px -6px rgba(0,0,0,0.4);
  --error: #ef4444;
  --error-soft: rgba(239,68,68,0.1);
}

[data-theme="light"] {
  --bg: #fafafa;
  --surface: #ffffff;
  --surface-2: #f4f4f5;
  --surface-3: #e4e4e7;
  --border: rgba(0,0,0,0.06);
  --border-strong: rgba(0,0,0,0.12);
  --text: #0a0a0a;
  --text-sub: #52525b;
  --text-muted: #a1a1aa;
  --accent: #4f46e5;
  --accent-soft: rgba(79,70,229,0.08);
  --shadow: 0 4px 24px -6px rgba(0,0,0,0.08);
  --error: #dc2626;
  --error-soft: rgba(220,38,38,0.08);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
  font-feature-settings: 'cv11', 'ss01';
  -webkit-font-smoothing: antialiased;
  transition: background 0.3s ease, color 0.3s ease;
}

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

.shell { max-width: 820px; margin: 0 auto; padding: 32px 24px 80px; }

/* ═══ TOP BAR ═══ */
.topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 48px; }
.brand {
  display: flex; align-items: center; gap: 10px;
  font-weight: 700; font-size: 15px; letter-spacing: -0.01em;
  text-decoration: none; color: var(--text);
}
.brand-logo {
  width: 28px; height: 28px;
  border-radius: 8px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  flex-shrink: 0;
}
.brand-logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.topbar-actions { display: flex; gap: 6px; align-items: center; }
.icon-btn {
  width: 36px; height: 36px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-sub);
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s var(--ease);
  font-family: inherit;
}
.icon-btn:hover { color: var(--text); border-color: var(--border-strong); background: var(--surface-2); }
.icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.clock {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text-muted);
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  font-variant-numeric: tabular-nums;
}

/* ═══ CHAT HERO ═══ */
.chat-hero {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 32px;
  margin-bottom: 48px;
  box-shadow: var(--shadow);
}

.chat-thread { display: flex; flex-direction: column; gap: 20px; min-height: 60px; margin-bottom: 20px; }

.msg { display: flex; gap: 12px; animation: slideUp 0.4s var(--ease); }
@keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.msg-avatar {
  width: 28px; height: 28px;
  border-radius: 8px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700;
  color: var(--text-sub);
  overflow: hidden;
}
.msg-avatar.bot { background: var(--accent-soft); border-color: transparent; }
.msg-avatar.bot img { width: 100%; height: 100%; object-fit: cover; }
.msg-avatar.user { background: var(--surface-3); }

.msg-body { flex: 1; min-width: 0; padding-top: 2px; }
.msg-role {
  font-size: 11px; font-weight: 600;
  color: var(--text-muted);
  margin-bottom: 4px;
  font-family: var(--mono);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.msg-content { font-size: 14.5px; line-height: 1.65; color: var(--text); }
.msg-content p + p { margin-top: 10px; }
.msg-content strong { color: var(--text); font-weight: 600; }
.msg-content a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.msg-content em { color: var(--text-sub); font-style: normal; font-family: var(--mono); font-size: 0.9em; background: var(--surface-2); padding: 1px 6px; border-radius: 4px; border: 1px solid var(--border); }

.typing-cursor::after {
  content: '▊'; color: var(--accent); margin-left: 2px;
  animation: blink 0.8s step-end infinite; font-weight: 400;
}
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

/* Error state */
.error-block {
  margin-top: 12px;
  padding: 14px 16px;
  background: var(--error-soft);
  border: 1px solid var(--error);
  border-radius: var(--radius-sm);
  color: var(--error);
  font-size: 13px;
  display: flex;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
}
.error-block-text { flex: 1; min-width: 180px; }
.error-block strong { font-weight: 600; display: block; margin-bottom: 2px; }
.error-block-sub { font-size: 12px; opacity: 0.8; }
.retry-btn {
  padding: 7px 14px;
  background: var(--error);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  transition: opacity 0.2s var(--ease);
  flex-shrink: 0;
}
.retry-btn:hover { opacity: 0.9; }
.retry-btn:focus-visible { outline: 2px solid var(--error); outline-offset: 2px; }

/* Rich elements */
.rich-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 10px;
  margin-top: 14px;
}

.blog-card {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  overflow: hidden;
  cursor: pointer;
  transition: all 0.25s var(--ease);
  display: flex; flex-direction: column;
  text-decoration: none;
  color: inherit;
}
.blog-card:hover { border-color: var(--border-strong); transform: translateY(-2px); box-shadow: var(--shadow); }
.blog-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.blog-cover { aspect-ratio: 16 / 9; overflow: hidden; background: var(--surface-3); position: relative; }
.blog-cover img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s ease; }
.blog-card:hover .blog-cover img { transform: scale(1.04); }
.blog-cover-fallback {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  font-size: 36px;
}
.blog-info { padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.blog-title { font-size: 13px; font-weight: 600; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.blog-meta { font-size: 11px; color: var(--text-muted); font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.05em; }

.tile {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  cursor: pointer;
  transition: all 0.2s var(--ease);
  display: flex; flex-direction: column; gap: 2px;
  font-family: inherit; color: var(--text); text-align: left;
  text-decoration: none;
}
.tile:hover { border-color: var(--border-strong); background: var(--surface-3); transform: translateY(-1px); }
.tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tile-name { font-size: 13px; font-weight: 600; }
.tile-desc { font-size: 11px; color: var(--text-muted); }

/* Chat input */
.chat-input-shell {
  position: relative;
  display: flex; gap: 8px; align-items: center;
  padding: 10px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  transition: border-color 0.2s var(--ease);
}
.chat-input-shell:focus-within { border-color: var(--accent); }
.chat-input {
  flex: 1;
  background: none; border: none; outline: none;
  color: var(--text);
  font-family: inherit; font-size: 14px;
  padding: 8px 4px; line-height: 1.5;
}
.chat-input::placeholder { color: var(--text-muted); }
.chat-input:disabled { opacity: 0.5; }
.chat-send {
  width: 36px; height: 36px;
  background: var(--accent); color: white;
  border: none; border-radius: 8px;
  cursor: pointer;
  font-family: inherit; font-weight: 700; font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  transition: opacity 0.2s var(--ease), transform 0.2s var(--ease);
  flex-shrink: 0;
}
.chat-send:hover:not(:disabled) { opacity: 0.9; }
.chat-send:active:not(:disabled) { transform: scale(0.95); }
.chat-send:disabled { opacity: 0.4; cursor: not-allowed; }
.chat-send:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Sections */
.section { margin-bottom: 48px; }
.section-head {
  display: flex; justify-content: space-between; align-items: flex-end;
  margin-bottom: 20px; gap: 16px;
}
.section-head h2 { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.section-head .eyebrow {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--text-muted); font-weight: 600; font-family: var(--mono);
  margin-bottom: 4px;
}
.section-link {
  font-size: 12px; color: var(--text-sub);
  background: none;
  border: 1px solid var(--border);
  padding: 7px 14px;
  border-radius: 999px;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s var(--ease);
  text-decoration: none;
}
.section-link:hover { color: var(--text); border-color: var(--border-strong); }
.section-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ── Blog horizontal scroll (Desktop + Mobile optimized) ── */
.blog-row {
  display: flex;
  gap: 14px;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 4px 4px 16px;
  -webkit-overflow-scrolling: touch;
  scroll-snap-type: x proximity;
  
  scrollbar-width: thin;
  scrollbar-color: var(--border-strong) transparent;
  
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
}

.blog-row:active {
  cursor: grabbing;
}

.blog-row::-webkit-scrollbar {
  height: 6px;
}
.blog-row::-webkit-scrollbar-track {
  background: transparent;
}
.blog-row::-webkit-scrollbar-thumb {
  background: var(--border-strong);
  border-radius: 3px;
}
.blog-row::-webkit-scrollbar-thumb:hover {
  background: var(--text-muted);
}

.blog-row .blog-card {
  flex: 0 0 260px;
  min-width: 260px;
  scroll-snap-align: start;
}

.apps-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 10px;
}
.app-tile {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 18px 12px 14px;
  cursor: pointer;
  transition: all 0.2s var(--ease);
  font-family: inherit; color: var(--text);
  display: flex; flex-direction: column;
  align-items: center; gap: 10px; text-align: center;
  animation: fade 0.4s var(--ease) backwards;
  animation-delay: var(--stagger, 0s);
  text-decoration: none;
}
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.app-tile:hover { border-color: var(--border-strong); background: var(--surface-2); transform: translateY(-2px); }
.app-tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app-icon {
  width: 40px; height: 40px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.app-icon.ai { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
.app-icon.notes { background: linear-gradient(135deg, #f59e0b, #f97316); }
.app-icon.tasks { background: linear-gradient(135deg, #10b981, #059669); }
.app-icon.convert { background: linear-gradient(135deg, #06b6d4, #3b82f6); }
.app-icon.games { background: linear-gradient(135deg, #ec4899, #f43f5e); }
.app-icon.pages { background: linear-gradient(135deg, #8b5cf6, #6366f1); }
.app-label { font-size: 12px; font-weight: 600; }
.app-sub { font-size: 10px; color: var(--text-muted); margin-top: 2px; }

.filter-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
.filter-btn {
  padding: 6px 12px;
  background: none;
  border: 1px solid var(--border);
  color: var(--text-sub);
  border-radius: 999px;
  cursor: pointer;
  font-family: inherit; font-size: 12px;
  transition: all 0.2s var(--ease);
}
.filter-btn:hover { color: var(--text); border-color: var(--border-strong); }
.filter-btn.active { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.filter-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.no-results {
  grid-column: 1 / -1;
  text-align: center;
  padding: 32px;
  color: var(--text-muted);
  font-size: 13px;
  border: 1px dashed var(--border);
  border-radius: var(--radius-sm);
}

.footer-ad {
  margin-top: 48px;
  padding: 24px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  min-height: 120px;
  display: flex; align-items: center; justify-content: center;
}

/* Toast */
.toast-container {
  position: fixed; bottom: 24px; right: 24px;
  z-index: 2000;
  display: flex; flex-direction: column; gap: 8px;
  max-width: 320px;
  pointer-events: none;
}
.toast {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 18px;
  color: var(--text);
  font-size: 13px;
  animation: toastIn 0.3s var(--ease);
  box-shadow: var(--shadow);
  pointer-events: all;
  transition: opacity 0.3s, transform 0.3s;
}
.toast.error { border-color: var(--error); color: var(--error); }
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* Skip link for a11y */
.skip-link {
  position: absolute; left: -9999px; top: 0;
  background: var(--accent); color: white;
  padding: 8px 16px; border-radius: 4px;
  z-index: 9999; text-decoration: none;
  font-size: 13px;
}
.skip-link:focus { left: 8px; top: 8px; }

/* ═══ NAVIGATION ═══ */
.nav-shell {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  margin: -32px -24px 32px;
  padding: 0 24px;
  transition: all 0.3s var(--ease);
}

.nav-bar {
  max-width: 820px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 0;
  gap: 24px;
}

.nav-links {
  display: flex;
  gap: 8px;
  align-items: center;
  flex: 1;
  overflow-x: auto;
  scrollbar-width: none;
}

.nav-links::-webkit-scrollbar { display: none; }

.nav-link {
  padding: 8px 14px;
  background: none;
  border: 1px solid transparent;
  color: var(--text-sub);
  border-radius: 8px;
  cursor: pointer;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  transition: all 0.2s var(--ease);
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 6px;
  text-decoration: none;
}

.nav-link:hover {
  color: var(--text);
  background: var(--surface-2);
  border-color: var(--border);
}

.nav-link.active {
  color: var(--accent);
  background: var(--accent-soft);
  border-color: var(--accent);
}

.nav-link:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* Hamburger menu for mobile */
.hamburger {
  display: none;
  flex-direction: column;
  gap: 4px;
  width: 32px;
  height: 32px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  padding: 8px;
  transition: all 0.2s var(--ease);
}

.hamburger:hover {
  background: var(--surface-2);
  border-color: var(--border-strong);
}

.hamburger-line {
  width: 100%;
  height: 2px;
  background: var(--text-sub);
  border-radius: 2px;
  transition: all 0.3s var(--ease);
}

.hamburger.active .hamburger-line:nth-child(1) {
  transform: translateY(6px) rotate(45deg);
}

.hamburger.active .hamburger-line:nth-child(2) {
  opacity: 0;
}

.hamburger.active .hamburger-line:nth-child(3) {
  transform: translateY(-6px) rotate(-45deg);
}

/* Mobile drawer */
.nav-drawer {
  position: fixed;
  top: 0;
  right: 0;
  width: 100%;
  max-width: 320px;
  height: 100vh;
  background: var(--surface);
  border-left: 1px solid var(--border);
  z-index: 200;
  transform: translateX(100%);
  transition: transform 0.3s var(--ease);
  overflow-y: auto;
  box-shadow: -4px 0 24px rgba(0,0,0,0.2);
}

.nav-drawer.active {
  transform: translateX(0);
}

.nav-drawer-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 199;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s var(--ease);
}

.nav-drawer-overlay.active {
  opacity: 1;
  pointer-events: all;
}

.nav-drawer-head {
  padding: 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.nav-drawer-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
}

.nav-drawer-links {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.nav-drawer-link {
  padding: 14px 16px;
  color: var(--text-sub);
  border-radius: 8px;
  cursor: pointer;
  font-size: 15px;
  font-weight: 500;
  transition: all 0.2s var(--ease);
  text-decoration: none;
  border: none;
  background: none;

<script>
(function() {
  'use strict';

  /* ══════════════════════════════════════════════════════════════

  /* ══════════════════════════════════════════════════════════════
     HARDCODED BLOG POSTS (3 Featured)
     ══════════════════════════════════════════════════════════════ */
  const HARDCODED_BLOGS = [
    {
      title: "GreyGrid Studio: Great Design Doesn't Need to Be Loud",

  /* ══════════════════════════════════════════════════════════════
     UTILITIES
     ══════════════════════════════════════════════════════════════ */
  const $ = s => document.querySelector(s);
  const $$ = s => Array.from(document.querySelectorAll(s));
  const esc = s => { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; };
  const escAttr = s => esc(s).replace(/"/g, '&quot;');

  function openLink(url, title) {
    try {
      if (!url) return;
      window.open(url, '_blank', 'noopener,noreferrer');
    } catch (err) {
      console.error('[Open] failed:', err);
      toast('Could not open link', true);
    }
  }

  function toast(msg, isError = false) {
    const container = $('#toastContainer');
    if (!container) return;
    const t = document.createElement('div');
    t.className = 'toast' + (isError ? ' error' : '');
    t.textContent = msg;
    t.setAttribute('role', isError ? 'alert' : 'status');
    container.appendChild(t);
    while (container.children.length > 3) {
      container.removeChild(container.firstChild);
    }
    setTimeout(() => {
      t.style.opacity = '0';
      t.style.transform = 'translateY(8px)';
      setTimeout(() => { if (t.parentNode) t.parentNode.removeChild(t); }, 300);
    }, 2400);
  }

  async function fetchWithTimeout(url, timeoutMs = CONFIG.FEED_TIMEOUT) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      const r = await fetch(url, { signal: controller.signal });
      clearTimeout(timer);
      return r;
    } catch (err) {
      clearTimeout(timer);
      throw err;
    }
  }

  /* ══════════════════════════════════════════════════════════════
     THEME
     ══════════════════════════════════════════════════════════════ */
  const sunSvg = '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>';
  const moonSvg = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
  let theme = 'dark';
  try { theme = localStorage.getItem('dih_theme') || 'dark'; } catch(e) {}
  document.documentElement.setAttribute('data-theme', theme);
  $('#themeIcon').innerHTML = theme === 'dark' ? sunSvg : moonSvg;

  $('#themeToggle').addEventListener('click', () => {
    theme = theme === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', theme);
    try { localStorage.setItem('dih_theme', theme); } catch(e) {}
    $('#themeIcon').innerHTML = theme === 'dark' ? sunSvg : moonSvg;
  });

  /* ══════════════════════════════════════════════════════════════
     CLOCK
     ══════════════════════════════════════════════════════════════ */
  function updateClock() {
    try {
      $('#clock').textContent = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    } catch (e) { /* ignore */ }
  }
  updateClock();
  setInterval(updateClock, 30000);

  /* ══════════════════════════════════════════════════════════════
     BELL → SUBSCRIBE (opens in new tab)
     ══════════════════════════════════════════════════════════════ */
  $('#notifToggle').addEventListener('click', () => {
    openLink(CONFIG.SITE_BASE + '/subscribe', 'Subscribe');
  });

  /* ══════════════════════════════════════════════════════════════
     APPS DATA — GPTs + 5 new placeholders
     ══════════════════════════════════════════════════════════════ */
  const APPS = [
    { name: 'Digital Infohub GPT', desc: 'Tech & strategy', cat: 'ai', icon: '🤖', url: 'https://chatgpt.com/g/g-6973b68a2b188191aaead719715ab703-digiinfogpt-from-digital-infohub', keywords: ['digitalinfohub','digiinfo','tech','strategy','gpt','ai','assistant'] },
    { name: 'TaskyGPT', desc: 'Goal breakdown', cat: 'ai tasks', icon: '📋', url: 'https://chatgpt.com/g/g-6989f6b724fc8191aef0f7393ed70672-taskygpt-from-digital-infohub', keywords: ['taskygpt','goals','planning','tasks','gpt'] },
    { name: 'CookinStepGPT', desc: 'Cooking help', cat: 'ai', icon: '🍳', url: 'https://chatgpt.com/g/g-6994cb01a16c8191885299e8dbf64428-cookinstepgpt-by-digital-infohub', keywords: ['cooking','cook','recipe','recipes','food','gpt'] },
    { name: 'SaveSmartGPT', desc: 'Savings helper', cat: 'ai', icon: '💰', url: 'https://chatgpt.com/g/g-6994de10b0b08191b778d0c80a577b86-savesmartgpt-by-digital-infohub', keywords: ['save','savings','finance','money','budget','gpt'] },
    { name: 'Games Hub', desc: 'Play games', cat: 'games', icon: '🎮', url: 'https://digitalinfohub.net/games', keywords: ['games','play','arcade','fun','hub'] },
  ];

  /* ══════════════════════════════════════════════════════════════
     APPS GRID RENDER
     ══════════════════════════════════════════════════════════════ */
  const appsGrid = $('#appsGrid');
  APPS.forEach((app, i) => {
    const el = document.createElement('a');
    el.className = 'app-tile';
    el.href = app.url;
    el.target = '_blank';
    el.rel = 'noopener noreferrer';
    el.dataset.cats = app.cat;
    el.setAttribute('role', 'listitem');
    el.setAttribute('aria-label', `${app.name} — ${app.desc}`);
    el.style.setProperty('--stagger', (i * 0.02) + 's');
    el.innerHTML = `
      <div class="app-icon ${app.cat.split(' ')[0]}">${app.icon}</div>
      <div>
        <div class="app-label">${esc(app.name)}</div>
        <div class="app-sub">${esc(app.desc)}</div>
      </div>`;
    appsGrid.appendChild(el);
  });

  const filterBtns = $$('#filterRow .filter-btn');
  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      filterBtns.forEach(b => { b.classList.remove('active'); b.setAttribute('aria-selected', 'false'); });
      btn.classList.add('active');
      btn.setAttribute('aria-selected', 'true');
      const filter = btn.dataset.filter;
      let visibleCount = 0;
      $$('.app-tile').forEach(tile => {
        const cats = tile.dataset.cats.split(' ');
        const show = (filter === 'all' || cats.includes(filter));
        tile.style.display = show ? '' : 'none';
        if (show) visibleCount++;
      });
      const existingNoRes = appsGrid.querySelector('.no-results');
      if (existingNoRes) existingNoRes.remove();
      if (visibleCount === 0) {
        const noRes = document.createElement('div');
        noRes.className = 'no-results';
        noRes.textContent = 'No apps in this category.';
        appsGrid.appendChild(noRes);
      }
    });
  });

  /* ══════════════════════════════════════════════════════════════
     BLOG SHOWCASE — STATIC 3 POSTS
     ══════════════════════════════════════════════════════════════ */
  const blogRow = $('#blogRow');
  const blogSection = $('#blogSection');
  let cachedBlogs = HARDCODED_BLOGS;

  function buildBlogCardEl(post, idx) {
    const card = document.createElement('a');
    card.className = 'blog-card';
    card.href = post.link;
    card.target = '_blank';
    card.rel = 'noopener noreferrer';
    card.setAttribute('role', 'listitem');
    card.setAttribute('aria-label', post.title);
    const grad = post.grad || 'linear-gradient(135deg, #6366f1, #8b5cf6)';
    const emoji = post.emoji || '📰';
    const coverHTML = `<div class="blog-cover-fallback" style="background:${grad}">${emoji}</div>`;
    card.innerHTML = `
      <div class="blog-cover">${coverHTML}</div>
      <div class="blog-info">
        <div class="blog-title">${esc(post.title)}</div>
        <div class="blog-meta">${esc(post.dateFormatted || '')}</div>
      </div>`;
    return card;
  }

  function loadBlogs() {
    try {
      blogRow.innerHTML = '';
      HARDCODED_BLOGS.forEach((post, i) => blogRow.appendChild(buildBlogCardEl(post, i)));
      blogSection.style.display = '';
    } catch (e) {
      console.warn('[Blog] load failed:', e);
      blogSection.style.display = 'none';
    }
  }
  loadBlogs();

  /* ══════════════════════════════════════════════════════════════
     BLOG ROW DESKTOP SCROLL ENHANCEMENTS
     ══════════════════════════════════════════════════════════════ */
  const blogRowEl = $('#blogRow');
  if (blogRowEl) {
    blogRowEl.addEventListener('wheel', (e) => {
      if (blogRowEl.scrollWidth > blogRowEl.clientWidth) {
        if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
          e.preventDefault();
          blogRowEl.scrollLeft += e.deltaY;
        }
      }
    }, { passive: false });

    let isDown = false;
    let startX;
    let scrollLeft;
    let isDragged = false;

    blogRowEl.addEventListener('mousedown', (e) => {
      isDown = true;
      isDragged = false;
      startX = e.pageX - blogRowEl.offsetLeft;
      scrollLeft = blogRowEl.scrollLeft;
    });
    
    blogRowEl.addEventListener('mouseleave', () => { isDown = false; });
    blogRowEl.addEventListener('mouseup', () => { isDown = false; });
    
    blogRowEl.addEventListener('mousemove', (e) => {
      if (!isDown) return;
      e.preventDefault();
      const x = e.pageX - blogRowEl.offsetLeft;
      const walk = (x - startX) * 1.5;
      if (Math.abs(walk) > 5) isDragged = true;
      blogRowEl.scrollLeft = scrollLeft - walk;
    });

    blogRowEl.addEventListener('click', (e) => {
      if (isDragged) {
        e.preventDefault();
        e.stopPropagation();
        isDragged = false;
      }
    }, true);
  }

  /* ══════════════════════════════════════════════════════════════
     FEED CACHE
     ══════════════════════════════════════════════════════════════ */
  const feedCache = {};
  const feedLoading = {};

  async function loadFeed(key, retries = CONFIG.MAX_RETRIES) {
    if (feedCache[key]) return feedCache[key];
    if (feedLoading[key]) return feedLoading[key];

    feedLoading[key] = (async () => {
      const feed = CONFIG.FEEDS[key];
      if (!feed) return [];
      let lastErr = null;
      for (let attempt = 0; attempt <= retries; attempt++) {
        try {
          const r = await fetchWithTimeout(
            `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feed.url)}`,
            CONFIG.FEED_TIMEOUT
          );
          if (!r.ok) throw new Error('HTTP ' + r.status);
          const data = await r.json();
          const articles = (data.items || []).slice(0, 6).map(it => ({
            title: (it.title || '').replace(/<[^>]*>/g, ''),
            link: it.link || '#',
            date: it.pubDate
          }));
          feedCache[key] = articles;
          delete feedLoading[key];
          return articles;
        } catch (err) {
          lastErr = err;
          if (attempt < retries) await new Promise(r => setTimeout(r, 500 * (attempt + 1)));
        }
      }
      delete feedLoading[key];
      console.warn(`[Feed] ${key} failed after ${retries + 1} attempts:`, lastErr);
      return [];
    })();
    return feedLoading[key];
  }

  /* ══════════════════════════════════════════════════════════════
     CHAT — BRAIN
     ══════════════════════════════════════════════════════════════ */
  const chatThread = $('#chatThread');
  const chatForm = $('#chatForm');
  const chatInput = $('#chatInput');
  const chatSend = $('#chatSend');
  let isTyping = false;
  let lastQuery = '';

  const STOP = new Set(['the','a','an','is','are','was','were','be','been','can','could','will','would','should','do','does','did','have','has','had','i','you','he','she','we','they','me','my','your','this','that','of','in','on','at','to','for','with','by','from','it','its','and','or','but','so','then','than','now','please','show','give','open','launch','get','find','tell','look','see','me','about','up','what','which','who','whom']);

  function tokenize(s) {
    return s.toLowerCase().replace(/[^\w\s]/g, ' ').split(/\s+/).filter(w => w.length > 1 && !STOP.has(w));
  }

  function scoreQuery(query, items) {
    const tokens = tokenize(query);
    if (!tokens.length) return [];
    return items.map(item => {
      let score = 0;
      const kws = (item.keywords || []).map(k => (k || '').toLowerCase());
      tokens.forEach(qt => {
        kws.forEach(kw => {
          if (kw === qt) score += 3;
          else if (kw.startsWith(qt) || qt.startsWith(kw)) score += 1.5;
          else if (kw.includes(qt) || qt.includes(kw)) score += 0.8;
        });
      });
      if (item.name) {
        const nameL = item.name.toLowerCase();
        tokens.forEach(qt => {
          if (nameL === qt) score += 5;
          else if (nameL.includes(qt)) score += 2;
        });
      }
      return { item, score };
    }).filter(x => x.score > 0).sort((a, b) => b.score - a.score);
  }

  function detectIntent(query) {
    const q = query.toLowerCase().trim();

    if (/^(hi|hey|hello|sup|yo|greetings)\b/.test(q)) return { type: 'greet' };
    if (/^(thanks|thank you|thx|ty)\b/.test(q)) return { type: 'thanks' };
    if (/^(bye|goodbye|see you|cya)\b/.test(q)) return { type: 'bye' };
    if (/who are you|what are you|your name|what's your name/i.test(q)) return { type: 'identity' };
    if (/^(help|\?)$|what can you do|what do you do|how do you work/i.test(q)) return { type: 'help' };
    if (/subscribe|sign.?up|newsletter|notify|notifications?/i.test(q)) return { type: 'action', action: 'subscribe' };
    if (/donate|support|contribute|tip/i.test(q)) return { type: 'action', action: 'donate' };
    if (/advertise|sponsor|ad\b|promotion/i.test(q)) return { type: 'action', action: 'advertise' };

    const newsMatches = q.match(/\b(news|headlines?|latest|breaking|stories?)\b/i);
    if (newsMatches) {
      if (/\bworld|global|international\b/i.test(q)) return { type: 'feed', feed: 'world' };
      if (/\bmarket|stock|finance|business\b/i.test(q)) return { type: 'feed', feed: 'markets' };
      if (/\bcrypto|bitcoin|blockchain|nft\b/i.test(q)) return { type: 'feed', feed: 'crypto' };
      return { type: 'feed', feed: CONFIG.DEFAULT_NEWS_FEED };
    }

    if (/blog|post|article|written|writing/i.test(q)) return { type: 'blog_search' };

    return { type: 'search' };
  }

  /* ══════════════════════════════════════════════════════════════
     RENDER HELPERS
     ══════════════════════════════════════════════════════════════ */
  function addMsg(role, html) {
    const wrap = document.createElement('div');
    wrap.className = 'msg';
    wrap.setAttribute('role', 'article');
    const avatarContent = role === 'bot'
      ? `<img src="${CONFIG.LOGO_URL}" alt="">`
      : esc('You').charAt(0);
    wrap.innerHTML = `
      <div class="msg-avatar ${role === 'bot' ? 'bot' : 'user'}" aria-hidden="true">${avatarContent}</div>
      <div class="msg-body">
        <div class="msg-role">${role === 'bot' ? 'Digital Infohub' : 'You'}</div>
        <div class="msg-content">${html}</div>
      </div>`;
    chatThread.appendChild(wrap);
    chatThread.scrollTop = chatThread.scrollHeight;
    return wrap;
  }

  function addUserMsg(text) {
    addMsg('user', `<p>${esc(text)}</p>`);
  }

  async function typeBot(html, el) {
    if (!html) { html = '<p>Sorry, I have no response.</p>'; }
    const target = el.querySelector('.msg-content');
    if (!target) return;
    target.classList.add('typing-cursor');
    target.innerHTML = '';
    let i = 0, rendered = '';
    return new Promise(resolve => {
      const tick = () => {
        if (i >= html.length) { target.classList.remove('typing-cursor'); resolve(); return; }
        if (html[i] === '<') {
          const ci = html.indexOf('>', i);
          if (ci !== -1) { rendered += html.substring(i, ci + 1); i = ci + 1; }
          else { rendered += html[i]; i++; }
          target.innerHTML = rendered;
          requestAnimationFrame(tick);
          return;
        }
        rendered += html[i]; i++;
        target.innerHTML = rendered;
        const ch = html[i - 1];
        let delay = 10;
        if (ch === ' ') delay = 4;
        else if ('.!?'.includes(ch)) delay = 60;
        else if (ch === ',') delay = 30;
        delay += Math.random() * 8;
        setTimeout(tick, delay);
      };
      tick();
    });
  }

  function addRetryButton(msgEl, query) {
    const existing = msgEl.querySelector('.error-block');
    if (existing) existing.remove();
    const errBlock = document.createElement('div');
    errBlock.className = 'error-block';
    errBlock.innerHTML = `
      <div class="error-block-text">
        <strong>Something went wrong</strong>
        <div class="error-block-sub">I couldn't generate a response. Click below to try again.</div>
      </div>
      <button class="retry-btn" type="button">Try again</button>
    `;
    errBlock.querySelector('.retry-btn').addEventListener('click', () => {
      chatInput.value = query;
      handleSend();
    });
    msgEl.querySelector('.msg-content').appendChild(errBlock);
  }

  /* ══════════════════════════════════════════════════════════════
     RICH RENDERERS
     ══════════════════════════════════════════════════════════════ */
  function renderBlogCards(blogs) {
    if (!blogs || !blogs.length) return '<p>No blog posts found.</p>';
    let html = '<div class="rich-grid">';
    blogs.slice(0, 6).forEach((post, i) => {
      const grad = post.grad || 'linear-gradient(135deg, #6366f1, #8b5cf6)';
      const emoji = post.emoji || '📰';
      html += `
        <a class="blog-card" href="${escAttr(post.link)}" target="_blank" rel="noopener noreferrer" data-blog-title="${escAttr(post.title)}" role="button" aria-label="${escAttr(post.title)}">
          <div class="blog-cover">
            <div class="blog-cover-fallback" style="background:${grad}">${emoji}</div>
          </div>
          <div class="blog-info">
            <div class="blog-title">${esc(post.title)}</div>
            <div class="blog-meta">${esc(post.dateFormatted || '')}</div>
          </div>
        </a>`;
    });
    html += '</div>';
    return html;
  }

  function renderToolTiles(tools, limit = 6) {
    if (!tools || !tools.length) return '';
    let html = '<div class="rich-grid">';
    tools.slice(0, limit).forEach(t => {
      html += `<a class="tile" href="${escAttr(t.url)}" target="_blank" rel="noopener noreferrer" aria-label="Open ${escAttr(t.name)}">
        <div class="tile-name">${esc(t.icon)} ${esc(t.name)}</div>
        <div class="tile-desc">${esc(t.desc)}</div>
      </a>`;
    });
    html += '</div>';
    return html;
  }

  function renderFeed(articles, feedName) {
    if (!articles || !articles.length) {
      return `<p>Couldn't load articles from <strong>${esc(feedName)}</strong> right now. Please try again in a moment.</p>`;
    }
    let html = `<p style="margin-top:10px;font-size:12px;color:var(--text-muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:0.05em;">${esc(feedName)} — ${articles.length} articles</p><div class="rich-card"><ul style="list-style:none;">`;
    articles.forEach(a => {
      html += `<li style="padding:12px 16px;border-bottom:1px solid var(--border);">
        <a href="${escAttr(a.link)}" target="_blank" rel="noopener noreferrer" style="color:var(--text);text-decoration:none;font-size:13px;line-height:1.5;display:block;">${esc(a.title)}</a>
      </li>`;
    });
    html += '</ul></div>';
    return html;
  }

  /* ══════════════════════════════════════════════════════════════
     RESPONSE BUILDER
     ══════════════════════════════════════════════════════════════ */
  async function buildResponse(query) {
    try {
      const intent = detectIntent(query);

      if (intent.type === 'greet') {
        return `<p>Hey there! I'm <strong>Digital Infohub</strong> — your assistant for everything on this site.</p>
          <p>I can show you blogs, fetch news, and help you find tools. Try a question below, or just ask naturally.</p>`;
      }
      if (intent.type === 'thanks') return `<p>You're welcome! Let me know if there's anything else.</p>`;
      if (intent.type === 'bye') return `<p>See you next time 👋</p>`;
      if (intent.type === 'identity') return `<p>I'm <strong>Digital Infohub</strong> — an AI assistant built into this dashboard. I can search articles, find tools, and help you navigate everything on the site.</p>`;
      if (intent.type === 'help') {
        return `<p>Here's what I can do:</p>
          <p>• <strong>Show blogs &amp; articles</strong> — "show me blogs"<br>
          • <strong>Fetch news</strong> — "news", "tech news", "crypto news", "world news"<br>
          • <strong>Find tools</strong> — ask about any app you see on the page<br>
          • <strong>Navigation</strong> — "subscribe", "donate", "about"</p>`;
      }

      if (intent.type === 'feed') {
        const feed = CONFIG.FEEDS[intent.feed];
        if (!feed) return `<p>I couldn't find that news source.</p>`;
        const articles = await loadFeed(intent.feed);
        let html = `<p>Here are the latest from <strong>${esc(feed.name)}</strong>:</p>`;
        html += renderFeed(articles, feed.name);
        if (!articles || !articles.length) {
          html += `<p style="margin-top:10px;font-size:12px;color:var(--text-muted);">Try again in a moment if articles don't appear.</p>`;
        }
        return html;
      }

      if (intent.type === 'action') {
        if (intent.action === 'subscribe') {
          setTimeout(() => openLink(CONFIG.SITE_BASE + '/subscribe', 'Subscribe'), 400);
          return `<p>Opening the subscription page in a new tab…</p>`;
        }
        if (intent.action === 'donate') {
          return `<p>Thank you for supporting Digital Infohub!</p>
            <div class="rich-grid"><a class="tile" href="https://www.paypal.com/ncp/payment/QTX8WWTX8SBAG" target="_blank" rel="noopener noreferrer"><div class="tile-name">☕ Donate via PayPal</div><div class="tile-desc">Opens in new tab</div></a></div>`;
        }
        if (intent.action === 'advertise') {
          return `<p>Interested in advertising with us?</p>
            <div class="rich-grid"><a class="tile" href="mailto:services@digitalinfohub.net?subject=Advertising%20Inquiry"><div class="tile-name">📢 Email us</div><div class="tile-desc">services@digitalinfohub.net</div></a></div>`;
        }
      }

      if (intent.type === 'blog_search') {
        const queryLower = query.toLowerCase();
        const tokens = tokenize(queryLower).filter(t => !['blog','post','article','show','me','latest','new','the','a'].includes(t));
        let results;
        if (tokens.length) {
          results = cachedBlogs
            .map(b => ({ post: b, score: tokens.filter(t => (b.title + ' ' + b.keywords.join(' ')).includes(t)).length }))
            .filter(x => x.score > 0)
            .sort((a, b) => b.score - a.score)
            .map(x => x.post);
        } else {
          results = cachedBlogs.slice(0, 3);
        }
        if (!results.length) {
          return `<p>Here are the latest posts:</p>${renderBlogCards(cachedBlogs)}`;
        }
        return `<p>Here are the blog posts I found:</p>${renderBlogCards(results)}`;
      }

      const toolScores = scoreQuery(query, APPS);
      const blogScores = cachedBlogs.map(b => ({ ...b, name: b.title })).length
        ? scoreQuery(query, cachedBlogs.map(b => ({ ...b, name: b.title })))
        : [];

      const bestTool = toolScores[0];
      const bestBlog = blogScores[0];

      if (bestTool && bestTool.score >= 4) {
        const t = bestTool.item;
        let html = `<p>Opening <strong>${esc(t.name)}</strong> for you in a new tab. ${esc(t.desc)}.</p>`;
        const top3 = toolScores.slice(0, 3);
        if (top3.length > 1) {
          html += `<p style="font-size:12px;color:var(--text-muted);margin-top:8px;">You might also like:</p>`;
          html += renderToolTiles(top3.slice(1).map(x => x.item), 3);
        }
        setTimeout(() => openLink(t.url, t.name), 800);
        return html;
      }

      if (bestTool && bestTool.score >= 2) {
        const matches = toolScores.slice(0, 4);
        let html = `<p>I found a few tools that might match:</p>`;
        html += renderToolTiles(matches.map(x => x.item), 4);
        return html;
      }

      if (bestBlog && bestBlog.score >= 2) {
        const matches = blogScores.slice(0, 3).map(x => x.item);
        return `<p>Here are matching blog posts:</p>${renderBlogCards(matches)}`;
      }

      return `<p>I'm not sure what you mean. Try asking for a specific tool, blog, or news topic.</p>
        <p style="font-size:12px;color:var(--text-muted);margin-top:8px;">Popular options:</p>
        ${renderToolTiles(APPS.slice(0, 4), 4)}
        <p style="font-size:12px;color:var(--text-muted);margin-top:14px;">Or try asking for <strong>"news"</strong>, <strong>"blogs"</strong>, or say <strong>"help"</strong>.</p>`;

    } catch (err) {
      console.error('[AI] buildResponse error:', err);
      return `<p>I'm sorry, something went wrong while processing your request.</p>
        <p style="font-size:12px;color:var(--text-muted);margin-top:8px;">Please try rephrasing your question, or click the button below to retry.</p>`;
    }
  }

  /* ══════════════════════════════════════════════════════════════
     SEND HANDLER
     ══════════════════════════════════════════════════════════════ */
  async function handleSend() {
    if (isTyping) return;
    const text = chatInput.value.trim();
    if (!text) return;

    lastQuery = text;
    addUserMsg(text);
    chatInput.value = '';
    isTyping = true;
    chatSend.disabled = true;
    chatInput.disabled = true;

    const botMsg = addMsg('bot', '<p style="color:var(--text-muted);">Thinking…</p>');

    try {
      const html = await buildResponse(text);
      const contentEl = botMsg.querySelector('.msg-content');
      if (contentEl) contentEl.innerHTML = '';

      if (!html) {
        addRetryButton(botMsg, text);
      } else {
        await typeBot(html, botMsg);
      }
    } catch (err) {
      console.error('[Chat] error:', err);
      addRetryButton(botMsg, text);
    } finally {
      isTyping = false;
      chatSend.disabled = false;
      chatInput.disabled = false;
      chatInput.focus();
    }
  }

  chatForm.addEventListener('submit', e => { e.preventDefault(); handleSend(); });

  /* Welcome message */
  (async () => {
    isTyping = true;
    chatSend.disabled = true;
    const msg = addMsg('bot', '');
    await new Promise(r => setTimeout(r, 300));
    try {
      await typeBot(`<p>Welcome to <strong>Digital Infohub</strong>. I can show you blogs, fetch news, and help you find tools — just ask.</p><p>Try something like <em>"news"</em>, <em>"show me blogs"</em>, or say <em>"help"</em>.</p>`, msg);
    } catch (err) {
      console.error('[Welcome] error:', err);
      const contentEl = msg.querySelector('.msg-content');
      if (contentEl) contentEl.innerHTML = `<p>Welcome to <strong>Digital Infohub</strong>. How can I help you?</p>`;
    }
    isTyping = false;
    chatSend.disabled = false;
  })();

  /* ══════════════════════════════════════════════════════════════
     GLOBAL ERROR HANDLERS
     ══════════════════════════════════════════════════════════════ */
  window.addEventListener('error', e => {
    console.error('[Global] Uncaught error:', e.error || e.message);
  });
  window.addEventListener('unhandledrejection', e => {
    console.error('[Global] Unhandled rejection:', e.reason);
  });
  window.addEventListener('offline', () => toast('You appear to be offline', true));
  window.addEventListener('online', () => toast('Back online'));

  /* ══════════════════════════════════════════════════════════════
     NAVIGATION
     ══════════════════════════════════════════════════════════════ */
  const hamburger = $('#hamburger');
  const navDrawer = $('#navDrawer');
  const navDrawerOverlay = $('#navDrawerOverlay');
  const drawerClose = $('#drawerClose');

  function toggleDrawer(show) {
    const isOpen = show !== undefined ? show : !navDrawer.classList.contains('active');
    navDrawer.classList.toggle('active', isOpen);
    navDrawerOverlay.classList.toggle('active', isOpen);
    hamburger.classList.toggle('active', isOpen);
    hamburger.setAttribute('aria-expanded', isOpen);
    document.body.style.overflow = isOpen ? 'hidden' : '';
    
    if (isOpen) {
      setTimeout(() => drawerClose.focus(), 100);
    }
  }

  hamburger.addEventListener('click', () => toggleDrawer());
  drawerClose.addEventListener('click', () => toggleDrawer(false));
  navDrawerOverlay.addEventListener('click', () => toggleDrawer(false));

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && navDrawer.classList.contains('active')) {
      toggleDrawer(false);
    }
  });

})();
</script>
</body>
</html>
