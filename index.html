<style>
@property --border-angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }

}
[data-theme="light"] {
  --bg: #fafafa; --surface: #ffffff; --surface-2: #f4f4f5; --surface-3: #e4e4e7;

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

.icon-btn:hover { color: var(--text); border-color: var(--border-strong); background: var(--surface-2); }
.clock { font-family: var(--mono); font-size: 11px; color: var(--text-muted); padding: 6px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); white-space: nowrap; }

.ai-core { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 20px 16px; position: relative; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; min-height: 0; }
.ai-ambient-glow { position: fixed; top: -20%; left: 50%; transform: translateX(-50%); width: 800px; height: 600px; background: radial-gradient(circle, rgba(var(--glow-color),0.1) 0%, rgba(3,3,5,0) 60%); filter: blur(80px); pointer-events: none; z-index: 0; animation: ambientPulse 8s infinite alternate ease-in-out; }

.affiliate-btn { display: inline-flex !important; align-items: center !important; justify-content: center !important; gap: 6px !important; padding: 10px 16px !important; background: var(--accent) !important; color: #ffffff !important; border-radius: var(--radius-sm) !important; text-decoration: none !important; font-weight: 600 !important; font-size: 12px !important; border: none !important; box-shadow: 0 0 10px rgba(var(--glow-color),0.25); transition: all 0.2s ease !important; cursor: pointer !important; min-height: 40px; }
.affiliate-btn:hover { opacity: 0.9 !important; transform: translateY(-1px) !important; }

.skeleton-grid, .skeleton-list { display: flex; flex-direction: column; gap: 8px; }

.ai-input-area { position: relative; padding-top: 16px; padding-bottom: max(12px, env(safe-area-inset-bottom)); flex-shrink: 0; width: 100%; max-width: 600px; margin: 0 auto; }
.ai-input-wrapper { position: relative; border-radius: 24px; }
.ai-input-wrapper::before { content: ''; position: absolute; inset: -2px; border-radius: 26px; padding: 2px; background: conic-gradient(from var(--border-angle), transparent 0%, rgba(var(--glow-color), 0.6) 10%, var(--accent) 15%, rgba(var(--glow-color), 0.6) 20%, transparent 30%, transparent 50%, rgba(249, 115, 22, 0.5) 60%, var(--orange) 65%, rgba(249, 115, 22, 0.5) 70%, transparent 80%); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); mask-composite: exclude; animation: borderGlowSpin 4s linear infinite; opacity: 0.3; transition: opacity 0.4s ease; pointer-events: none; z-index: 1; }
@keyframes borderGlowSpin { to { --border-angle: 360deg; } }

.ai-input-shell { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 24px; padding: 6px 6px 6px 16px; display: flex; align-items: center; gap: 10px; transition: all 0.3s var(--ease); box-shadow: 0 4px 20px -4px rgba(0,0,0,0.2); position: relative; z-index: 2; }
.ai-input-shell:focus-within { border-color: rgba(var(--glow-color), 0.4); box-shadow: 0 0 0 4px var(--accent-glow), 0 8px 30px -8px var(--accent-glow); background: rgba(255,255,255,0.05); }
.ai-input { flex: 1; background: none; border: none; outline: none; color: var(--text); font-size: 16px; font-weight: 400; font-family: inherit; min-width: 0; padding: 10px 0; }
.ai-input::placeholder { color: var(--text-muted); }
.ai-send { width: 38px; height: 38px; border-radius: 50%; background: var(--accent); color: white; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; font-size: 16px; flex-shrink: 0; }
.ai-send:hover:not(:disabled) { transform: scale(1.05); }

.chat-thread { width: 100%; max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; padding: 12px 4px 32px; min-height: 0; flex-shrink: 0; }

.msg-avatar.bot { background: linear-gradient(135deg, var(--accent-soft), rgba(var(--glow-color),0.12)); border-color: rgba(var(--glow-color),0.25); color: var(--accent); }
.msg-avatar img { width: 100%; height: 100%; object-fit: cover; }

.msg-role { font-size: 11px; font-weight: 600; color: var(--text); }

.msg-content p + p { margin-top: 10px; }

@keyframes glowIn { 0% { opacity: 0; filter: blur(8px); transform: translateY(8px); } 100% { opacity: 1; filter: blur(0); transform: translateY(0); } }
.msg-content.glow-in { animation: glowIn 0.5s var(--ease-out) forwards; }

.chat-follow-ups { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

.follow-up-btn:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

/* ═══════════════ WIDGETS & DOCK ═══════════════ */
.widget-layer { position: fixed; inset: 0; pointer-events: none; z-index: 900; }
.floating-widget { position: absolute; width: 300px; background: rgba(10, 10, 12, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--border-strong); border-radius: var(--radius); box-shadow: 0 20px 50px -10px rgba(0,0,0,0.5); pointer-events: auto; display: flex; flex-direction: column; overflow: hidden; transition: box-shadow 0.2s; }

.widget-header { padding: 10px 14px; background: var(--surface-2); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; cursor: grab; user-select: none; }

.widget-title { font-size: 12px; font-weight: 700; color: var(--text); }
.widget-close { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 14px; padding: 2px 6px; border-radius: 4px; transition: all 0.2s; }

<script>
(function() {
'use strict';

const CONFIG = {
  LOGO_URL: "https://static.wixstatic.com/media/94ccfe_dec2763dd58148e78d3d8aaef72cf2fe~mv2.png",
  BOT_NAME: "Digital Infohub AI",
  FINNHUB_KEY: "d9t07ohr01qqd5j2v6rgd9t07ohr01qqd5j2v6s0",
  FEEDS: {
    tech: { name:'Tech', url:'https://techcrunch.com/feed/' },
    ai: { name:'AI', url:'https://techcrunch.com/category/artificial-intelligence/feed/' },
    markets: { name:'Markets', url:'https://rss.nytimes.com/services/xml/rss/nyt/Business.xml' }
  },
  STOCK_TICKERS: ['AAPL','MSFT','GOOGL','AMZN','NVDA','TSLA','SPY','QQQ']
};

const $ = s => document.querySelector(s);
const esc = s => { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; };
const scrollContainer = $('#chatHero');
const thread = $('#chatThread');

function getCompanyName(sym) {
  const map = { 'AAPL': 'Apple Inc.', 'MSFT': 'Microsoft', 'GOOGL': 'Alphabet', 'AMZN': 'Amazon', 'NVDA': 'NVIDIA', 'TSLA': 'Tesla', 'SPY': 'S&P 500 ETF', 'QQQ': 'Nasdaq 100 ETF', 'BTC': 'Bitcoin', 'ETH': 'Ethereum', 'SOL': 'Solana', 'XRP': 'Ripple' };
  return map[sym] || sym;
}

function getTimeString() { return new Date().toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' }); }
function getTimeAwareGreeting() { const h = new Date().getHours(); return h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening"; }

function scrollToBottom(smooth = true) {
  if (scrollContainer) requestAnimationFrame(() => scrollContainer.scrollTo({ top: scrollContainer.scrollHeight, behavior: smooth ? 'smooth' : 'auto' }));
}

function createSparklineSVG(isUp) {
  const points = 20; let path = "M 0 50 "; let y = 50; const trend = isUp ? -1.5 : 1.5;
  for (let i = 1; i <= points; i++) { const x = (i / points) * 100; y = Math.max(10, Math.min(90, y + trend + (Math.random() - 0.5) * 15)); path += `L ${x} ${y} `; }
  const color = isUp ? 'var(--green)' : 'var(--red)'; const gid = isUp ? 'gU' : 'gD';
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="none" class="market-sparkline"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="0.3"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${path} L 100 100 L 0 100 Z" fill="url(#${gid})" /><path d="${path}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke" /></svg>`;
}

function getCapabilitiesHTML() {
  return `
    <div style="background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-top: 8px;">
      <div style="font-size: 14px; font-weight: 700; margin-bottom: 12px;">🚀 Available Commands & Features</div>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;">
        <div>
          <div style="font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--accent); margin-bottom: 6px;">📊 Markets & Watchlist</div>
          <ul style="font-size: 12px; color: var(--text-sub); line-height: 1.8; padding-left: 16px; margin: 0;">
            <li><em>"How is Apple doing?"</em></li>
            <li><em>"Show BTC price"</em></li>
            <li><em>"Add NVDA to watchlist"</em></li>
            <li><em>"Show my watchlist"</em></li>
          </ul>
        </div>
        <div>
          <div style="font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--accent); margin-bottom: 6px;">📰 News & Concepts</div>
          <ul style="font-size: 12px; color: var(--text-sub); line-height: 1.8; padding-left: 16px; margin: 0;">
            <li><em>"Latest tech news"</em></li>
            <li><em>"Explain quantum computing"</em></li>
            <li><em>"What is blockchain?"</em></li>
            <li><em>"Market briefing"</em></li>
          </ul>
        </div>
        <div>
          <div style="font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--accent); margin-bottom: 6px;">🔍 Search & Tools</div>
          <ul style="font-size: 12px; color: var(--text-sub); line-height: 1.8; padding-left: 16px; margin: 0;">
            <li><em>"Search for AI trends"</em></li>
            <li><em>"Look up Tesla"</em></li>
            <li><em>"View AAPL chart"</em></li>
            <li><em>"Clear chat"</em></li>
          </ul>
        </div>
      </div>
    </div>
  `;
}

// --- WATCHLIST MODULE ---
const Watchlist = {
  key: 'dih_watchlist_v2', items: [],
  init() { try { this.items = JSON.parse(localStorage.getItem(this.key) || '[]'); } catch(e) { this.items = []; } },
  add(sym) { sym = sym.toUpperCase(); if(!this.items.includes(sym)) { this.items.push(sym); this.save(); return true; } return false; },
  remove(sym) { sym = sym.toUpperCase(); const idx = this.items.indexOf(sym); if(idx > -1) { this.items.splice(idx, 1); this.save(); return true; } return false; },
  save() { localStorage.setItem(this.key, JSON.stringify(this.items)); },
  get() { return this.items; }
};
Watchlist.init();

// --- DATA FETCHING ---
async function fetchRSS(url) {
  try {
    const r = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`);
    if (!r.ok) throw new Error();
    const data = await r.json();
    return (data.items || []).slice(0, 4).map(i => {
      let desc = i.description || i.content || '';
      desc = desc.replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim();
      return { title: i.title.replace(/<[^>]*>/g, ''), link: i.link, date: new Date(i.pubDate).toLocaleDateString('en-US', { month:'short', day:'numeric' }), source: data.feed?.title?.replace(/Feed$/, '').trim() || 'News', tldr: desc.substring(0, 140) + (desc.length > 140 ? '...' : '') };
    });
  } catch(e) { return null; }
}

async function fetchStocks(tickers = CONFIG.STOCK_TICKERS) {
  try {
    const results = await Promise.allSettled(tickers.map(sym => fetch(`https://finnhub.io/api/v1/quote?symbol=${sym}&token=${CONFIG.FINNHUB_KEY}`).then(r => r.json()).then(data => ({ sym, data }))));
    const valid = results.filter(r => r.status === 'fulfilled' && r.value.data && r.value.data.c).map(r => ({ symbol: r.value.sym, name: getCompanyName(r.value.sym), price: r.value.data.c.toFixed(2), changePct: (r.value.data.dp||0).toFixed(2), up: (r.value.data.d||0) >= 0 }));
    if (valid.length < 2) throw new Error();
    return valid;
  } catch(e) { return [{ symbol: 'AAPL', name: 'Apple Inc.', price: '178.35', changePct: '1.25', up: true }, { symbol: 'MSFT', name: 'Microsoft', price: '330.12', changePct: '-0.45', up: false }, { symbol: 'NVDA', name: 'NVIDIA', price: '460.18', changePct: '2.10', up: true }]; }
}

async function fetchCrypto(symbols = ['BTC','ETH','SOL','XRP']) {
  const ids = symbols.map(s => ({ 'BTC':'bitcoin', 'ETH':'ethereum', 'SOL':'solana', 'XRP':'ripple', 'DOGE':'dogecoin' }[s] || s.toLowerCase())).filter(id => ['bitcoin','ethereum','solana','ripple','dogecoin'].includes(id));
  if (ids.length === 0) return [];
  try {
    const r = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids.join(',')}&vs_currencies=usd&include_24hr_change=true`);
    const data = await r.json();
    return symbols.map(sym => {
      const id = { 'BTC':'bitcoin', 'ETH':'ethereum', 'SOL':'solana', 'XRP':'ripple', 'DOGE':'dogecoin' }[sym];
      if (id && data[id]) return { symbol: sym, name: getCompanyName(sym), price: data[id].usd.toLocaleString('en-US',{minimumFractionDigits:2}), changePct: (data[id].usd_24h_change||0).toFixed(2), up: (data[id].usd_24h_change||0) >= 0 };
      return null;
    }).filter(Boolean);
  } catch(e) { return [{ symbol: 'BTC', name: 'Bitcoin', price: '36,500.00', changePct: '1.50', up: true }, { symbol: 'ETH', name: 'Ethereum', price: '1,950.25', changePct: '-0.80', up: false }]; }
}

async function fetchWatchlistData() {
  const items = Watchlist.get();
  if (items.length === 0) return [];
  const cryptoSyms = ['BTC', 'ETH', 'SOL', 'XRP', 'DOGE'];
  const stocks = items.filter(s => !cryptoSyms.includes(s));
  const cryptos = items.filter(s => cryptoSyms.includes(s));
  const results = [];
  if (stocks.length > 0) { const s = await fetchStocks(stocks); if (s) results.push(...s); }
  if (cryptos.length > 0) { const c = await fetchCrypto(cryptos); if (c) results.push(...c); }
  return results;
}

async function renderDashboard() {
  const stocksEl = $('#dash-stocks'); stocksEl.innerHTML = '<div class="skeleton-grid"><div class="skeleton-card"></div><div class="skeleton-card"></div></div>';
  const stocks = await fetchStocks();
  stocksEl.innerHTML = stocks.slice(0, 4).map(s => `<div class="market-item" onclick="window.openChartModal('${s.symbol}', '${s.name}', '${s.price}', ${s.up})"><div class="market-info"><span class="market-symbol">${s.symbol}</span><span class="market-name">${s.name}</span></div>${createSparklineSVG(s.up)}<div class="market-price-area"><div class="market-price">$${s.price}</div><div class="market-change ${s.up ? 'up' : 'down'}">${s.up ? '▲' : '▼'} ${s.changePct}%</div></div></div>`).join('');

  const cryptoEl = $('#dash-crypto'); cryptoEl.innerHTML = '<div class="skeleton-grid"><div class="skeleton-card"></div><div class="skeleton-card"></div></div>';
  const crypto = await fetchCrypto();
  cryptoEl.innerHTML = crypto.map(c => `<div class="market-item" onclick="window.openChartModal('${c.symbol}', '${c.name}', '${c.price.replace(/,/g, '')}', ${c.up})"><div class="market-info"><span class="market-symbol">${c.symbol}</span><span class="market-name">${c.name}</span></div>${createSparklineSVG(c.up)}<div class="market-price-area"><div class="market-price">$${c.price}</div><div class="market-change ${c.up ? 'up' : 'down'}">${c.up ? '▲' : '▼'} ${c.changePct}%</div></div></div>`).join('');

  const techNewsEl = $('#dash-tech-news'); techNewsEl.innerHTML = '<div class="skeleton-list"><div class="skeleton-line"></div></div>';
  const techNews = await fetchRSS(CONFIG.FEEDS.tech.url);
  techNewsEl.innerHTML = techNews ? techNews.map(n => `<a class="news-card-enhanced" href="${esc(n.link)}" target="_blank" rel="noopener"><div class="news-category">${esc(n.source)}</div><div class="news-title-enhanced">${esc(n.title)}</div><div class="news-tldr">${esc(n.tldr)}</div></a>`).join('') : '<div class="error-state">⚠️ News unavailable</div>';

  const marketNewsEl = $('#dash-market-news'); marketNewsEl.innerHTML = '<div class="skeleton-list"><div class="skeleton-line"></div></div>';
  const marketNews = await fetchRSS(CONFIG.FEEDS.markets.url);
  marketNewsEl.innerHTML = marketNews ? marketNews.map(n => `<a class="news-card-enhanced" href="${esc(n.link)}" target="_blank" rel="noopener"><div class="news-category">${esc(n.source)}</div><div class="news-title-enhanced">${esc(n.title)}</div><div class="news-tldr">${esc(n.tldr)}</div></a>`).join('') : '<div class="error-state">⚠️ News unavailable</div>';

  renderTicker(crypto, stocks);
}

function renderTicker(crypto, stocks) {
  const el = $('#tickerBar'); if (!el) return;
  const all = [...(crypto||[]), ...(stocks||[])];
  if (!all.length) { el.style.display = 'none'; return; }
  el.style.display = 'inline-flex';
  el.innerHTML = [...all, ...all].map(a => `<div class="ticker-item"><strong>${a.symbol}</strong> <span>$${a.price}</span> <span class="${a.up?'up':'down'}">${a.up?'▲':'▼'} ${a.changePct}%</span></div>`).join('');
}

// --- CHART MODAL ---
let chartInstance = null, currentChartPrice = 0, currentChartIsUp = true;
function openChartModal(symbol, name, price, isUp) {
  currentChartPrice = parseFloat(price); currentChartIsUp = isUp;
  $('#chartTitle').textContent = `${symbol} - ${name}`;
  $('#chartPrice').textContent = `$${price}`; $('#chartPrice').style.color = isUp ? 'var(--green)' : 'var(--red)';
  $('#chartModal').classList.add('active');
  document.querySelectorAll('.timeframe-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.timeframe-btn[data-tf="1D"]').classList.add('active');
  updateChartData('1D');
}
function closeChartModal() { $('#chartModal').classList.remove('active'); if (chartInstance) { chartInstance.destroy(); chartInstance = null; } }
function updateChartTimeframe(tf) { document.querySelectorAll('.timeframe-btn').forEach(b => b.classList.remove('active')); document.querySelector(`.timeframe-btn[data-tf="${tf}"]`).classList.add('active'); updateChartData(tf); }
function updateChartData(timeframe) {
  const ctx = $('#priceChart').getContext('2d'); if (chartInstance) chartInstance.destroy();
  const points = timeframe === '1D' ? 24 : timeframe === '1W' ? 7 : 30;
  const labels = [], data = []; let price = currentChartPrice * (currentChartIsUp ? 0.95 : 1.05);
  for (let i = 0; i < points; i++) { price += (Math.random() - (currentChartIsUp ? 0.4 : 0.6)) * (currentChartPrice * 0.02); data.push(price); labels.push(timeframe === '1D' ? `${i}:00` : `D${i+1}`); }
  data[data.length - 1] = currentChartPrice;
  const color = currentChartIsUp ? '#4ade80' : '#f87171';
  chartInstance = new Chart(ctx, { type: 'line', data: { labels, datasets: [{ data, borderColor: color, backgroundColor: color + '20', borderWidth: 2, fill: true, tension: 0.4, pointRadius: 0 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false }, ticks: { color: '#64748B', maxTicksLimit: 6 } }, y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#64748B' } } } } });
}

// --- INTENT DETECTION ---
const TICKER_MAP = { 'apple': 'AAPL', 'tesla': 'TSLA', 'nvidia': 'NVDA', 'microsoft': 'MSFT', 'amazon': 'AMZN', 'google': 'GOOGL', 'bitcoin': 'BTC', 'ethereum': 'ETH', 'solana': 'SOL', 'ripple': 'XRP' };
const Intent = {
  detect(input) {
    const lower = input.toLowerCase().trim();
    if (/^(hi|hello|hey)\b/i.test(lower)) return { type:'greeting' };
    if (/\b(thank|thanks)\b/i.test(lower)) return { type:'thanks' };
    if (/^(what can you do|help|capabilities)\b/i.test(lower)) return { type:'capabilities' };
    if (/\b(clear chat|reset)\b/i.test(lower)) return { type:'clear_chat' };

    let extractedTicker = null;
    for (const [key, ticker] of Object.entries(TICKER_MAP)) { if (lower.includes(key)) { extractedTicker = ticker; break; } }
    if (!extractedTicker) { const m = input.match(/\b([A-Z]{1,5})\b/); if (m && !['THE','AND','FOR','ARE'].includes(m[1])) extractedTicker = m[1]; }

    if (extractedTicker && /\b(stock|price|doing|chart|how is|show)\b/i.test(lower)) return { type: 'stock_detail', symbol: extractedTicker };
    if (extractedTicker && /\b(crypto|coin|bitcoin)\b/i.test(lower)) return { type: 'crypto_detail', symbol: extractedTicker };

    const watchAdd = lower.match(/\b(add|watch|track)\s+([a-z0-9]{1,5})\b/i);
    if (watchAdd) return { type: 'watchlist_add', symbol: watchAdd[2].toUpperCase() };
    const watchRem = lower.match(/\b(remove|delete|unwatch)\s+([a-z0-9]{1,5})\b/i);
    if (watchRem) return { type: 'watchlist_remove', symbol: watchRem[2].toUpperCase() };
    if (/\b(show|view|check|my)\s*(watchlist|portfolio)\b/i.test(lower) || lower === 'watchlist') return { type: 'watchlist_view' };

    if (/\b(market|stock|crypto)\b/i.test(lower) && /\b(briefing|update|summary)\b/i.test(lower)) return { type:'market_briefing' };
    if (/\b(stock|market)\b/i.test(lower)) return { type:'stocks' };
    if (/\b(crypto|bitcoin)\b/i.test(lower)) return { type:'crypto' };
    if (/\b(news|headlines)\b/i.test(lower)) return { type:'news', category: /\btech\b/i.test(lower) ? 'tech' : 'markets' };
    
    if (/\b(explain|what is|how does|tell me about|deep dive)\b/i.test(lower) && /\b(ai|blockchain|quantum|neural|machine learning|web3|iot|cloud|cybersecurity|5g|ar|vr)\b/i.test(lower)) {
      const topicMatch = lower.match(/\b(ai|blockchain|quantum computing|neural networks|machine learning|web3|iot|cloud computing|cybersecurity|5g|ar|vr)\b/i);
      return { type: 'educational_tech', topic: topicMatch ? topicMatch[1] : 'technology' };
    }

    const searchMatch = lower.match(/\b(search|look up|find|google|duckduckgo)\s+(?:for\s+)?(.+)/i);
    if (searchMatch) return { type: 'web_search', query: searchMatch[2].trim() };

    return { type:'fallback', query: input };
  }
};

// --- CHAT UI ---
let isProcessing = false, msgIdCounter = 0;
function addMsg(role, html, instant) {
  const div = document.createElement('div'); div.className = `msg ${role}`;
  const contentId = `msg-content-${++msgIdCounter}`;
  const avatar = role === 'bot' ? `<img src="${CONFIG.LOGO_URL}" alt="">` : esc(Memory.getName() || 'You').charAt(0).toUpperCase();
  div.innerHTML = `<div class="msg-avatar ${role}">${avatar}</div><div class="msg-body"><div class="msg-header"><span class="msg-role">${role === 'bot' ? CONFIG.BOT_NAME : 'You'}</span><span class="msg-time">${getTimeString()}</span></div><div class="msg-content" id="${contentId}">${instant ? html : ''}</div></div>`;
  thread.appendChild(div);
  const isNearBottom = scrollContainer.scrollHeight - scrollContainer.scrollTop - scrollContainer.clientHeight < 150;
  if (isNearBottom || instant) scrollToBottom(true);
  return { element: div, contentEl: div.querySelector(`#${contentId}`) };
}
function revealWithGlow(contentEl, html) { contentEl.innerHTML = html; contentEl.classList.add('data-fade-in'); scrollToBottom(true); }
function showResearching() {
  const div = document.createElement('div'); div.className = 'msg bot';
  div.innerHTML = `<div class="msg-avatar bot"><img src="${CONFIG.LOGO_URL}" alt=""></div><div class="msg-body"><div class="research-steps"><div class="step active"><span class="step-icon">◌</span> Analyzing request...</div><div class="step"><span class="step-icon">◌</span> Fetching live data...</div></div></div>`;
  thread.appendChild(div); scrollToBottom(true); return div;
}
function advanceResearchStep(el) { if (!el) return; const active = el.querySelector('.step.active'); if (!active) return; active.classList.remove('active'); active.classList.add('done'); active.querySelector('.step-icon').textContent = '✓'; const next = active.nextElementSibling; if (next) next.classList.add('active'); scrollToBottom(true); }

async function handleSend(text) {
  if (isProcessing || !text || !text.trim()) return;
  isProcessing = true;
  const inputs = [$('#chatInput'), $('#chatInputBottom')];
  const btns = [$('#chatSend'), $('#chatSendBottom')];
  btns.forEach(b => { if(b) b.disabled = true; });
  inputs.forEach(i => { if(i) i.disabled = true; });
  
  addMsg('user', esc(text), true);
  inputs.forEach(i => { if(i) i.value = ''; });
  
  const researchEl = showResearching();
  let stepIdx = 0;
  const stepInterval = setInterval(() => { stepIdx++; advanceResearchStep(researchEl); if (stepIdx >= 1) clearInterval(stepInterval); }, 400);

  try {
    await new Promise(r => setTimeout(r, 300));
    const response = await AI.process(text.trim());
    clearInterval(stepInterval); if (researchEl && researchEl.parentNode) researchEl.remove();
    if (response === '__CLEAR_CHAT__') { thread.innerHTML = ''; Memory.data.history = []; Memory.data.conversationContext = []; Memory.save(); const { contentEl } = addMsg('bot', '', false); revealWithGlow(contentEl, '<p>✨ Chat cleared.</p>'); return; }
    Memory.addContext('bot', response);
    const { contentEl } = addMsg('bot', '', false);
    revealWithGlow(contentEl, response);
  } catch(err) {
    console.error(err); clearInterval(stepInterval); if (researchEl && researchEl.parentNode) researchEl.remove();
    const { contentEl } = addMsg('bot', '', false); revealWithGlow(contentEl, '<p>⚠️ Something went wrong. Please try again.</p>');
  } finally {
    isProcessing = false;
    btns.forEach(b => { if(b) b.disabled = false; });
    inputs.forEach(i => { if(i) { i.disabled = false; i.focus({ preventScroll: true }); } });
  }
}

window.handleSend = handleSend; window.openChartModal = openChartModal; window.closeChartModal = closeChartModal; window.updateChartTimeframe = updateChartTimeframe; window.renderDashboard = renderDashboard;

const Memory = {
  key: 'dih_ai_memory_v8', data: { name:null, history:[], conversationContext:[] },
  init() { try { const s = localStorage.getItem(this.key); if (s) this.data = { ...this.data, ...JSON.parse(s) }; } catch(e) {} },
  save() { try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch(e) {} },
  getName() { return this.data.name; },
  addHistory(q) { this.data.history.unshift({ q, ts: Date.now() }); if (this.data.history.length > 50) this.data.history.pop(); this.save(); },
  addContext(role, text) { this.data.conversationContext.push({ role, text, ts: Date.now() }); if (this.data.conversationContext.length > 20) this.data.conversationContext.shift(); this.save(); },
  getContext() { return this.data.conversationContext.slice(-6); }
};
Memory.init();

const HistoryManager = {
  key: 'dih_chat_sessions_v3', sessions: [],
  init() { try { const saved = localStorage.getItem(this.key); if (saved) this.sessions = JSON.parse(saved); } catch(e) { this.sessions = []; } this.render(); },
  saveCurrentSession() {
    const context = Memory.getContext(); if (context.length === 0) return;
    const firstUser = context.find(c => c.role === 'user'); if (!firstUser) return;
    const title = firstUser.text.substring(0, 36) + (firstUser.text.length > 36 ? '...' : '');
    if (this.sessions.length > 0 && this.sessions[0].title === title && (Date.now() - this.sessions[0].savedAt) < 5000) { this.sessions[0].context = JSON.parse(JSON.stringify(context)); this.sessions[0].savedAt = Date.now(); this.save(); this.render(); return; }
    this.sessions.unshift({ id: Date.now(), title, date: new Date().toISOString(), savedAt: Date.now(), context: JSON.parse(JSON.stringify(context)) });
    if (this.sessions.length > 30) this.sessions.pop(); this.save(); this.render();
  },
  clearCurrentChat() { this.saveCurrentSession(); thread.innerHTML = ''; Memory.data.conversationContext = []; Memory.save(); showWelcomeMessage(); },
  loadSession(id) {
    const session = this.sessions.find(s => s.id === id); if (!session) return;
    thread.innerHTML = ''; Memory.data.conversationContext = JSON.parse(JSON.stringify(session.context)); Memory.save();
    session.context.forEach(msg => {
      const div = document.createElement('div'); div.className = `msg ${msg.role}`;
      const avatar = msg.role === 'bot' ? `<img src="${CONFIG.LOGO_URL}" alt="">` : esc(Memory.getName() || 'You').charAt(0).toUpperCase();
      div.innerHTML = `<div class="msg-avatar ${msg.role}">${avatar}</div><div class="msg-body"><div class="msg-header"><span class="msg-role">${msg.role === 'bot' ? CONFIG.BOT_NAME : 'You'}</span><span class="msg-time">${new Date(msg.ts).toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' })}</span></div><div class="msg-content">${msg.text}</div></div>`;
      thread.appendChild(div);
    });
    scrollToBottom(false);
  },
  deleteSession(id) { this.sessions = this.sessions.filter(s => s.id !== id); this.save(); this.render(); },
  clearAll() { this.sessions = []; this.save(); this.render(); },
  save() { try { localStorage.setItem(this.key, JSON.stringify(this.sessions)); } catch(e) {} },
  render() {
    const list = $('#historyList'); if (!list) return;
    if (this.sessions.length === 0) { list.innerHTML = '<div style="padding:14px;text-align:center;font-size:11px;color:var(--text-muted);">No past conversations</div>'; return; }
    let html = '';
    this.sessions.forEach(s => { html += `<button class="history-item" data-id="${s.id}"><span class="history-title">${esc(s.title)}</span><span class="history-delete" data-del="${s.id}">✕</span></button>`; });
    list.innerHTML = html;
    list.querySelectorAll('.history-item').forEach(btn => { btn.addEventListener('click', e => { if (e.target.closest('.history-delete')) return; this.loadSession(parseInt(btn.dataset.id)); if (window.innerWidth < 1024) closeSidebar(); }); });
    list.querySelectorAll('.history-delete').forEach(del => { del.addEventListener('click', e => { e.stopPropagation(); this.deleteSession(parseInt(del.dataset.del)); }); });
  }
};
HistoryManager.init();

function closeSidebar() { $('#sidebar').classList.remove('active'); $('#sidebarOverlay').classList.remove('active'); document.body.style.overflow = ''; }
$('#sidebarToggle').addEventListener('click', toggleSidebar);
$('#sidebarClose').addEventListener('click', closeSidebar);
$('#sidebarOverlay').addEventListener('click', closeSidebar);

let theme = localStorage.getItem('dih_theme') || 'dark';
document.documentElement.setAttribute('data-theme', theme);
$('#themeToggle').addEventListener('click', () => { theme = theme === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', theme); localStorage.setItem('dih_theme', theme); });

function updateClock() { const el = $('#clock'); if (el) el.textContent = new Date().toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' }); }
updateClock(); setInterval(updateClock, 1000);

$('#chartModal').addEventListener('click', e => { if (e.target === $('#chartModal')) closeChartModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeSidebar(); closeChartModal(); } });

// ═══════════════ WIDGET MANAGER ═══════════════
const WidgetManager = {
  state: { open: [] },
  init() {
    try { const saved = localStorage.getItem('dih_widgets_v1'); if (saved) this.state = JSON.parse(saved); } catch(e) {}
    this.renderDock();
    this.state.open.forEach(type => this.createWidgetElement(type));
  },
  save() { localStorage.setItem('dih_widgets_v1', JSON.stringify(this.state)); },
  toggle(type) {
    if (this.state.open.includes(type)) { this.close(type); } else { this.open(type); }
  },
  open(type) {
    if (!this.state.open.includes(type)) {
      this.state.open.push(type); this.save();
      this.createWidgetElement(type); this.updateDock();
    }
  },
  close(type) {
    this.state.open = this.state.open.filter(w => w !== type); this.save();
    document.getElementById(`widget-${type}`)?.remove(); this.updateDock();
  },
  updateDock() {
    document.querySelectorAll('.dock-item').forEach(el => {
      el.classList.toggle('active', this.state.open.includes(el.dataset.type));
    });
  },
  renderDock() {
    const dock = $('#widgetDock');
    const items = [
      { type: 'weather', icon: '🌤️', label: 'Weather' },
      { type: 'notes', icon: '📝', label: 'Notes & Tasks' },
      { type: 'calc', icon: '🧮', label: 'Calculator' },
      { type: 'timer', icon: '⏱️', label: 'Focus Timer' }
    ];
    dock.innerHTML = items.map(i => `<button class="dock-item" data-type="${i.type}" title="${i.label}" onclick="WidgetManager.toggle('${i.type}')"><span>${i.icon}</span></button>`).join('');
    this.updateDock();
  },
  createWidgetElement(type) {
    if (document.getElementById(`widget-${type}`)) return;
    const el = document.createElement('div');
    el.id = `widget-${type}`; el.className = 'floating-widget';
    el.style.left = (80 + this.state.open.length * 30) + 'px';
    el.style.top = (80 + this.state.open.length * 30) + 'px';
    el.style.zIndex = 1000 + this.state.open.length;
    
    let content = '';
    if (type === 'weather') content = this.getWeatherHTML();
    else if (type === 'notes') content = this.getNotesHTML();
    else if (type === 'calc') content = this.getCalcHTML();
    else if (type === 'timer') content = this.getTimerHTML();

    el.innerHTML = `<div class="widget-header widget-drag-handle"><span class="widget-title">${this.getTitle(type)}</span><button class="widget-close" onclick="WidgetManager.close('${type}')">✕</button></div><div class="widget-body">${content}</div>`;
    $('#widgetLayer').appendChild(el);
    
    if (type === 'weather') this.initWeather(el);
    else if (type === 'notes') this.initNotes(el);
    else if (type === 'calc') this.initCalc(el);
    else if (type === 'timer') this.initTimer(el);
  },
  getTitle(type) { return { weather: 'Weather', notes: 'Notes & Tasks', calc: 'Calculator', timer: 'Focus Timer' }[type] || 'Widget'; },
  
  // Weather
  getWeatherHTML() {
    const city = localStorage.getItem('dih_weather_city') || '';
    return city ? `<div class="weather-display" id="weatherDisplay">Loading...</div>` : `
      <div class="weather-setup">
        <p style="font-size:12px;color:var(--text-sub);margin-bottom:8px;">Set your location</p>
        <form id="weatherForm" style="display:flex;gap:6px;">
          <input type="text" id="weatherCityInput" placeholder="e.g. London" style="flex:1;padding:6px 10px;background:var(--surface-3);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;outline:none;">
          <button type="submit" style="padding:6px 12px;background:var(--accent);color:white;border:none;border-radius:6px;cursor:pointer;font-size:12px;">Set</button>
        </form>
      </div>`;
  },
  initWeather(el) {
    const city = localStorage.getItem('dih_weather_city');
    if (city) this.fetchAndRenderWeather(city, el);
    const form = el.querySelector('#weatherForm');
    if (form) {
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const val = el.querySelector('#weatherCityInput').value.trim();
        if (val) {
          localStorage.setItem('dih_weather_city', val);
          el.querySelector('.widget-body').innerHTML = `<div class="weather-display" id="weatherDisplay">Loading...</div>`;
          this.fetchAndRenderWeather(val, el);
        }
      });
    }
  },
  async fetchAndRenderWeather(city, el) {
    try {
      const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1`);
      const geoData = await geoRes.json();
      if (!geoData.results || !geoData.results.length) throw new Error('City not found');
      const loc = geoData.results[0];
      const wxRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}&current_weather=true`);
      const wxData = await wxRes.json();
      const wx = wxData.current_weather;
      const display = el.querySelector('#weatherDisplay');
      if (display) {
        display.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
            <div>
              <div style="font-size:14px;font-weight:700;">${loc.name}${loc.country ? ', ' + loc.country : ''}</div>
              <button onclick="WidgetManager.changeWeatherCity()" style="background:none;border:none;color:var(--accent);font-size:10px;cursor:pointer;padding:0;margin-top:2px;">Change location</button>
            </div>
            <div style="font-size:24px;">${this.getWeatherEmoji(wx.weathercode)}</div>
          </div>
          <div style="font-size:32px;font-weight:800;font-family:var(--mono);">${wx.temperature}°C</div>
          <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">Wind: ${wx.windspeed} km/h</div>
        `;
      }
    } catch (e) {
      const display = el.querySelector('#weatherDisplay');
      if (display) display.innerHTML = `<p style="color:var(--red);font-size:12px;">Could not find location. <button onclick="WidgetManager.changeWeatherCity()" style="background:none;border:none;color:var(--accent);cursor:pointer;font-size:12px;">Try again</button></p>`;
    }
  },
  changeWeatherCity() {
    localStorage.removeItem('dih_weather_city');
    const el = document.getElementById('widget-weather');
    if (el) { el.querySelector('.widget-body').innerHTML = this.getWeatherHTML(); this.initWeather(el); }
  },
  getWeatherEmoji(code) {
    if (code === 0) return '☀️'; if (code <= 3) return '⛅'; if (code <= 48) return '🌫️';
    if (code <= 67) return '🌧️'; if (code <= 77) return '🌨️'; if (code <= 82) return '🌧️';
    if (code <= 86) return '🌨️'; if (code >= 95) return '⛈️'; return '🌡️';
  },

  // Notes
  getNotesHTML() {
    const data = JSON.parse(localStorage.getItem('dih_notes_tasks') || '{"notes":"","tasks":[]}');
    return `
      <div style="display:flex;flex-direction:column;gap:12px;">
        <div>
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px;">Notes</div>
          <textarea id="widgetNotesArea" style="width:100%;height:80px;background:var(--surface-3);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:8px;font-family:var(--font);font-size:12px;resize:none;outline:none;">${esc(data.notes)}</textarea>
        </div>
        <div>
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px;">Tasks</div>
          <form id="widgetTaskForm" style="display:flex;gap:6px;margin-bottom:8px;">
            <input type="text" id="widgetTaskInput" placeholder="Add a task..." style="flex:1;padding:6px 10px;background:var(--surface-3);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;outline:none;">
            <button type="submit" style="padding:6px 12px;background:var(--accent);color:white;border:none;border-radius:6px;cursor:pointer;font-size:12px;">Add</button>
          </form>
          <ul id="widgetTaskList" style="list-style:none;padding:0;margin:0;max-height:120px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;">
            ${data.tasks.map((t, i) => `
              <li style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-sub);background:var(--surface-3);padding:6px 8px;border-radius:6px;${t.done ? 'opacity:0.5;text-decoration:line-through;' : ''}">
                <input type="checkbox" ${t.done ? 'checked' : ''} onchange="WidgetManager.toggleTask(${i})" style="accent-color:var(--accent);cursor:pointer;">
                <span style="flex:1;">${esc(t.text)}</span>
                <span onclick="WidgetManager.deleteTask(${i})" style="cursor:pointer;color:var(--red);font-size:14px;">✕</span>
              </li>
            `).join('')}
          </ul>
        </div>
      </div>
    `;
  },
  initNotes(el) {
    const area = el.querySelector('#widgetNotesArea');
    area.addEventListener('input', () => {
      const data = JSON.parse(localStorage.getItem('dih_notes_tasks') || '{"notes":"","tasks":[]}');
      data.notes = area.value; localStorage.setItem('dih_notes_tasks', JSON.stringify(data));
    });
    const form = el.querySelector('#widgetTaskForm');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const input = el.querySelector('#widgetTaskInput');
      if (input.value.trim()) {
        const data = JSON.parse(localStorage.getItem('dih_notes_tasks') || '{"notes":"","tasks":[]}');
        data.tasks.push({ text: input.value.trim(), done: false });
        localStorage.setItem('dih_notes_tasks', JSON.stringify(data));
        input.value = '';
        el.querySelector('.widget-body').innerHTML = this.getNotesHTML(); this.initNotes(el);
      }
    });
  },
  toggleTask(idx) {
    const data = JSON.parse(localStorage.getItem('dih_notes_tasks') || '{"notes":"","tasks":[]}');
    data.tasks[idx].done = !data.tasks[idx].done; localStorage.setItem('dih_notes_tasks', JSON.stringify(data));
    const el = document.getElementById('widget-notes');
    if (el) { el.querySelector('.widget-body').innerHTML = this.getNotesHTML(); this.initNotes(el); }
  },
  deleteTask(idx) {
    const data = JSON.parse(localStorage.getItem('dih_notes_tasks') || '{"notes":"","tasks":[]}');
    data.tasks.splice(idx, 1); localStorage.setItem('dih_notes_tasks', JSON.stringify(data));
    const el = document.getElementById('widget-notes');
    if (el) { el.querySelector('.widget-body').innerHTML = this.getNotesHTML(); this.initNotes(el); }
  },

  // Calculator
  getCalcHTML() {
    return `
      <div>
        <input type="text" id="calcDisplay" readonly style="width:100%;padding:10px;background:var(--surface-3);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--mono);font-size:18px;text-align:right;margin-bottom:10px;outline:none;">
        <div style="display:grid;grid-template-columns:repeat(4, 1fr);gap:6px;">
          ${['C', '(', ')', '/', '7', '8', '9', '*', '4', '5', '6', '-', '1', '2', '3', '+', '0', '.', '=', ''].map(b => {
            if (b === '') return '<div></div>';
            const isOp = ['+', '-', '*', '/', '=', 'C', '(', ')'].includes(b);
            return `<button class="calc-btn" data-val="${b}" style="padding:10px;background:${isOp ? 'var(--accent-soft)' : 'var(--surface-3)'};color:${isOp ? 'var(--accent)' : 'var(--text)'};border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:14px;font-weight:600;">${b}</button>`;
          }).join('')}
        </div>
      </div>
    `;
  },
  initCalc(el) {
    const display = el.querySelector('#calcDisplay');
    el.querySelectorAll('.calc-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const val = btn.dataset.val;
        if (val === 'C') { display.value = ''; }
        else if (val === '=') {
          try {
            if (/[^0-9+\-*/().\s]/.test(display.value)) throw new Error();
            display.value = Function('"use strict"; return (' + display.value + ')')();
          } catch (e) { display.value = 'Error'; }
        } else { display.value += val; }
      });
    });
  },

  // Timer
  getTimerHTML() {
    return `
      <div style="text-align:center;">
        <div id="timerDisplay" style="font-size:36px;font-weight:800;font-family:var(--mono);margin:16px 0;">25:00</div>
        <div style="display:flex;gap:8px;justify-content:center;">
          <button id="timerStart" style="padding:8px 16px;background:var(--green);color:white;border:none;border-radius:6px;cursor:pointer;font-weight:600;">Start</button>
          <button id="timerReset" style="padding:8px 16px;background:var(--surface-3);color:var(--text);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-weight:600;">Reset</button>
        </div>
      </div>
    `;
  },
  initTimer(el) {
    let timeLeft = 25 * 60, interval = null;
    const display = el.querySelector('#timerDisplay');
    const startBtn = el.querySelector('#timerStart');
    const resetBtn = el.querySelector('#timerReset');
    const updateDisplay = () => {
      const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
      const s = (timeLeft % 60).toString().padStart(2, '0');
      display.textContent = `${m}:${s}`;
    };
    startBtn.addEventListener('click', () => {
      if (interval) {
        clearInterval(interval); interval = null;
        startBtn.textContent = 'Start'; startBtn.style.background = 'var(--green)';
      } else {
        interval = setInterval(() => {
          if (timeLeft > 0) { timeLeft--; updateDisplay(); }
          else { clearInterval(interval); interval = null; startBtn.textContent = 'Start'; startBtn.style.background = 'var(--green)'; display.textContent = "Done!"; }
        }, 1000);
        startBtn.textContent = 'Pause'; startBtn.style.background = 'var(--orange)';
      }
    });
    resetBtn.addEventListener('click', () => {
      clearInterval(interval); interval = null; timeLeft = 25 * 60; updateDisplay();
      startBtn.textContent = 'Start'; startBtn.style.background = 'var(--green)';
    });
  }
};
window.WidgetManager = WidgetManager;

// --- DRAGGING LOGIC ---
let activeWidget = null, offsetX = 0, offsetY = 0, zCounter = 1000;
document.addEventListener('pointerdown', (e) => {
  const handle = e.target.closest('.widget-drag-handle');
  if (!handle || e.target.closest('.widget-close')) return;
  activeWidget = handle.closest('.floating-widget');
  const rect = activeWidget.getBoundingClientRect();
  offsetX = e.clientX - rect.left; offsetY = e.clientY - rect.top;
  activeWidget.style.zIndex = ++zCounter;
  activeWidget.style.cursor = 'grabbing';
  document.body.style.userSelect = 'none';
});
document.addEventListener('pointermove', (e) => {
  if (!activeWidget) return;
  let x = e.clientX - offsetX, y = e.clientY - offsetY;
  x = Math.max(0, Math.min(x, window.innerWidth - activeWidget.offsetWidth));
  y = Math.max(0, Math.min(y, window.innerHeight - activeWidget.offsetHeight));
  activeWidget.style.left = x + 'px'; activeWidget.style.top = y + 'px';
});
document.addEventListener('pointerup', () => {
  if (activeWidget) { activeWidget.style.cursor = 'grab'; document.body.style.userSelect = ''; }
  activeWidget = null;
});

// --- INIT ---
(async () => {
  await renderDashboard();
  WidgetManager.init();
  const ctx = Memory.getContext();
  if (ctx.length === 0) showWelcomeMessage();
  else {
    ctx.forEach(msg => {
      const div = document.createElement('div'); div.className = `msg ${msg.role}`;
      const avatar = msg.role === 'bot' ? `<img src="${CONFIG.LOGO_URL}" alt="">` : esc(Memory.getName() || 'You').charAt(0).toUpperCase();
      div.innerHTML = `<div class="msg-avatar ${msg.role}">${avatar}</div><div class="msg-body"><div class="msg-header"><span class="msg-role">${msg.role === 'bot' ? CONFIG.BOT_NAME : 'You'}</span><span class="msg-time">${new Date(msg.ts).toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' })}</span></div><div class="msg-content">${msg.text}</div></div>`;
      thread.appendChild(div);
    });
    scrollToBottom(false);
  }
})();

setInterval(() => HistoryManager.saveCurrentSession(), 30000);
window.addEventListener('beforeunload', () => HistoryManager.saveCurrentSession());
window.addEventListener('resize', () => { if (window.innerWidth >= 1024) closeSidebar(); });

})();
