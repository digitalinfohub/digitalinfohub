<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager | Digital Infohub</title>
    <script src="https://www.paypal.com/sdk/js?client-id=BAAWPO7p_oIMxRK7-euIX6su8WnqCJLuHdvvNOwh3Fc7ycnF1ripj2YSUbBdZVy8DfoJN6E-AJeUfSESRM&components=hosted-buttons&disable-funding=venmo&currency=GBP"></script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5443646750699471" crossorigin="anonymous"></script>
    <style>
        :root { --primary: #3b82f6; --bg: #f8fafc; --card-bg: #ffffff; --text: #1e293b; --border: #e2e8f0; }
        [data-theme="dark"] { --bg: #0f172a; --card-bg: #1e293b; --text: #f1f5f9; --border: #334155; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; transition: background 0.3s; }
        .container { max-width: 600px; margin: 0 auto; padding: 2rem; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        h1 { margin: 0; font-size: 1.8rem; }
        .badge { background: var(--primary); color: white; padding: 0.25rem 0.75rem; border-radius: 99px; font-size: 0.8rem; font-weight: bold; }
        .tool-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 2rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        
        .input-row { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
        input[type="text"] { flex: 1; padding: 0.75rem; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-size: 1rem; }
        button { padding: 0.75rem 1.5rem; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 1rem; transition: all 0.2s; white-space: nowrap; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
        button:hover { transform: translateY(-2px); opacity: 0.9; }
        
        .task-list { list-style: none; padding: 0; margin: 0; }
        .task-item { display: flex; align-items: center; gap: 1rem; padding: 1rem; border-bottom: 1px solid var(--border); animation: slideIn 0.3s ease-out; }
        .task-item:last-child { border-bottom: none; }
        .task-item.completed span { text-decoration: line-through; opacity: 0.6; }
        .task-checkbox { width: 20px; height: 20px; cursor: pointer; }
        .delete-btn { background: #ef4444; color: white; padding: 0.4rem 0.8rem; font-size: 0.8rem; margin-left: auto; }
        
        .filters { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        .filter-btn { padding: 0.5rem 1rem; border-radius: 20px; font-size: 0.85rem; background: transparent; border: 1px solid var(--border); color: var(--text); }
        .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        
        .back-link { display: inline-block; margin-bottom: 1rem; color: var(--primary); text-decoration: none; font-weight: 500; }
        .donate-card { margin-top: 3rem; padding: 2rem; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .donate-title { font-size: 1.1rem; font-weight: 600; color: var(--text); margin: 0 0 0.5rem; }
        .donate-text { font-size: 0.9rem; color: var(--text); opacity: 0.8; margin: 0 0 1.5rem; }
        #paypal-container-HTT66RW4Z3GLQ { width: min(320px, 100%); min-height: 55px; margin: 0 auto; }
        .zora-link { display: inline-block; margin-top: 1rem; padding: 0.75rem 1.5rem; background: linear-gradient(45deg, #6d28d9, #ec4899); color: white; text-decoration: none; border-radius: 8px; font-weight: 600; transition: transform 0.2s; }
        .zora-link:hover { transform: scale(1.05); }
        
        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
        button { transition: all 0.2s ease; }
        button:hover { transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="container">
        <a href="/software" class="back-link">← Back to Software Hub</a>
        <header>
            <div><h1>Task Manager</h1><p style="opacity: 0.7; margin-top: 0.5rem;">Organize your to-do list.</p></div>
            <span class="badge">✨ Digital Infohub Tool</span>
        </header>

        <div class="tool-card">
            <div class="input-row">
                <input type="text" id="taskInput" placeholder="Add a new task..." onkeypress="if(event.key==='Enter')addTask()">
                <button class="btn-primary" onclick="addTask()">Add Task</button>
            </div>
            
            <div class="filters">
                <button class="filter-btn active" onclick="setFilter('all')">All</button>
                <button class="filter-btn" onclick="setFilter('active')">Active</button>
                <button class="filter-btn" onclick="setFilter('completed')">Completed</button>
            </div>
            
            <ul class="task-list" id="taskList"></ul>
        </div>

        <div style="margin: 2rem 0; text-align: center;">
            <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-5443646750699471" data-ad-slot="1234567890" data-ad-format="auto" data-full-width-responsive="true"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>

        <div class="donate-card">
            <p class="donate-title">💜 Love this tool?</p>
            <p class="donate-text">Your support keeps these tools free and ad-free for everyone.</p>
            <div id="paypal-container-HTT66RW4Z3GLQ"></div><br>
            <a href="https://zora.co/coin/base:0xd51d99de87ad3433e35f43132eddb3f68f4458e4" target="_blank" class="zora-link">Support with Crypto (Zora)</a>
        </div>
    </div>

    <script>
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        let filter = 'all';

        function render() {
            const list = document.getElementById('taskList');
            list.innerHTML = '';
            
            const filtered = tasks.filter(t => {
                if (filter === 'active') return !t.completed;
                if (filter === 'completed') return t.completed;
                return true;
            });
            
            filtered.forEach((t, i) => {
                const li = document.createElement('li');
                li.className = `task-item ${t.completed ? 'completed' : ''}`;
                li.innerHTML = `
                    <input type="checkbox" class="task-checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTask(${tasks.indexOf(t)})">
                    <span>${t.text}</span>
                    <button class="delete-btn" onclick="deleteTask(${tasks.indexOf(t)})">Delete</button>
                `;
                list.appendChild(li);
            });
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            const text = input.value.trim();
            if (!text) return;
            tasks.push({ text, completed: false });
            localStorage.setItem('tasks', JSON.stringify(tasks));
            input.value = '';
            render();
        }

        function toggleTask(i) {
            tasks[i].completed = !tasks[i].completed;
            localStorage.setItem('tasks', JSON.stringify(tasks));
            render();
        }

        function deleteTask(i) {
            tasks.splice(i, 1);
            localStorage.setItem('tasks', JSON.stringify(tasks));
            render();
        }

        function setFilter(f) {
            filter = f;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            render();
        }

        render();

        if (window.paypal && paypal.HostedButtons) {
            paypal.HostedButtons({ hostedButtonId: "HTT66RW4Z3GLQ" }).render("#paypal-container-HTT66RW4Z3GLQ");
        }
    </script>
</body>
</html>
