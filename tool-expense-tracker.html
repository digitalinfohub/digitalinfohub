/* Expense Tracker Styles */

<body>
<div class="container">
    <a href="/software" class="back-link">← Back to Software Hub</a>
    <header>
        <div>
            <h1>Expense Tracker</h1>
            <p style="opacity: 0.7; margin-top: 0.5rem;">Track your income and expenses easily.</p>
        </div>
        <span class="badge">Digital Infohub Tool</span>
    </header>

    <div class="tool-card">
        <div class="summary-grid">
            <div class="summary-card">
                <div class="summary-label">Income</div>
                <div class="summary-value income" id="totalIncome">$0.00</div>
            </div>
            <div class="summary-card">
                <div class="summary-label">Expenses</div>
                <div class="summary-value expense" id="totalExpense">$0.00</div>
            </div>
            <div class="summary-card">
                <div class="summary-label">Balance</div>
                <div class="summary-value balance" id="totalBalance">$0.00</div>
            </div>
        </div>

        <div class="form-group">
            <input type="text" id="descInput" class="form-input" placeholder="Description">
            <input type="number" id="amountInput" class="form-input" placeholder="Amount" step="0.01">
            <select id="typeSelect" class="form-select">
                <option value="income">Income</option>
                <option value="expense">Expense</option>
            </select>
            <button class="add-btn" onclick="addTransaction()">Add</button>
        </div>

        <ul class="transaction-list" id="transactionList"></ul>
    </div>

    <!-- PayPal Button - Part 2 (FIXED) -->
    <div class="donate-card">
        <p class="donate-title">💜 Love this tool?</p>
        <p class="donate-text">Your support keeps these tools free and ad-free for everyone.</p>
        <div id="paypal-container-HTT66RW4Z3GLQ"></div>
        <a href="https://zora.co/coin/base:0xd51d99de87ad3433e35f43132eddb3f68f4458e4" target="_blank" class="zora-link">
            🪙 Support with Digital Infohub Token on Zora
        </a>
    </div>
</div>

<script>
let transactions = JSON.parse(localStorage.getItem('transactions')) || [];

function updateSummary() {
    const income = transactions.filter(t => t.type === 'income').reduce((sum, t) => sum + t.amount, 0);
    const expense = transactions.filter(t => t.type === 'expense').reduce((sum, t) => sum + t.amount, 0);
    const balance = income - expense;

    document.getElementById('totalIncome').textContent = `$${income.toFixed(2)}`;
    document.getElementById('totalExpense').textContent = `$${expense.toFixed(2)}`;
    document.getElementById('totalBalance').textContent = `$${balance.toFixed(2)}`;
}

function renderTransactions() {
    const list = document.getElementById('transactionList');
    list.innerHTML = '';
    
    transactions.forEach((t, index) => {
        const li = document.createElement('li');
        li.className = 'transaction-item';
        li.innerHTML = `
            <div class="transaction-info">
                <div class="transaction-name">${t.description}</div>
                <div class="transaction-date">${t.date}</div>
            </div>
            <span class="transaction-amount ${t.type}">${t.type === 'income' ? '+' : '-'}$${t.amount.toFixed(2)}</span>
            <button class="delete-btn" onclick="deleteTransaction(${index})">Delete</button>
        `;
        list.appendChild(li);
    });
    
    updateSummary();
    localStorage.setItem('transactions', JSON.stringify(transactions));
}

function addTransaction() {
    const desc = document.getElementById('descInput').value.trim();
    const amount = parseFloat(document.getElementById('amountInput').value);
    const type = document.getElementById('typeSelect').value;

    if (!desc || isNaN(amount) || amount <= 0) {
        alert('Please enter a valid description and amount');
        return;
    }

    transactions.push({
        description: desc,
        amount: amount,
        type: type,
        date: new Date().toLocaleDateString()
    });

    document.getElementById('descInput').value = '';
    document.getElementById('amountInput').value = '';
    renderTransactions();
}

function deleteTransaction(index) {
    transactions.splice(index, 1);
    renderTransactions();
}

// Initialize
renderTransactions();
</script>
