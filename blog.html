<style>
:root {
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
  --radius: 16px;
  --radius-sm: 10px;
}

[data-theme="dark"] {
  --bg: #050505;
  --surface: #0f0f11;
  --surface-2: #18181b;
  --surface-3: #27272a;
  --border: rgba(255,255,255,0.08);
  --border-strong: rgba(255,255,255,0.15);
  --text: #fafafa;
  --text-sub: #a1a1aa;
  --text-muted: #71717a;
  --accent: #818cf8;
  --accent-glow: rgba(129, 140, 248, 0.15);
  --shadow: 0 8px 32px -8px rgba(0,0,0,0.5);
}

[data-theme="light"] {
  --bg: #ffffff;
  --surface: #f8fafc;
  --surface-2: #f1f5f9;
  --surface-3: #e2e8f0;
  --border: rgba(0,0,0,0.06);
  --border-strong: rgba(0,0,0,0.12);
  --text: #0f172a;
  --text-sub: #475569;
  --text-muted: #94a3b8;
  --accent: #4f46e5;
  --accent-glow: rgba(79, 70, 229, 0.1);
  --shadow: 0 8px 32px -8px rgba(0,0,0,0.08);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  transition: background 0.3s ease, color 0.3s ease;
}

/* Custom Scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

.shell { max-width: 1100px; margin: 0 auto; padding: 32px 32px 80px; }

/* ═══ TOP BAR ═══ */
.topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 48px; }
.brand {
  display: flex; align-items: center; gap: 12px;
  font-weight: 700; font-size: 16px; letter-spacing: -0.02em;
  text-decoration: none; color: var(--text);
}
.brand-logo {
  width: 32px; height: 32px;
  border-radius: 8px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  overflow: hidden;
  flex-shrink: 0;
}
.brand-logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.topbar-actions { display: flex; gap: 8px; align-items: center; }
.icon-btn {
  width: 40px; height: 40px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-sub);
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s var(--ease);
}
.icon-btn:hover { color: var(--text); border-color: var(--border-strong); background: var(--surface-2); transform: translateY(-1px); }

/* ═══ NAVIGATION ═══ */
.nav-shell {
  position: sticky; top: 0; z-index: 100;
  background: rgba(5, 5, 5, 0.8); /* Fallback */
  background: color-mix(in srgb, var(--bg) 80%, transparent);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  margin: -32px -32px 40px;
  padding: 0 32px;
}
[data-theme="light"] .nav-shell { background: rgba(255, 255, 255, 0.8); }

.nav-bar {
  max-width: 1100px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 0; gap: 24px;
}

.nav-links { display: flex; gap: 6px; align-items: center; flex: 1; }
.nav-link {
  padding: 8px 16px;
  background: none; border: 1px solid transparent;
  color: var(--text-sub); border-radius: 8px;
  cursor: pointer; font-size: 14px; font-weight: 500;
  transition: all 0.2s var(--ease);
  text-decoration: none;
}
.nav-link:hover { color: var(--text); background: var(--surface-2); }
.nav-link.active { color: var(--accent); background: var(--accent-glow); border-color: rgba(99,102,241,0.2); }

/* Hamburger */
.hamburger {
  display: none; flex-direction: column; gap: 5px;
  width: 40px; height: 40px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; cursor: pointer; padding: 10px;
  justify-content: center; align-items: center;
}
.hamburger-line { width: 18px; height: 2px; background: var(--text); border-radius: 2px; transition: all 0.3s var(--ease); }
.hamburger.active .hamburger-line:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.hamburger.active .hamburger-line:nth-child(2) { opacity: 0; }
.hamburger.active .hamburger-line:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

/* Mobile Drawer */
.nav-drawer {
  position: fixed; top: 0; right: 0; width: 100%; max-width: 300px; height: 100vh;
  background: var(--surface); border-left: 1px solid var(--border); z-index: 200;
  transform: translateX(100%); transition: transform 0.3s var(--ease);
  box-shadow: -10px 0 40px rgba(0,0,0,0.3);
}
.nav-drawer.active { transform: translateX(0); }
.nav-drawer-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 199;
  opacity: 0; pointer-events: none; transition: opacity 0.3s var(--ease);
  backdrop-filter: blur(2px);
}
.nav-drawer-overlay.active { opacity: 1; pointer-events: all; }
.nav-drawer-head { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.nav-drawer-title { font-size: 15px; font-weight: 700; color: var(--text); }
.nav-drawer-links { padding: 16px; display: flex; flex-direction: column; gap: 4px; }
.nav-drawer-link {
  padding: 14px 16px; color: var(--text-sub); border-radius: 8px;
  font-size: 15px; font-weight: 500; text-decoration: none;
  display: flex; align-items: center; gap: 12px; transition: all 0.2s;
}
.nav-drawer-link:hover { background: var(--surface-2); color: var(--text); }
.nav-drawer-link.active { color: var(--accent); background: var(--accent-glow); }

/* ═══ BLOG HEADER ═══ */
.blog-header { text-align: center; margin-bottom: 64px; animation: fadeInDown 0.6s var(--ease); }
.blog-header h1 {
  font-size: clamp(36px, 6vw, 56px); font-weight: 800;
  letter-spacing: -0.04em; line-height: 1.1; margin-bottom: 16px;
  background: linear-gradient(180deg, var(--text) 0%, var(--text-sub) 120%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.blog-header p { color: var(--text-sub); font-size: 18px; max-width: 500px; margin: 0 auto; line-height: 1.6; }

@keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

/* ═══ FEATURED POST CARD (IMPROVED) ═══ */
.blog-carousel { position: relative; max-width: 1000px; margin: 0 auto; }
.blog-post-wrapper { min-height: 400px; position: relative; perspective: 1000px; }

.blog-post {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  opacity: 0; transform: translateY(20px) scale(0.98);
  transition: opacity 0.4s var(--ease), transform 0.4s var(--ease);
  
  /* DESKTOP GRID LAYOUT */
  display: grid;
  grid-template-columns: 1.2fr 1fr; /* Image slightly wider */
  min-height: 420px;
}

.blog-post.active { opacity: 1; transform: translateY(0) scale(1); }

.blog-post-link { display: contents; text-decoration: none; color: inherit; }

.blog-post-image {
  width: 100%; height: 100%; min-height: 300px;
  overflow: hidden; background: var(--surface-3); position: relative;
}
.blog-post-image img {
  width: 100%; height: 100%; object-fit: cover; display: block;
  transition: transform 0.7s var(--ease);
}
.blog-post-link:hover .blog-post-image img { transform: scale(1.05); }

.blog-post-content {
  padding: 48px; display: flex; flex-direction: column; justify-content: center;
}

.blog-post-meta {
  display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
  font-size: 12px; color: var(--text-muted); font-family: var(--mono);
  text-transform: uppercase; letter-spacing: 0.05em;
}
.blog-post-tag {
  padding: 6px 12px; background: var(--accent-glow); color: var(--accent);
  border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: 0.02em;
}

.blog-post-title {
  font-size: 32px; font-weight: 700; letter-spacing: -0.03em;
  line-height: 1.2; margin-bottom: 20px; transition: color 0.2s var(--ease);
}
.blog-post-link:hover .blog-post-title { color: var(--accent); }

.blog-post-excerpt {
  color: var(--text-sub); font-size: 16px; line-height: 1.7;
  margin-bottom: 32px;
  display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
}

.blog-post-read-more {
  display: inline-flex; align-items: center; gap: 8px;
  color: var(--accent); font-weight: 600; font-size: 14px;
  margin-top: auto; transition: gap 0.3s var(--ease);
}
.blog-post-link:hover .blog-post-read-more { gap: 14px; }
.blog-post-read-more::after { content: '→'; font-size: 16px; transition: transform 0.3s var(--ease); }
.blog-post-link:hover .blog-post-read-more::after { transform: translateX(4px); }

/* ═══ CONTROLS ═══ */
.blog-nav { display: flex; justify-content: center; gap: 16px; margin-top: 40px; }
.nav-btn {
  padding: 12px 24px; background: var(--surface); border: 1px solid var(--border);
  color: var(--text); border-radius: var(--radius-sm); cursor: pointer;
  font-size: 14px; font-weight: 600; transition: all 0.2s var(--ease);
  display: flex; align-items: center; gap: 8px;
}
.nav-btn:hover:not(:disabled) { background: var(--surface-2); border-color: var(--border-strong); transform: translateY(-2px); }
.nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.nav-btn svg { width: 16px; height: 16px; }

.post-indicators { display: flex; justify-content: center; gap: 8px; margin-top: 24px; }
.indicator {
  width: 8px; height: 8px; border-radius: 50%; background: var(--border-strong);
  cursor: pointer; transition: all 0.3s var(--ease); border: none; padding: 0;
}
.indicator.active { background: var(--accent); width: 24px; border-radius: 4px; }

.post-counter { text-align: center; margin-top: 12px; font-size: 12px; color: var(--text-muted); font-family: var(--mono); }

/* ═══ FOOTER ═══ */
.blog-footer { text-align: center; margin-top: 80px; padding-top: 40px; border-top: 1px solid var(--border); }
.blog-footer p { color: var(--text-sub); font-size: 14px; }
.blog-footer a { color: var(--accent); text-decoration: none; font-weight: 600; }
.blog-footer a:hover { text-decoration: underline; }

/* ═══ RESPONSIVE (MOBILE OPTIMIZED) ═══ */
@media (max-width: 850px) {
  .shell { padding: 20px 16px 60px; }
  .nav-shell { margin: -20px -16px 32px; padding: 0 16px; }
  .nav-links { display: none; }
  .hamburger { display: flex; }
  
  .blog-header { margin-bottom: 40px; }
  .blog-header h1 { font-size: 32px; }
  .blog-header p { font-size: 16px; }
  
  /* Stack layout for mobile */
  .blog-post { grid-template-columns: 1fr; min-height: auto; }
  .blog-post-image { aspect-ratio: 16/9; min-height: auto; }
  .blog-post-content { padding: 24px 20px 28px; }
  
  .blog-post-title { font-size: 24px; margin-bottom: 12px; line-height: 1.3; }
  .blog-post-excerpt { font-size: 15px; margin-bottom: 24px; -webkit-line-clamp: 3; }
  
  .blog-nav { gap: 12px; margin-top: 32px; }
  .nav-btn { flex: 1; justify-content: center; padding: 14px; } /* Full width buttons for easy tap */
  
  .indicator { width: 6px; height: 6px; }
  .indicator.active { width: 20px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

  const postCounter = document.getElementById('postCounter');

  // Theme Logic
  const sunSvg = '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>';
  const moonSvg = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
  let theme = 'dark';
  try { theme = localStorage.getItem('dih_theme') || 'dark'; } catch(e) {}
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('themeIcon').innerHTML = theme === 'dark' ? sunSvg : moonSvg;

  document.getElementById('themeToggle').addEventListener('click', () => {
    theme = theme === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', theme);
    try { localStorage.setItem('dih_theme', theme); } catch(e) {}
    document.getElementById('themeIcon').innerHTML = theme === 'dark' ? sunSvg : moonSvg;
  });

  // Navigation Drawer Logic
  const hamburger = document.getElementById('hamburger');
  const navDrawer = document.getElementById('navDrawer');
  const navDrawerOverlay = document.getElementById('navDrawerOverlay');
  const drawerClose = document.getElementById('drawerClose');

  function toggleDrawer(show) {
    const isOpen = show !== undefined ? show : !navDrawer.classList.contains('active');
    navDrawer.classList.toggle('active', isOpen);
    navDrawerOverlay.classList.toggle('active', isOpen);
    hamburger.classList.toggle('active', isOpen);
    hamburger.setAttribute('aria-expanded', isOpen);
    document.body.style.overflow = isOpen ? 'hidden' : '';
  }

  hamburger.addEventListener('click', () => toggleDrawer());
  drawerClose.addEventListener('click', () => toggleDrawer(false));
  navDrawerOverlay.addEventListener('click', () => toggleDrawer(false));
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && navDrawer.classList.contains('active')) toggleDrawer(false); });

  // Carousel Logic
  function createIndicators() {
    indicatorsContainer.innerHTML = '';
    BLOG_POSTS.forEach((_, index) => {
      const indicator = document.createElement('button');
      indicator.className = 'indicator' + (index === currentPostIndex ? ' active' : '');
      indicator.setAttribute('role', 'tab');
      indicator.setAttribute('aria-selected', index === currentPostIndex);
      indicator.setAttribute('aria-label', `Go to post ${index + 1}`);
      indicator.addEventListener('click', () => showPost(index));
      indicatorsContainer.appendChild(indicator);
    });
  }

  function updateUI() {
    // Indicators
    const indicators = indicatorsContainer.querySelectorAll('.indicator');
    indicators.forEach((ind, idx) => {
      ind.classList.toggle('active', idx === currentPostIndex);
      ind.setAttribute('aria-selected', idx === currentPostIndex);
    });
    // Counter
    postCounter.textContent = `${currentPostIndex + 1} / ${BLOG_POSTS.length}`;
    // Buttons
    prevBtn.disabled = currentPostIndex === 0;
    nextBtn.disabled = currentPostIndex === BLOG_POSTS.length - 1;
  }

  function showPost(index) {
    if (index < 0 || index >= BLOG_POSTS.length) return;
    
    // Fade out existing
    const existing = postsContainer.querySelector('.blog-post');
    if (existing) existing.classList.remove('active');

    setTimeout(() => {
      const post = BLOG_POSTS[index];
      postsContainer.innerHTML = `
        <article class="blog-post">
          <a href="${post.link}" target="_blank" rel="noopener noreferrer" class="blog-post-link" aria-label="Read: ${post.title}">
            <div class="blog-post-image">
              <img src="${post.image}" alt="${post.title}" loading="lazy" onerror="this.parentElement.style.background='var(--surface-3)'">
            </div>
            <div class="blog-post-content">
              <div class="blog-post-meta">
                <span class="blog-post-tag">${post.tag}</span>
                <span>${post.date}</span>
              </div>
              <h2 class="blog-post-title">${post.title}</h2>
              <p class="blog-post-excerpt">${post.excerpt}</p>
              <span class="blog-post-read-more">Read Article</span>
            </div>
          </a>
        </article>
      `;
      
      // Trigger reflow for animation
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          postsContainer.querySelector('.blog-post').classList.add('active');
        });
      });

      currentPostIndex = index;
      updateUI();
    }, existing ? 300 : 0);
  }

  prevBtn.addEventListener('click', () => showPost(currentPostIndex - 1));
  nextBtn.addEventListener('click', () => showPost(currentPostIndex + 1));

  // Keyboard Nav
  document.addEventListener('keydown', (e) => {
    if (navDrawer.classList.contains('active')) return;
    if (e.key === 'ArrowLeft') showPost(currentPostIndex - 1);
    if (e.key === 'ArrowRight') showPost(currentPostIndex + 1);
  });

  // Touch Swipe
  let touchStartX = 0;
  postsContainer.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX, {passive:true});
  postsContainer.addEventListener('touchend', e => {
    const diff = touchStartX - e.changedTouches[0].screenX;
    if (Math.abs(diff) > 50) {
      diff > 0 ? showPost(currentPostIndex + 1) : showPost(currentPostIndex - 1);
    }
  }, {passive:true});

  // Init
  createIndicators();
  showPost(0);
})();
</script>
</body>
</html>
