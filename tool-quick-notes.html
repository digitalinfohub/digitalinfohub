<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Notes | Digital Infohub</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --card-bg: #ffffff; --text: #1e293b; --border: #e2e8f0; }
        [data-theme="dark"] { --bg: #0f172a; --card-bg: #1e293b; --text: #f1f5f9; --border: #334155; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }
        .container { max-width: 900px; margin: 0 auto; padding: 2rem; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        h1 { margin: 0; font-size: 1.8rem; }
        .badge { background: var(--primary); color: white; padding: 0.25rem 0.75rem; border-radius: 99px; font-size: 0.8rem; font-weight: bold; }
        .tool-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 2rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        
        .notes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; margin-top: 1.5rem; }
        .note-card { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; cursor: pointer; transition: all 0.2s; position: relative; min-height: 150px; }
        .note-card:hover { border-color: var(--primary); transform: translateY(-2px); }
        .note-title { font-weight: 600; margin-bottom: 0.5rem; font-size: 0.95rem; }
        .note-preview { font-size: 0.85rem; opacity: 0.7; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; }
        .note-date { font-size: 0.7rem; opacity: 0.5; margin-top: 0.75rem; }
        .note-delete { position: absolute; top: 0.5rem; right: 0.5rem; background: transparent; border: none; color: #ef4444; cursor: pointer; font-size: 1rem; opacity: 0; transition: opacity 0.2s; }
        .note-card:hover .note-delete { opacity: 1; }
        
        .editor-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .editor-modal.active { display: flex; }
        .editor-content { background: var(--card-bg); border-radius: 12px; width: 100%; max-width: 600px; max-height: 80vh; display: flex; flex-direction: column; }
        .editor-header { padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .editor-header input { font-size: 1.1rem; font-weight: 600; background: transparent; border: none; color: var(--text); flex: 1; outline: none; }
        .editor-header button { background: transparent; border: none; color: var(--text); cursor: pointer; font-size: 1.5rem; padding: 0.25rem; }
        .editor-body { padding: 1.5rem; flex: 1; overflow-y: auto; }
        .editor-body textarea { width: 100%; min-height: 300px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; color: var(--text); font-family: inherit; font-size: 0.95rem; resize: vertical; outline: none; box-sizing: border-box; }
        .editor-footer { padding: 1rem 1.5rem; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .save-status { font-size: 0.8rem; opacity: 0.6; }
        .btn { padding: 0.5rem 1rem; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
        
        .new-note-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 150px; border: 2px dashed var(--border); border-radius: 8px; cursor: pointer; transition: all 0.2s; }
        .new-note-btn:hover { border-color: var(--primary); background: var(--primary); color: white; }
        .new-note-btn span { font-size: 2rem; }
        
        .back-link { display: inline-block; margin-bottom: 1rem; color: var(--primary); text-decoration: none; font-weight: 500; }
    </style>
</head>
<body>
    <div class="container">
        <a href="software.html" class="back-link">← Back to Software Hub</a>
        <header>
            <div>
                <h1>Quick Notes</h1>
                <p style="opacity: 0.7; margin-top: 0.5rem;">Auto-saving notes that sync to your browser.</p>
            </div>
            <span class="badge">✨ Tool</span>
        </header>

        <div class="tool-card">
            <div class="notes-grid" id="notesGrid"></div>
        </div>
    </div>

    <div class="editor-modal" id="editorModal">
        <div class="editor-content">
            <div class="editor-header">
                <input type="text" id="noteTitle" placeholder="Note title...">
                <button onclick="closeEditor()">×</button>
            </div>
            <div class="editor-body">
                <textarea id="noteContent" placeholder="Start writing..."></textarea>
            </div>
            <div class="editor-footer">
                <span class="save-status" id="saveStatus"></span>
                <div style="display: flex; gap: 0.5rem;">
                    <button class="btn btn-secondary" onclick="deleteCurrentNote()">Delete</button>
                    <button class="btn btn-primary" onclick="closeEditor()">Done</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let notes = JSON.parse(localStorage.getItem('quickNotes')) || [];
        let currentNoteId = null;

        function saveNotes() {
            localStorage.setItem('quickNotes', JSON.stringify(notes));
        }

        function createNote() {
            const note = {
                id: Date.now(),
                title: 'Untitled Note',
                content: '',
                updatedAt: new Date().toISOString()
            };
            notes.unshift(note);
            saveNotes();
            renderNotes();
            openEditor(note.id);
        }

        function openEditor(id) {
            const note = notes.find(n => n.id === id);
            if (!note) return;
            
            currentNoteId = id;
            document.getElementById('noteTitle').value = note.title;
            document.getElementById('noteContent').value = note.content;
            document.getElementById('editorModal').classList.add('active');
            
            document.getElementById('noteTitle').oninput = autoSave;
            document.getElementById('noteContent').oninput = autoSave;
        }

        function closeEditor() {
            document.getElementById('editorModal').classList.remove('active');
            currentNoteId = null;
            renderNotes();
        }

        function autoSave() {
            const note = notes.find(n => n.id === currentNoteId);
            if (!note) return;
            
            note.title = document.getElementById('noteTitle').value || 'Untitled Note';
            note.content = document.getElementById('noteContent').value;
            note.updatedAt = new Date().toISOString();
            
            saveNotes();
            document.getElementById('saveStatus').textContent = 'Saved ' + new Date().toLocaleTimeString();
        }

        function deleteCurrentNote() {
            if (!currentNoteId) return;
            if (!confirm('Delete this note?')) return;
            
            notes = notes.filter(n => n.id !== currentNoteId);
            saveNotes();
            closeEditor();
        }

        function deleteNote(e, id) {
            e.stopPropagation();
            if (!confirm('Delete this note?')) return;
            notes = notes.filter(n => n.id !== id);
            saveNotes();
            renderNotes();
        }

        function renderNotes() {
            const grid = document.getElementById('notesGrid');
            grid.innerHTML = '';
            
            const newNoteBtn = document.createElement('div');
            newNoteBtn.className = 'new-note-btn';
            newNoteBtn.onclick = createNote;
            newNoteBtn.innerHTML = '<span>+</span><span>New Note</span>';
            grid.appendChild(newNoteBtn);
            
            notes.forEach(note => {
                const card = document.createElement('div');
                card.className = 'note-card';
                card.onclick = () => openEditor(note.id);
                card.innerHTML = `
                    <button class="note-delete" onclick="deleteNote(event, ${note.id})">×</button>
                    <div class="note-title">${escapeHtml(note.title)}</div>
                    <div class="note-preview">${escapeHtml(note.content) || 'Empty note...'}</div>
                    <div class="note-date">Edited: ${new Date(note.updatedAt).toLocaleString()}</div>
                `;
                grid.appendChild(card);
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById('editorModal').addEventListener('click', (e) => {
            if (e.target.id === 'editorModal') closeEditor();
        });

        renderNotes();
    </script>
</body>
</html>
