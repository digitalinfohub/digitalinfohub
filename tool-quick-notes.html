        .badge { background: var(--primary); color: white; padding: 0.25rem 0.75rem; border-radius: 99px; font-size: 0.8rem; font-weight: bold; }
        .tool-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 2rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        
        textarea { width: 100%; height: 300px; padding: 1rem; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-size: 1rem; resize: vertical; box-sizing: border-box; font-family: inherit; }

        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
        button:hover { transform: translateY(-2px); opacity: 0.9; }
        
        .back-link { display: inline-block; margin-bottom: 1rem; color: var(--primary); text-decoration: none; font-weight: 500; }
        .donate-card { margin-top: 3rem; padding: 2rem; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .donate-title { font-size: 1.1rem; font-weight: 600; color: var(--text); margin: 0 0 0.5rem; }
        .donate-text { font-size: 0.9rem; color: var(--text); opacity: 0.8; margin: 0 0 1.5rem; }
        #paypal-container-HTT66RW4Z3GLQ { width: min(320px, 100%); min-height: 55px; margin: 0 auto; }
        .zora-link { display: inline-block; margin-top: 1rem; padding: 0.75rem 1.5rem; background: linear-gradient(45deg, #6d28d9, #ec4899); color: white; text-decoration: none; border-radius: 8px; font-weight: 600; transition: transform 0.2s; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        textarea { animation: fadeIn 0.3s ease-out; }

<body>
    <div class="container">
        <a href="/software" class="back-link">← Back to Software Hub</a>
        <header>
            <div><h1>Quick Notes</h1><p style="opacity: 0.7; margin-top: 0.5rem;">Auto-saving notes app.</p></div>
            <span class="badge">✨ Digital Infohub Tool</span>
        </header>

        <div class="tool-card">
            <textarea id="note" placeholder="Start typing your notes here..."></textarea>
            <div class="status" id="status"></div>
            <div style="margin-top: 1rem;">
                <button class="btn-secondary" onclick="copyNote()">Copy Note</button>
                <button class="btn-secondary" onclick="clearNote()" style="border-color:#ef4444;color:#ef4444;">Clear</button>
            </div>
        </div>

        <div style="margin: 2rem 0; text-align: center;">
            <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-5443646750699471" data-ad-slot="1234567890" data-ad-format="auto" data-full-width-responsive="true"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>

        <div class="donate-card">
            <p class="donate-title">💜 Love this tool?</p>
            <p class="donate-text">Your support keeps these tools free and ad-free for everyone.</p>
            <div id="paypal-container-HTT66RW4Z3GLQ"></div><br>
            <a href="https://zora.co/coin/base:0xd51d99de87ad3433e35f43132eddb3f68f4458e4" target="_blank" class="zora-link">Support with Crypto (Zora)</a>
        </div>
    </div>

    <script>
        const noteEl = document.getElementById('note');
        const statusEl = document.getElementById('status');
        
        // Load saved note
        noteEl.value = localStorage.getItem('quickNote') || '';
        
        let timeout;
        noteEl.addEventListener('input', () => {
            statusEl.textContent = 'Saving...';
            clearTimeout(timeout);
            timeout = setTimeout(() => {
                localStorage.setItem('quickNote', noteEl.value);
                statusEl.textContent = 'Saved at ' + new Date().toLocaleTimeString();
            }, 500);
        });

        function copyNote() {
            navigator.clipboard.writeText(noteEl.value).then(() => {
                statusEl.textContent = 'Copied to clipboard!';
                setTimeout(() => statusEl.textContent = '', 2000);
            });
        }

        function clearNote() {
            if (confirm('Clear all notes?')) {
                noteEl.value = '';
                localStorage.removeItem('quickNote');
                statusEl.textContent = 'Cleared';
            }
        }

        if (window.paypal && paypal.HostedButtons) {
            paypal.HostedButtons({ hostedButtonId: "HTT66RW4Z3GLQ" }).render("#paypal-container-HTT66RW4Z3GLQ");
        }
    </script>
</body>
