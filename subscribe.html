<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Subscribe to Digital Infohub for updates on technology, AI, software, games, news and digital tools.">
    <meta name="theme-color" content="#ffffff">
    <title>Subscribe | Digital Infohub</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f5f7fa;
            color: #111827;
            display: flex;
            flex-direction: column;
        }

        header {
            width: 100%;
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
        }

        .nav {
            max-width: 1100px;
            margin: 0 auto;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            text-decoration: none;
            color: #111827;
            font-size: 21px;
            font-weight: 750;
            letter-spacing: -0.5px;
        }

        .back-link {
            color: #4b5563;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .back-link:hover {
            color: #111827;
        }

        main {
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 70px 20px 80px;
        }

        .subscribe-container {
            width: 100%;
            max-width: 760px;
            text-align: center;
        }

        .icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 22px;
            border-radius: 16px;
            background: #111827;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 27px;
            box-shadow: 0 8px 25px rgba(17, 24, 39, 0.12);
        }

        h1 {
            margin: 0;
            font-size: clamp(34px, 6vw, 52px);
            line-height: 1.05;
            letter-spacing: -1.8px;
        }

        .intro {
            max-width: 590px;
            margin: 18px auto 34px;
            color: #6b7280;
            font-size: 17px;
            line-height: 1.65;
        }

        .form-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 15px 45px rgba(17, 24, 39, 0.07);
            overflow: hidden;
        }

        .form-wrapper {
            width: 100%;
            max-width: 540px;
            margin: 0 auto;
        }

        iframe {
            display: block;
            width: 540px;
            max-width: 100%;
            height: 305px;
            border: 0;
            margin: 0 auto;
            background: transparent;
        }

        .privacy {
            margin: 22px auto 0;
            max-width: 560px;
            color: #9ca3af;
            font-size: 12px;
            line-height: 1.6;
        }

        footer {
            text-align: center;
            padding: 25px 20px;
            color: #9ca3af;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .nav {
                padding: 16px 18px;
            }

            main {
                padding: 45px 14px 55px;
            }

            .form-card {
                padding: 16px 10px;
                border-radius: 16px;
            }

            .intro {
                font-size: 15px;
                margin-bottom: 26px;
            }

            iframe {
                height: 340px;
            }
        }
    </style>
</head>

<body>

    <header>
        <nav class="nav">
            <a class="brand" href="https://digitalinfohub.net/">Digital Infohub</a>
            <a class="back-link" href="https://digitalinfohub.net/">Back to site</a>
        </nav>
    </header>

    <main>
        <section class="subscribe-container" aria-labelledby="subscribe-title">

            <div class="icon" aria-hidden="true">✉</div>

            <h1 id="subscribe-title">Stay in the loop.</h1>

            <p class="intro">
                Subscribe to Digital Infohub for updates on technology, AI, software,
                games, news, digital tools and new content.
            </p>

            <div class="form-card">
                <div class="form-wrapper">
                    <iframe
                        src="https://599209a6.sibforms.com/v2/serve/MUIFAEV3TdAb6kjEYaXC15qRHJJ4gSDCq48LNTtPpvosMa0AHiZCENHjtFk6LYcYZ9uUeL3jc5bu1ifdKxUmueCJU13jMiFgRlqo_KvfM7ZLKcownqRW2D47Y6msEjlbEF_ACQbjjXYZIR7tdUKp_hMPrxOdkK7-yccsJnFZyHZwVSLaXrCIaG5ymrYP-tjKyt1zGbCmIw4jUo4O0A=="
                        frameborder="0"
                        scrolling="auto"
                        allowfullscreen>
                    </iframe>
                </div>
            </div>

            <p class="privacy">
                By subscribing, you agree to receive Digital Infohub updates by email.
                You can unsubscribe at any time.
            </p>

        </section>
    </main>

    <footer>
        © 2026 Digital Infohub
    </footer>

</body>
</html>
