<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5443646750699471"
     crossorigin="anonymous"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE_TAG}}</title>
<meta name="description" content="{{META_DESC}}">
<meta property="og:title" content="{{TITLE_TAG}}">
<meta property="og:description" content="{{OG_DESC}}">
<meta property="og:type" content="article">
<meta property="og:image" content="{{OG_IMAGE}}">

<style>
:root, [data-theme="light"] {
  --bg: #fafaf9;
  --surface: #ffffff;
  --ink: #1c1917;
  --ink-muted: #78716c;
  --accent: #292524;
  --border: #e7e5e4;
  --toggle-icon: #1c1917;
}

[data-theme="dark"] {
  --bg: #0c0a09;
  --surface: #1c1917;
  --ink: #e7e5e4;
  --ink-muted: #a8a29e;
  --accent: #d6d3d1;
  --border: #292524;
  --toggle-icon: #e7e5e4;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 1.0625rem;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  transition: background 0.3s ease, color 0.3s ease;
}

.container {
  max-width: 680px;
  margin: 0 auto;
  padding: 0 1.5rem;
}

/* ---------- Controls ---------- */
.controls {
  position: fixed;
  top: 1.25rem;
  right: 1.25rem;
  z-index: 100;
  display: flex;
  gap: 0.5rem;
  align-items: center;
}

.lang-switch {
  display: flex;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface);
  overflow: hidden;
  transition: background 0.3s ease, border-color 0.3s ease;
}

.lang-switch button {
  border: none;
  background: transparent;
  color: var(--ink-muted);
  font-family: inherit;
  font-size: 0.72rem;
  letter-spacing: 0.04em;
  padding: 0.55em 0.95em;
  cursor: pointer;
  transition: background 0.2s ease, color 0.2s ease;
}

.lang-switch button:hover { color: var(--ink); }

.lang-switch button.active {
  background: var(--ink);
  color: var(--bg);
}

.theme-toggle {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--surface);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s ease;
}

.theme-toggle:hover { border-color: var(--ink-muted); }

.theme-toggle svg {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: var(--toggle-icon);
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  transition: stroke 0.3s ease;
}

.theme-toggle .icon-moon { display: block; }
.theme-toggle .icon-sun { display: none; }

[data-theme="dark"] .theme-toggle .icon-moon { display: none; }
[data-theme="dark"] .theme-toggle .icon-sun { display: block; }

/* ---------- Language content ---------- */
.lang-content { display: none; }
.lang-content.active { display: block; }

/* ---------- Header ---------- */
header {
  padding: 4rem 0 2rem;
  border-bottom: 1px solid var(--border);
  margin-bottom: 2.5rem;
  transition: border-color 0.3s ease;
}

.meta {
  font-size: 0.75rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin-bottom: 1rem;
  transition: color 0.3s ease;
}

h1 {
  font-family: "Georgia", "Times New Roman", serif;
  font-size: clamp(1.75rem, 5vw, 2.5rem);
  font-weight: 400;
  line-height: 1.2;
  letter-spacing: -0.01em;
  margin-bottom: 1rem;
  transition: color 0.3s ease;
}

.subtitle {
  font-size: 1.125rem;
  color: var(--ink-muted);
  line-height: 1.6;
  transition: color 0.3s ease;
}

/* CJK typography */
html[lang="ja"] body { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", "Inter", sans-serif; }
html[lang="ja"] h1 { font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", Georgia, serif; line-height: 1.4; }
html[lang="ja"] article p, html[lang="ja"] .subtitle { line-height: 1.95; }

html[lang="zh-Hans"] body { font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", "Inter", sans-serif; }
html[lang="zh-Hans"] h1 { font-family: "Songti SC", "Noto Serif SC", "SimSun", Georgia, serif; line-height: 1.4; }
html[lang="zh-Hans"] article p, html[lang="zh-Hans"] .subtitle { line-height: 1.95; }

/* ---------- Content ---------- */
article p {
  margin-bottom: 1.5rem;
  transition: color 0.3s ease;
}

article strong { font-weight: 600; }

figure { margin: 2.5rem 0; }

figure img {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 2px;
}

figcaption {
  font-size: 0.75rem;
  color: var(--ink-muted);
  margin-top: 0.75rem;
  letter-spacing: 0.02em;
  transition: color 0.3s ease;
}

/* ---------- Links ---------- */
a {
  color: var(--ink);
  text-decoration: underline;
  text-underline-offset: 3px;
  text-decoration-color: var(--border);
  transition: text-decoration-color 0.2s, color 0.3s ease;
}

a:hover { text-decoration-color: var(--ink); }

.link-block {
  display: block;
  padding: 1rem 1.25rem;
  border: 1px solid var(--border);
  border-radius: 4px;
  text-decoration: none;
  margin: 1.5rem 0;
  transition: border-color 0.2s, background 0.2s;
}

.link-block:hover {
  border-color: var(--ink-muted);
  background: var(--surface);
}

.link-block .label {
  font-size: 0.6875rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin-bottom: 0.25rem;
  transition: color 0.3s ease;
}

.link-block .url {
  font-size: 0.875rem;
  word-break: break-all;
  transition: color 0.3s ease;
}

/* ---------- Section headings ---------- */
h2, h3 {
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin: 3rem 0 1rem;
  padding-top: 1.5rem;
  border-top: 1px solid var(--border);
  transition: color 0.3s ease, border-color 0.3s ease;
}

/* ---------- Tags ---------- */
.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-top: 3rem;
  padding-top: 2rem;
  border-top: 1px solid var(--border);
  transition: border-color 0.3s ease;
}

.tag {
  font-size: 0.6875rem;
  letter-spacing: 0.06em;
  color: var(--ink-muted);
  text-decoration: none;
  padding: 0.375rem 0.75rem;
  border: 1px solid var(--border);
  border-radius: 2px;
  transition: all 0.2s;
}

.tag:hover {
  border-color: var(--ink);
  color: var(--ink);
}

@media (max-width: 600px) {
  header { padding: 2.5rem 0 1.5rem; }
  .controls { top: 1rem; right: 1rem; }
  .theme-toggle { width: 36px; height: 36px; }
  .theme-toggle svg { width: 16px; height: 16px; }
  .lang-switch button { padding: 0.5em 0.7em; font-size: 0.68rem; }
}
</style>
</head>
<body>

<div class="controls">
  <div class="lang-switch" role="group" aria-label="Language selection">
    <button type="button" data-lang-btn="en" class="active">EN</button>
    <button type="button" data-lang-btn="ja">日本語</button>
    <button type="button" data-lang-btn="zh">中文</button>
  </div>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
    <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
  </button>
</div>

<div class="container">

  <!-- ================= ENGLISH ================= -->
  <div class="lang-content active" data-lang="en" lang="en">
    <header>
      <p class="meta">{{META_en}}</p>
      <h1>{{TITLE_en}}</h1>
      <p class="subtitle">{{SUBTITLE_en}}</p>
    </header>

    <article>
{{BODY_en}}
      <div class="tags">
        {{TAGS}}
      </div>
    </article>
  </div>

  <!-- ================= 日本語 ================= -->
  <div class="lang-content" data-lang="ja" lang="ja">
    <header>
      <p class="meta">{{META_ja}}</p>
      <h1>{{TITLE_ja}}</h1>
      <p class="subtitle">{{SUBTITLE_ja}}</p>
    </header>

    <article>
{{BODY_ja}}
      <div class="tags">
        {{TAGS}}
      </div>
    </article>
  </div>

  <!-- ================= 中文 ================= -->
  <div class="lang-content" data-lang="zh" lang="zh-Hans">
    <header>
      <p class="meta">{{META_zh}}</p>
      <h1>{{TITLE_zh}}</h1>
      <p class="subtitle">{{SUBTITLE_zh}}</p>
    </header>

    <article>
{{BODY_zh}}
      <div class="tags">
        {{TAGS}}
      </div>
    </article>
  </div>

</div>

<script>
(function() {
  var html = document.documentElement;

  /* ---------- Theme ---------- */
  var toggle = document.getElementById('themeToggle');
  var storedTheme = localStorage.getItem('theme');

  if (storedTheme) {
    html.setAttribute('data-theme', storedTheme);
  } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
    html.setAttribute('data-theme', 'dark');
  }

  toggle.addEventListener('click', function() {
    var current = html.getAttribute('data-theme');
    var next = current === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
  });

  /* ---------- Language ---------- */
  var titles = {
    {{JS_TITLES}}
  };

  var htmlLang = { en: 'en', ja: 'ja', zh: 'zh-Hans' };

  function detectLang() {
    var nav = (navigator.language || 'en').toLowerCase();
    if (nav.indexOf('ja') === 0) return 'ja';
    if (nav.indexOf('zh') === 0) return 'zh';
    return 'en';
  }

  function setLang(lang) {
    document.querySelectorAll('.lang-content').forEach(function(block) {
      block.classList.toggle('active', block.getAttribute('data-lang') === lang);
    });
    document.querySelectorAll('[data-lang-btn]').forEach(function(btn) {
      var isActive = btn.getAttribute('data-lang-btn') === lang;
      btn.classList.toggle('active', isActive);
      btn.setAttribute('aria-pressed', isActive);
    });
    html.setAttribute('lang', htmlLang[lang]);
    document.title = titles[lang];
    localStorage.setItem('lang', lang);
  }

  document.querySelectorAll('[data-lang-btn]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      setLang(btn.getAttribute('data-lang-btn'));
    });
  });

  setLang(localStorage.getItem('lang') || detectLang());
})();
</script>

</body>
</html>
