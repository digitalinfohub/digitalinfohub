<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Editor | Digital Infohub</title>
    <!-- PayPal SDK - Part 1 -->
    <script src="https://www.paypal.com/sdk/js?client-id=BAAWPO7p_oIMxRK7-euIX6su8WnqCJLuHdvvNOwh3Fc7ycnF1ripj2YSUbBdZVy8DfoJN6E-AJeUfSESRM&components=hosted-buttons&disable-funding=venmo&currency=GBP"></script>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --card-bg: #ffffff; --text: #1e293b; --border: #e2e8f0; }
        [data-theme="dark"] { --bg: #0f172a; --card-bg: #1e293b; --text: #f1f5f9; --border: #334155; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }
        .container { max-width: 1400px; margin: 0 auto; padding: 2rem; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        h1 { margin: 0; font-size: 1.8rem; }
        .badge { background: var(--primary); color: white; padding: 0.25rem 0.75rem; border-radius: 99px; font-size: 0.8rem; font-weight: bold; }
        
        .editor-container { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; height: 70vh; }
        @media (max-width: 900px) { .editor-container { grid-template-columns: 1fr; height: auto; } textarea, #preview { height: 400px; } }
        
        textarea { width: 100%; height: 100%; padding: 1.5rem; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-family: monospace; font-size: 1rem; resize: none; box-sizing: border-box; }
        #preview { padding: 1.5rem; border: 1px solid var(--border); border-radius: 8px; background: var(--card-bg); overflow-y: auto; height: 100%; box-sizing: border-box; line-height: 1.6; }
        
        #preview h1, #preview h2, #preview h3 { margin-top: 0; }
        #preview code { background: var(--bg); padding: 0.2rem 0.4rem; border-radius: 4px; font-family: monospace; }
        #preview pre { background: var(--bg); padding: 1rem; border-radius: 8px; overflow-x: auto; }
        #preview blockquote { border-left: 4px solid var(--primary); margin: 0; padding-left: 1rem; opacity: 0.8; }
        #preview table { border-collapse: collapse; width: 100%; }
        #preview th, #preview td { border: 1px solid var(--border); padding: 0.5rem; }
        #preview img { max-width: 100%; }
        
        .toolbar { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
        .toolbar button { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
        .toolbar button:hover { background: var(--primary); color: white; border-color: var(--primary); }
        
        .back-link { display: inline-block; margin-bottom: 1rem; color: var(--primary); text-decoration: none; font-weight: 500; }
    </style>
</head>
<body>
    <div class="container">
        <a href="software.html" class="back-link">← Back to Software Hub</a>
        <header>
            <div>
                <h1>Markdown Editor</h1>
                <p style="opacity: 0.7; margin-top: 0.5rem;">Write and preview Markdown in real-time.</p>
            </div>
            <span class="badge">✨ Digital Infohub Tool</span>
        </header>

        <div class="toolbar">
            <button onclick="insert('**', '**')">Bold</button>
            <button onclick="insert('*', '*')">Italic</button>
            <button onclick="insert('# ', '')">H1</button>
            <button onclick="insert('## ', '')">H2</button>
            <button onclick="insert('- ', '')">List</button>
            <button onclick="insert('[', '](url)')">Link</button>
            <button onclick="insert('`', '`')">Code</button>
            <button onclick="insert('> ', '')">Quote</button>
            <button onclick="copyResult()">Copy HTML</button>
            <button onclick="clearEditor()">Clear</button>
        </div>

        <div class="editor-container">
            <textarea id="markdown" placeholder="# Start writing Markdown here..." oninput="render()"></textarea>
            <div id="preview"></div>
        </div>
    </div>

    <script>
        const defaultText = `# Welcome to Digital Infohub Markdown Editor

## Features
- **Real-time** preview
- *Easy* formatting
- Code \`inline\` support

### Code Block Example
\`\`\`javascript
console.log("Hello World");
\`\`\`

> "Simplicity is the ultimate sophistication."

| Feature | Status |
|---------|--------|
| Editor  | ✅     |
| Preview | ✅     |

[Visit Digital Infohub](https://digitalinfohub.com)`;

        function render() {
            const md = document.getElementById('markdown').value || defaultText;
            let html = md
                .replace(/^# (.*$)/gim, '<h1>$1</h1>')
                .replace(/^## (.*$)/gim, '<h2>$1</h2>')
                .replace(/^### (.*$)/gim, '<h3>$1</h3>')
                .replace(/\*\*(.*)\*\*/gim, '<strong>$1</strong>')
                .replace(/\*(.*)\*/gim, '<em>$1</em>')
                .replace(/`(.*?)`/gim, '<code>$1</code>')
                .replace(/^> (.*$)/gim, '<blockquote>$1</blockquote>')
                .replace(/^- (.*$)/gim, '<li>$1</li>')
                .replace(/\[(.*?)\]\((.*?)\)/gim, '<a href="$2">$1</a>')
                .replace(/\n/gim, '<br>');
            
            html = html.replace(/```([\s\S]*?)```/gim, '<pre><code>$1</code></pre>');
            html = html.replace(/<li>(.*)<br>/gim, '<li>$1</li>');
            html = `<ul>${html}</ul>`;
            
            document.getElementById('preview').innerHTML = html;
        }

        function insert(before, after) {
            const textarea = document.getElementById('markdown');
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const text = textarea.value;
            const selected = text.substring(start, end);
            textarea.value = text.substring(0, start) + before + selected + after + text.substring(end);
            textarea.focus();
            render();
        }

        function copyResult() {
            const html = document.getElementById('preview').innerHTML;
            navigator.clipboard.writeText(html).then(() => {
                alert('HTML copied to clipboard!');
            });
        }

        function clearEditor() {
            document.getElementById('markdown').value = '';
            render();
        }

        document.getElementById('markdown').value = defaultText;
    <!-- PayPal Button - Part 2 -->
    <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border); text-align: center;">
        <p style="font-size: 0.9rem; color: var(--text); margin-bottom: 1rem;">If this tool helps you, consider supporting us!</p>
        <div id="paypal-container-HTT66RW4Z3GLQ"></div>
        <script>
          paypal.HostedButtons({
            hostedButtonId: "HTT66RW4Z3GLQ",
          }).render("#paypal-container-HTT66RW4Z3GLQ")
        </script>
    </div>
        render();
    </script>
</body>
</html>
