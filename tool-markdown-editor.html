    <style>
        :root { --primary: #6366f1; --bg: #f8fafc; --card-bg: #ffffff; --text: #1e293b; --border: #e2e8f0; }
        [data-theme="dark"] { --bg: #0f172a; --card-bg: #1e293b; --text: #f1f5f9; --border: #334155; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; transition: background 0.3s; }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        h1 { margin: 0; font-size: 1.8rem; }
        .badge { background: var(--primary); color: white; padding: 0.25rem 0.75rem; border-radius: 99px; font-size: 0.8rem; font-weight: bold; }
        .tool-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 2rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        
        .editor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        @media (max-width: 768px) { .editor-grid { grid-template-columns: 1fr; } }
        textarea { width: 100%; height: 500px; padding: 1rem; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-family: monospace; font-size: 0.9rem; resize: vertical; box-sizing: border-box; }
        .preview { padding: 1rem; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); min-height: 500px; overflow: auto; }
        .preview h1, .preview h2, .preview h3 { margin-top: 0; }
        .preview code { background: var(--card-bg); padding: 0.2rem 0.4rem; border-radius: 4px; }
        .preview pre { background: var(--card-bg); padding: 1rem; border-radius: 8px; overflow-x: auto; }
        .preview blockquote { border-left: 4px solid var(--primary); margin: 0; padding-left: 1rem; opacity: 0.8; }
        
        button { padding: 0.75rem 1.5rem; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 1rem; transition: all 0.2s; margin: 0.5rem 0.5rem 0.5rem 0; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
        button:hover { transform: translateY(-2px); opacity: 0.9; }

        .donate-title { font-size: 1.1rem; font-weight: 600; color: var(--text); margin: 0 0 0.5rem; }

<body>
    <div class="container">
        <a href="/software" class="back-link">← Back to Software Hub</a>
        <header>
            <div><h1>Markdown Editor</h1><p style="opacity: 0.7; margin-top: 0.5rem;">Write and preview markdown in real-time.</p></div>
            <span class="badge">✨ Digital Infohub Tool</span>
        </header>

        <div class="tool-card">
            <div style="margin-bottom: 1rem;">
                <button class="btn-secondary" onclick="insert('**', '**')">Bold</button>
                <button class="btn-secondary" onclick="insert('*', '*')">Italic</button>
                <button class="btn-secondary" onclick="insert('`', '`')">Code</button>
                <button class="btn-secondary" onclick="insert('[', '](url)')">Link</button>
                <button class="btn-secondary" onclick="copyHTML()">Copy HTML</button>
            </div>
            <div class="editor-grid">
                <textarea id="markdown" placeholder="# Write your markdown here..." oninput="render()"></textarea>
                <div class="preview" id="preview"></div>
            </div>
        </div>

        <div style="margin: 2rem 0; text-align: center;">
            <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-5443646750699471" data-ad-slot="1234567890" data-ad-format="auto" data-full-width-responsive="true"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>

        <div class="donate-card">
            <p class="donate-title">💜 Love this tool?</p>
            <p class="donate-text">Your support keeps these tools free and ad-free for everyone.</p>
            <div id="paypal-container-HTT66RW4Z3GLQ"></div><br>
            <a href="https://zora.co/coin/base:0xd51d99de87ad3433e35f43132eddb3f68f4458e4" target="_blank" class="zora-link">Support with Crypto (Zora)</a>
        </div>
    </div>

    <script>
        function render() {
            const md = document.getElementById('markdown').value;
            let html = md
                .replace(/^### (.*$)/gim, '<h3>$1</h3>')
                .replace(/^## (.*$)/gim, '<h2>$1</h2>')
                .replace(/^# (.*$)/gim, '<h1>$1</h1>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/`(.*?)`/g, '<code>$1</code>')
                .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2">$1</a>')
                .replace(/^> (.*$)/gim, '<blockquote>$1</blockquote>')
                .replace(/^\- (.*$)/gim, '<li>$1</li>')
                .replace(/\n/g, '<br>');
            document.getElementById('preview').innerHTML = html;
        }

        function insert(before, after) {
            const el = document.getElementById('markdown');
            const start = el.selectionStart;
            const end = el.selectionEnd;
            const text = el.value;
            const selected = text.substring(start, end);
            el.value = text.substring(0, start) + before + selected + after + text.substring(end);
            el.focus();
            render();
        }

        function copyHTML() {
            navigator.clipboard.writeText(document.getElementById('preview').innerHTML).then(() => alert('HTML copied!'));
        }

        // Load saved content
        document.getElementById('markdown').value = localStorage.getItem('markdownContent') || '# Welcome to Markdown Editor\n\nStart typing...';
        render();

        // Auto-save
        document.getElementById('markdown').addEventListener('input', () => {
            localStorage.setItem('markdownContent', document.getElementById('markdown').value);
        });

        if (window.paypal && paypal.HostedButtons) {
            paypal.HostedButtons({ hostedButtonId: "HTT66RW4Z3GLQ" }).render("#paypal-container-HTT66RW4Z3GLQ");
        }
    </script>
</body>
