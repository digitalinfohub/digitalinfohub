  >

  <style>
    :root {
      --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono: "JetBrains Mono", ui-monospace, monospace;
      --ease: cubic-bezier(.22, .61, .36, 1);
      --radius: 12px;
      --radius-sm: 8px;
      --modal-z: 3000;
    }

    [data-theme="dark"] {
      --bg: #0a0a0a;
      --surface: #111111;
      --surface-2: #161616;
      --surface-3: #1e1e1e;
      --border: rgba(255,255,255,.08);
      --border-strong: rgba(255,255,255,.16);
      --text: #f5f5f5;
      --text-sub: #a1a1aa;
      --text-muted: #71717a;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --accent-soft: rgba(99,102,241,.14);
      --shadow: 0 18px 55px rgba(0,0,0,.48);
    }

    [data-theme="light"] {
      --bg: #fafafa;
      --surface: #ffffff;
      --surface-2: #f4f4f5;
      --surface-3: #e4e4e7;
      --border: rgba(0,0,0,.08);
      --border-strong: rgba(0,0,0,.16);
      --text: #0a0a0a;
      --text-sub: #52525b;
      --text-muted: #71717a;
      --accent: #4f46e5;
      --accent-hover: #6366f1;
      --accent-soft: rgba(79,70,229,.1);
      --shadow: 0 18px 55px rgba(0,0,0,.12);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      transition: background .25s ease, color .25s ease;
    }

    body.menu-open {
      overflow: hidden;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      border: 0;
    }

    a {
      color: inherit;
    }

    .shell {
      width: min(100%, 920px);
      margin: 0 auto;
      padding: 32px 24px 80px;
    }

    /* NAVIGATION */

    .nav-shell {
      position: sticky;
      top: 0;
      z-index: 1000;
      width: calc(100% + 48px);
      margin: -32px -24px 32px;
      padding: 0 24px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      isolation: isolate;
    }

    .nav-bar {
      position: relative;
      z-index: 1001;
      width: min(100%, 920px);
      min-height: 64px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .nav-links::-webkit-scrollbar {
      display: none;
    }

    .nav-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 38px;
      padding: 8px 13px;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      color: var(--text-sub);
      text-decoration: none;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: .2s ease;
    }

    .nav-link:hover {
      color: var(--text);
      background: var(--surface-2);
      border-color: var(--border);
    }

    .nav-link.active {
      color: var(--accent-hover);
      background: var(--accent-soft);
      border-color: var(--accent);
    }

    .hamburger {
      display: none;
      width: 40px;
      height: 40px;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text);
      font-size: 21px;
      line-height: 1;
      cursor: pointer;
    }

    .hamburger:hover,
    .hamburger:focus-visible {
      background: var(--surface-2);
      border-color: var(--border-strong);
      outline: none;
    }

    .mobile-menu {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      z-index: 1002;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 10px 16px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow);
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-8px);
      transition:
        opacity .2s var(--ease),
        transform .2s var(--ease),
        visibility .2s var(--ease);
    }

    .mobile-menu.active {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .mobile-menu .nav-link {
      width: 100%;
      justify-content: flex-start;
      padding: 12px 14px;
      font-size: 14px;
    }

    /* HEADER */

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 42px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
    }

    .brand-logo {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-2);
    }

    .brand-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text-sub);
      cursor: pointer;
      transition: .2s ease;
    }

    .icon-btn:hover,
    .icon-btn:focus-visible {
      color: var(--text);
      background: var(--surface-2);
      border-color: var(--border-strong);
      outline: none;
    }

    /* CONTENT */

    .section {
      margin-bottom: 50px;
    }

    .section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .eyebrow {
      margin-bottom: 4px;
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    h1,
    h2,
    h3 {
      line-height: 1.2;
    }

    h1 {
      font-size: clamp(26px, 5vw, 38px);
      letter-spacing: -.04em;
    }

    h2 {
      font-size: 19px;
      letter-spacing: -.02em;
    }

    .section-description {
      max-width: 720px;
      margin-top: 8px;
      color: var(--text-sub);
      font-size: 13px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-bottom: 18px;
    }

    .search-box,
    .category-filter {
      min-height: 44px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text);
      outline: none;
    }

    .search-box {
      width: 100%;
      padding: 10px 13px;
    }

    .category-filter {
      min-width: 150px;
      padding: 10px 12px;
    }

    .search-box:focus,
    .category-filter:focus {
      border-color: var(--accent);
    }

    .apps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
      gap: 10px;
    }

    .app-tile {
      position: relative;
      min-height: 145px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 18px 12px 14px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text);
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: .2s var(--ease);
    }

    .app-tile:hover,
    .app-tile:focus-visible {
      background: var(--surface-2);
      border-color: var(--border-strong);
      transform: translateY(-2px);
      outline: none;
    }

    .app-tile.hidden {
      display: none;
    }

    .app-icon {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      font-size: 19px;
      font-weight: 600;
    }

    .app-icon.ai {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
    }

    .app-icon.tasks {
      background: linear-gradient(135deg, #10b981, #059669);
    }

    .app-icon.tools {
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
    }

    .app-icon.health {
      background: linear-gradient(135deg, #14b8a6, #0d9488);
    }

    .app-icon.dev {
      background: linear-gradient(135deg, #f59e0b, #d97706);
    }

    .app-icon.games {
      background: linear-gradient(135deg, #ec4899, #f43f5e);
    }

    .app-icon.media {
      background: linear-gradient(135deg, #f97316, #ef4444);
    }

    .app-icon.finance {
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
    }

    .app-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
    }

    .app-sub {
      display: block;
      margin-top: 2px;
      color: var(--text-muted);
      font-size: 10px;
    }

    .app-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      padding: 2px 6px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface-3);
      color: var(--text-muted);
      font-size: 9px;
    }

    .no-results {
      display: none;
      grid-column: 1 / -1;
      padding: 32px;
      border: 1px dashed var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      text-align: center;
      font-size: 13px;
    }

    .no-results.visible {
      display: block;
    }

    /* MODAL */

    .widget-overlay {
      position: fixed;
      inset: 0;
      z-index: var(--modal-z);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(0,0,0,.68);
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s var(--ease);
    }

    .widget-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .widget-modal {
      width: min(100%, 500px);
      max-height: min(88vh, 760px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
      transform: translateY(12px) scale(.97);
      transition: transform .25s var(--ease);
    }

    .widget-overlay.active .widget-modal {
      transform: translateY(0) scale(1);
    }

    .widget-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }

    .widget-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 700;
    }

    .widget-close {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      background: transparent;
      color: var(--text-muted);
      font-size: 22px;
      cursor: pointer;
    }

    .widget-close:hover,
    .widget-close:focus-visible {
      background: var(--surface-2);
      color: var(--text);
      outline: none;
    }

    .widget-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      overscroll-behavior: contain;
    }

    /* COMMON WIDGET CONTROLS */

    .control,
    .code-area,
    .note-area,
    .widget-body input[type="text"],
    .widget-body input[type="number"],
    .widget-body input[type="date"],
    .widget-body input[type="url"],
    .widget-body select,
    .widget-body textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      color: var(--text);
      outline: none;
    }

    .control,
    .widget-body input[type="text"],
    .widget-body input[type="number"],
    .widget-body input[type="date"],
    .widget-body input[type="url"],
    .widget-body select {
      min-height: 42px;
      padding: 9px 11px;
    }

    .code-area,
    .note-area {
      min-height: 200px;
      padding: 12px;
      resize: vertical;
      line-height: 1.5;
    }

    .code-area {
      font-family: var(--mono);
      font-size: 12px;
    }

    .widget-body input:focus,
    .widget-body textarea:focus,
    .widget-body select:focus {
      border-color: var(--accent);
    }

    .tool-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .tool-btn {
      min-height: 40px;
      padding: 9px 16px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: .2s ease;
    }

    .tool-btn:hover,
    .tool-btn:focus-visible {
      background: var(--surface-3);
      border-color: var(--border-strong);
      outline: none;
    }

    .tool-btn.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: white;
    }

    .tool-btn.primary:hover {
      background: var(--accent-hover);
    }

    .tool-message {
      min-height: 20px;
      margin-top: 10px;
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 11px;
    }

    /* CALCULATOR */

    .calc-display {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      overflow: hidden;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      font-family: var(--mono);
      font-size: 25px;
      white-space: nowrap;
    }

    .calc-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .calc-btn {
      min-height: 52px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      color: var(--text);
      font-family: var(--mono);
      font-size: 16px;
      cursor: pointer;
    }

    .calc-btn:hover {
      background: var(--surface-3);
    }

    .calc-btn.accent {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    /* TIMER */

    .timer-display {
      margin: 20px 0;
      text-align: center;
      font-family: var(--mono);
      font-size: 52px;
      font-variant-numeric: tabular-nums;
    }

    .center-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* CONVERTER */

    .converter-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .converter-row > * {
      min-width: 0;
    }

    .converter-result {
      padding: 18px;
      border-radius: var(--radius-sm);
      background: var(--accent-soft);
      color: var(--accent-hover);
      font-family: var(--mono);
      font-size: 20px;
      font-weight: 600;
      text-align: center;
    }

    /* PASSWORD */

    .password-output {
      min-height: 58px;
      display: grid;
      place-items: center;
      margin-bottom: 14px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      font-family: var(--mono);
      font-size: 16px;
      text-align: center;
      word-break: break-all;
    }

    .password-options {
      display: grid;
      gap: 9px;
      margin-bottom: 14px;
    }

    .password-option {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-sub);
      font-size: 13px;
    }

    .password-option input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
    }

    /* COLOUR */

    .color-preview {
      width: 100%;
      height: 90px;
      margin: 12px 0;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }

    .color-values {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .color-value {
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      text-align: center;
      cursor: pointer;
    }

    .color-value small {
      display: block;
      margin-bottom: 3px;
      color: var(--text-muted);
      font-family: var(--font);
      font-size: 10px;
      text-transform: uppercase;
    }

    /* MARKDOWN */

    .markdown-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .markdown-preview {
      min-height: 260px;
      overflow: auto;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      font-size: 13px;
    }

    .markdown-preview h1,
    .markdown-preview h2,
    .markdown-preview h3 {
      margin: 8px 0;
    }

    .markdown-preview p {
      margin-bottom: 8px;
    }

    .markdown-preview code {
      padding: 1px 5px;
      border-radius: 4px;
      background: var(--surface-3);
      font-family: var(--mono);
      font-size: .9em;
    }

    .markdown-preview blockquote {
      margin: 8px 0;
      padding-left: 12px;
      border-left: 3px solid var(--accent);
      color: var(--text-sub);
    }

    /* CONTRAST */

    .contrast-preview {
      margin: 14px 0;
      padding: 24px;
      border-radius: var(--radius-sm);
      font-size: 18px;
      font-weight: 700;
      text-align: center;
    }

    .contrast-ratio {
      color: var(--accent-hover);
      font-size: 25px;
      font-weight: 700;
      text-align: center;
    }

    .contrast-status {
      margin-top: 6px;
      color: var(--text-muted);
      font-size: 12px;
      text-align: center;
    }

    /* MOBILE */

    @media (max-width: 680px) {
      .shell {
        padding: 20px 16px 60px;
      }

      .nav-shell {
        width: calc(100% + 32px);
        margin: -20px -16px 24px;
        padding: 0 16px;
      }

      .nav-links {
        display: none;
      }

      .hamburger {
        display: flex;
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      .category-filter {
        width: 100%;
      }

      .apps-grid {
        grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
      }

      .app-tile {
        min-height: 132px;
        padding-inline: 8px;
      }

      .markdown-split {
        grid-template-columns: 1fr;
      }

      .widget-overlay {
        align-items: flex-end;
        padding: 0;
      }

      .widget-modal {
        max-height: 92vh;
        border-radius: 16px 16px 0 0;
      }

      .widget-body {
        padding: 16px;
      }

      .converter-row {
        flex-wrap: wrap;
      }

      .converter-row .control {
        flex: 1 1 40%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,

          const matchesText =
            !query || tile.dataset.name.includes(query);

          const matchesCategory =
            category === "all" ||
            tile.dataset.category === category;

          const visible = matchesText && matchesCategory;

          tile.classList.toggle("hidden", !visible);

          if (visible) {
            visibleCount++;
          }
        });

        noResults.classList.toggle("visible", visibleCount === 0);
      }

      function renderCalculator(container) {
        container.innerHTML = `
          <div class="calc-display" id="calcDisplay">0</div>

          <div class="calc-grid">
            <button class="calc-btn" data-value="C">C</button>
            <button class="calc-btn" data-value="/">÷</button>
            <button class="calc-btn" data-value="*">×</button>
            <button class="calc-btn" data-value="BACK">⌫</button>

            <button class="calc-btn" data-value="7">7</button>
            <button class="calc-btn" data-value="8">8</button>
            <button class="calc-btn" data-value="9">9</button>
            <button class="calc-btn" data-value="-">−</button>

            <button class="calc-btn" data-value="4">4</button>
            <button class="calc-btn" data-value="5">5</button>
            <button class="calc-btn" data-value="6">6</button>
            <button class="calc-btn" data-value="+">+</button>

            <button class="calc-btn" data-value="1">1</button>
            <button class="calc-btn" data-value="2">2</button>
            <button class="calc-btn" data-value="3">3</button>
            <button class="calc-btn accent" data-value="=">=</button>

            <button class="calc-btn" data-value="0" style="grid-column:span 2">0</button>
            <button class="calc-btn" data-value=".">.</button>
          </div>
        `;

        let expression = "";
        const display = $("#calcDisplay", container);

        $$(".calc-btn", container).forEach(button => {
          button.addEventListener("click", () => {
            const value = button.dataset.value;

            if (value === "C") {
              expression = "";
            } else if (value === "BACK") {
              expression = expression.slice(0, -1);
            } else if (value === "=") {
              if (!expression) return;

              if (!/^[0-9+\-*/.()\s]+$/.test(expression)) {
                expression = "Error";
              } else {
                try {
                  expression = String(Function(
                    `"use strict"; return (${expression})`
                  )());
                } catch {
                  expression = "Error";
                }
              }
            } else {
              if (expression === "Error") expression = "";
              expression += value;
            }

            display.textContent = expression || "0";
          });
        });
      }

      function renderConverter(container) {
        container.innerHTML = `
          <div class="converter-row">
            <input class="control" id="convertValue" type="number" value="1" step="any">
          </div>

          <div class="converter-row">
            <select class="control" id="convertFrom">
              <option value="m">Metres</option>
              <option value="ft">Feet</option>
              <option value="km">Kilometres</option>
              <option value="mi">Miles</option>
              <option value="kg">Kilograms</option>
              <option value="lb">Pounds</option>
              <option value="c">Celsius</option>
              <option value="f">Fahrenheit</option>
            </select>

            <span>→</span>

            <select class="control" id="convertTo">
              <option value="ft">Feet</option>
              <option value="m">Metres</option>
              <option value="km">Kilometres</option>
              <option value="mi">Miles</option>
              <option value="kg">Kilograms</option>
              <option value="lb">Pounds</option>
              <option value="c">Celsius</option>
              <option value="f">Fahrenheit</option>
            </select>
          </div>

          <div class="converter-result" id="convertResult"></div>
        `;

        const valueInput = $("#convertValue", container);
        const fromInput = $("#convertFrom", container);
        const toInput = $("#convertTo", container);
        const result = $("#convertResult", container);

        const rates = {
          m: 1,
          ft: .3048,
          km: 1000,
          mi: 1609.344,
          kg: 1,
          lb: .45359237
        };

        function update() {
          const value = Number(valueInput.value) || 0;
          const from = fromInput.value;
          const to = toInput.value;

          let converted = value;

          if (from === "c" && to === "f") {
            converted = value * 9 / 5 + 32;
          } else if (from === "f" && to === "c") {
            converted = (value - 32) * 5 / 9;
          } else if (
            ["c", "f"].includes(from) ||
            ["c", "f"].includes(to)
          ) {
            converted = NaN;
          } else {
            converted = value * rates[from] / rates[to];
          }

          result.textContent = Number.isFinite(converted)
            ? `${Number(converted.toFixed(4))} ${to}`
            : "Choose compatible units";
        }

        [valueInput, fromInput, toInput].forEach(element => {
          element.addEventListener("input", update);
          element.addEventListener("change", update);
        });

        update();
      }

      function renderPassword(container) {
        container.innerHTML = `
          <div class="password-output" id="passwordOutput">
            Generating…
          </div>

          <div class="password-options">
            <label class="password-option">
              <input id="passwordUpper" type="checkbox" checked>
              Uppercase letters
            </label>

            <label class="password-option">
              <input id="passwordLower" type="checkbox" checked>
              Lowercase letters
            </label>

            <label class="password-option">
              <input id="passwordNumbers" type="checkbox" checked>
              Numbers
            </label>

            <label class="password-option">
              <input id="passwordSymbols" type="checkbox" checked>
              Symbols
            </label>

            <label class="password-option">
              Length:
              <input id="passwordLength" type="range" min="8" max="64" value="16">
              <span id="passwordLengthValue">16</span>
            </label>
          </div>

          <div class="center-actions">
            <button class="tool-btn primary" id="generatePassword">Generate</button>
            <button class="tool-btn" id="copyPassword">Copy</button>
          </div>

          <div class="tool-message" id="passwordMessage"></div>
        `;

        const output = $("#passwordOutput", container);
        const message = $("#passwordMessage", container);
        const length = $("#passwordLength", container);
        const lengthValue = $("#passwordLengthValue", container);

        const groups = {
          upper: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
          lower: "abcdefghijklmnopqrstuvwxyz",
          numbers: "0123456789",
          symbols: "!@#$%^&*()_+-=[]{}|;:,.<>?"
        };

        function randomCharacter(characters) {
          const values = new Uint32Array(1);
          crypto.getRandomValues(values);
          return characters[values[0] % characters.length];
        }

        function generate() {
          let pool = "";

          if ($("#passwordUpper", container).checked) pool += groups.upper;
          if ($("#passwordLower", container).checked) pool += groups.lower;
          if ($("#passwordNumbers", container).checked) pool += groups.numbers;
          if ($("#passwordSymbols", container).checked) pool += groups.symbols;

          if (!pool) {
            output.textContent = "Select at least one option";
            return;
          }

          let password = "";

          for (let index = 0; index < Number(length.value); index++) {
            password += randomCharacter(pool);
          }

          output.textContent = password;
          message.textContent = "";
        }

        length.addEventListener("input", () => {
          lengthValue.textContent = length.value;

              <small>CSS</small>

            </button>
          </div>

        `;

        const input = $("#colorInput", container);
        const preview = $("#colorPreview", container);
        const message = $("#colorMessage", container);

        function hexToRgb(hex) {
          return {
            r: parseInt(hex.slice(1, 3), 16),
            g: parseInt(hex.slice(3, 5), 16),
            b: parseInt(hex.slice(5, 7), 16)
          };
        }

        function rgbToHsl(r, g, b) {
          r /= 255;
          g /= 255;
          b /= 255;

          const max = Math.max(r, g, b);
          const min = Math.min(r, g, b);
          const difference = max - min;

          let h = 0;
          let s = 0;
          const l = (max + min) / 2;

          if (difference !== 0) {
            s = difference / (1 - Math.abs(2 * l - 1));

            switch (max) {
              case r:
                h = 60 * (((g - b) / difference) % 6);
                break;
              case g:
                h = 60 * ((b - r) / difference + 2);
                break;
              default:
                h = 60 * ((r - g) / difference + 4);
            }
          }

          if (h < 0) h += 360;

          return {
            h: Math.round(h),
            s: Math.round(s * 100),
            l: Math.round(l * 100)
          };
        }

        function update() {
          const hex = input.value;
          const { r, g, b } = hexToRgb(hex);
          const { h, s, l } = rgbToHsl(r, g, b);

          preview.style.background = hex;
          $("#colorHex", container).textContent = hex;
          $("#colorRgb", container).textContent = `${r}, ${g}, ${b}`;
          $("#colorHsl", container).textContent = `${h}°, ${s}%, ${l}%`;
          $("#colorCss", container).textContent = `rgb(${r} ${g} ${b})`;
        }

        input.addEventListener("input", update);

        $$(".color-value", container).forEach(button => {
          button.addEventListener("click", async () => {

            const id = `color${type[0].toUpperCase()}${type.slice(1)}`;

            try {

              message.textContent = "Copied to clipboard";
            } catch {

            }
          });
        });

        update();
      }

        const foreground = $("#foregroundColor", container);
        const background = $("#backgroundColor", container);

        const ratio = $("#contrastRatio", container);

        function luminance(hex) {
          const rgb = [
            parseInt(hex.slice(1, 3), 16),
            parseInt(hex.slice(3, 5), 16),
            parseInt(hex.slice(5, 7), 16)
          ].map(value => {
            const channel = value / 255;
            return channel <= .03928
              ? channel / 12.92
              : Math.pow((channel + .055) / 1.055, 2.4);
          });

          return .2126 * rgb[0] + .7152 * rgb[1] + .0722 * rgb[2];
        }

        function update() {
          const first = luminance(foreground.value);
          const second = luminance(background.value);
          const light = Math.max(first, second);
          const dark = Math.min(first, second);
          const value = (light + .05) / (dark + .05);

          preview.style.color = foreground.value;
          preview.style.background = background.value;
          ratio.textContent = `${value.toFixed(2)}:1`;

          if (value >= 7) {
            status.textContent = "WCAG AAA pass";
            status.style.color = "#10b981";
          } else if (value >= 4.5) {
            status.textContent = "WCAG AA pass";
            status.style.color = "#f59e0b";
          } else {
            status.textContent = "WCAG contrast fail";
            status.style.color = "#ef4444";
          }
        }

        foreground.addEventListener("input", update);
        background.addEventListener("input", update);
        update();
      }

          const minutes = Math.floor(seconds / 60);

            `${String(minutes).padStart(2, "0")}:${String(remainingSeconds).padStart(2, "0")}`;

      function renderPalette(container) {
        container.innerHTML = `
          <input
            id="paletteColor"
            type="color"
            value="#6366f1"
            style="width:100%;height:48px;border:0;background:transparent;cursor:pointer">

          <select class="control" id="paletteMode" style="margin-top:10px">
            <option value="analogous">Analogous</option>
            <option value="triadic">Triadic</option>
            <option value="complementary">Complementary</option>
          </select>

          <div
            id="palettePreview"
            style="
              display:grid;
              grid-template-columns:repeat(5,1fr);
              height:72px;
              margin-top:14px;
              border-radius:8px;
              overflow:hidden">
          </div>

          <div id="paletteValues" style="display:grid;gap:6px;margin-top:12px"></div>
        `;

        const color = $("#paletteColor", container);
        const mode = $("#paletteMode", container);
        const preview = $("#palettePreview", container);
        const values = $("#paletteValues", container);

        function hexToHsl(hex) {
          let r = parseInt(hex.slice(1, 3), 16) / 255;
          let g = parseInt(hex.slice(3, 5), 16) / 255;
          let b = parseInt(hex.slice(5, 7), 16) / 255;

          const max = Math.max(r, g, b);
          const min = Math.min(r, g, b);
          const difference = max - min;

          let h = 0;
          let s = 0;
          const l = (max + min) / 2;

          if (difference) {
            s = difference / (1 - Math.abs(2 * l - 1));

            switch (max) {
              case r:
                h = 60 * (((g - b) / difference) % 6);
                break;
              case g:
                h = 60 * ((b - r) / difference + 2);
                break;
              default:
                h = 60 * ((r - g) / difference + 4);
            }
          }

          if (h < 0) h += 360;

          return [h, s * 100, l * 100];
        }

        function hslToHex(h, s, l) {
          s /= 100;
          l /= 100;

          const chroma = (1 - Math.abs(2 * l - 1)) * s;
          const x = chroma * (1 - Math.abs((h / 60) % 2 - 1));
          const match = l - chroma / 2;

          let r = 0;
          let g = 0;
          let b = 0;

          if (h < 60) [r, g, b] = [chroma, x, 0];
          else if (h < 120) [r, g, b] = [x, chroma, 0];
          else if (h < 180) [r, g, b] = [0, chroma, x];
          else if (h < 240) [r, g, b] = [0, x, chroma];
          else if (h < 300) [r, g, b] = [x, 0, chroma];
          else [r, g, b] = [chroma, 0, x];

          return "#" + [r, g, b]
            .map(value => Math.round((value + match) * 255)
            .toString(16)
            .padStart(2, "0"))
            .join("");
        }

        function update() {
          const [h, s, l] = hexToHsl(color.value);
          let offsets;

          if (mode.value === "triadic") {
            offsets = [0, 120, 240, 60, 300];
          } else if (mode.value === "complementary") {
            offsets = [0, 180, 25, 205, 335];
          } else {
            offsets = [0, 30, 60, 330, 300];
          }

          const colours = offsets.map(offset =>
            hslToHex((h + offset) % 360, s, l)
          );

          preview.innerHTML = colours
            .map(value => `<div style="background:${value}"></div>`)
            .join("");

          values.innerHTML = colours
            .map(value => `
              <button
                class="color-value"
                data-palette-value="${value}">
                ${value}
              </button>
            `)
            .join("");

          $$(".color-value", values).forEach(button => {
            button.addEventListener("click", async () => {
              try {
                await navigator.clipboard.writeText(button.dataset.paletteValue);
              } catch {}
            });
          });
        }

        color.addEventListener("input", update);
        mode.addEventListener("change", update);
        update();
      }

      function renderApi(container) {
        container.innerHTML = `
          <input

        const url = $("#apiUrl", container);
        const output = $("#apiOutput", container);

        $("#sendApi", container).addEventListener("click", async () => {
          output.value = "Loading…";

          try {
            const response = await fetch(url.value);
            const data = await response.json();
            output.value = JSON.stringify(data, null, 2);
          } catch (error) {
            output.value = `Request failed: ${error.message}`;
          }
        });
      }

      function renderInvoice(container) {
        container.innerHTML = `
          <div id="invoiceRows" style="display:grid;gap:8px"></div>

          <div class="tool-actions">
            <button class="tool-btn" id="addInvoiceRow">Add item</button>
          </div>

          <div
            style="
              margin-top:14px;
              padding:14px;
              border-radius:8px;
              background:var(--accent-soft);
              color:var(--accent-hover);
              font-family:var(--mono);
              text-align:right">
            Total: <span id="invoiceTotal">£0.00</span>
          </div>
        `;

        const rows = $("#invoiceRows", container);
        const total = $("#invoiceTotal", container);
        let items = [];

        function render() {
          rows.innerHTML = items.map((item, index) => `
            <div style="display:grid;grid-template-columns:1fr 80px 80px 34px;gap:6px">
              <input class="control invoice-description" data-index="${index}" value="${escapeHtml(item.description)}" placeholder="Description">
              <input class="control invoice-quantity" data-index="${index}" type="number" min="0" value="${item.quantity}">
              <input class="control invoice-price" data-index="${index}" type="number" min="0" step="0.01" value="${item.price}">
              <button class="tool-btn invoice-delete" data-index="${index}">×</button>
            </div>
          `).join("");

          const sum = items.reduce(
            (amount, item) => amount + item.quantity * item.price,
            0
          );

          total.textContent = `£${sum.toFixed(2)}`;

          $$(".invoice-description", rows).forEach(input => {
            input.addEventListener("input", event => {
              items[Number(event.target.dataset.index)].description = event.target.value;
            });
          });

          $$(".invoice-quantity", rows).forEach(input => {
            input.addEventListener("input", event => {
              items[Number(event.target.dataset.index)].quantity =
                Number(event.target.value) || 0;
              render();
            });
          });

          $$(".invoice-price", rows).forEach(input => {
            input.addEventListener("input", event => {
              items[Number(event.target.dataset.index)].price =
                Number(event.target.value) || 0;
              render();
            });
          });

          $$(".invoice-delete", rows).forEach(button => {
            button.addEventListener("click", () => {
              items.splice(Number(button.dataset.index), 1);
              render();
            });
          });
        }

        $("#addInvoiceRow", container).addEventListener("click", () => {
          items.push({
            description: "",
            quantity: 1,
            price: 0
          });

          render();
        });

        items.push({
          description: "",
          quantity: 1,
          price: 0
        });

        render();
      }

      function renderBudget(container) {

              color:var(--accent-hover);
              font-family:var(--mono);
              text-align:center">
            Enter your figures

        `;

        const fields = $$("input", container);
        const result = $("#budgetResult", container);

        function update() {
          const income = Number($("#budgetIncome", container).value) || 0;
          const expenses = fields
            .filter(field => field.id !== "budgetIncome")
            .reduce((sum, field) => sum + (Number(field.value) || 0), 0);

          const remaining = income - expenses;

          result.textContent =
            `Remaining: £${remaining.toFixed(2)}`;
        }

        fields.forEach(field => field.addEventListener("input", update));
      }

            style="

              padding:18px;
              border-radius:8px;

        const input = $("#imageInput", container);
        const result = $("#imageResult", container);

        input.addEventListener("change", () => {
          const file = input.files[0];

          if (!file) return;

          const image = new Image();

          image.onload = () => {
            result.textContent =

      function renderBreathing(container) {
        container.innerHTML = `
          <div style="text-align:center">
            <h3 id="breathingLabel">Ready?</h3>

            <p style="color:var(--text-muted);font-size:12px">
              4 seconds inhale · 7 seconds hold · 8 seconds exhale
            </p>

            <div
              id="breathingCircle"
              style="
                width:120px;
                height:120px;
                display:grid;
                place-items:center;
                margin:28px auto;
                border-radius:50%;
                background:var(--accent-soft);
                color:var(--accent-hover);
                font-weight:700;
                transition:transform 4s ease-in-out">
              Start
            </div>

            <div class="center-actions">
              <button class="tool-btn primary" id="startBreathing">Begin</button>
              <button class="tool-btn" id="stopBreathing">Stop</button>
            </div>
          </div>
        `;

        const label = $("#breathingLabel", container);
        const circle = $("#breathingCircle", container);
        let active = false;
        let timeoutId;

        function cycle() {
          if (!active) return;

          label.textContent = "Inhale";
          circle.textContent = "In";
          circle.style.transform = "scale(1.45)";

          timeoutId = setTimeout(() => {
            if (!active) return;

            label.textContent = "Hold";
            circle.textContent = "Hold";

            timeoutId = setTimeout(() => {
              if (!active) return;

              label.textContent = "Exhale";
              circle.textContent = "Out";
              circle.style.transform = "scale(1)";

              timeoutId = setTimeout(cycle, 8000);
            }, 7000);
          }, 4000);
        }

        $("#startBreathing", container).addEventListener("click", () => {
          if (!active) {
            active = true;
            cycle();
          }
        });

        $("#stopBreathing", container).addEventListener("click", () => {
          active = false;
          clearTimeout(timeoutId);
          label.textContent = "Paused";
          circle.textContent = "Start";
          circle.style.transform = "scale(1)";
        });
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      renderApps();
    })();
  </script>
