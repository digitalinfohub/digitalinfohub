<body>
    <div class="container">
        <a href="/software" class="back-link">← Back to Software Hub</a>
        <header>
            <div><h1>Password Generator</h1><p style="opacity: 0.7; margin-top: 0.5rem;">Create strong, secure passwords.</p></div>
            <span class="badge">✨ Digital Infohub Tool</span>
        </header>

        <div class="tool-card">
            <div class="password-display" id="password">Click Generate</div>
            
            <div class="options">
                <div class="checkbox-group"><input type="checkbox" id="uppercase" checked><label for="uppercase">Uppercase (A-Z)</label></div>
                <div class="checkbox-group"><input type="checkbox" id="lowercase" checked><label for="lowercase">Lowercase (a-z)</label></div>
                <div class="checkbox-group"><input type="checkbox" id="numbers" checked><label for="numbers">Numbers (0-9)</label></div>
                <div class="checkbox-group"><input type="checkbox" id="symbols" checked><label for="symbols">Symbols (!@#$)</label></div>
            </div>
            
            <div style="margin: 1.5rem 0;">
                <label>Password Length: <span id="lengthVal">16</span></label>
                <input type="range" id="length" min="4" max="64" value="16" oninput="document.getElementById('lengthVal').textContent=this.value">
            </div>
            
            <button class="btn-primary" onclick="generate()">Generate Password</button>
            <button class="btn-secondary" onclick="copyPassword()">Copy</button>
        </div>

        <div style="margin: 2rem 0; text-align: center;">
            <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-5443646750699471" data-ad-slot="1234567890" data-ad-format="auto" data-full-width-responsive="true"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>

        <div class="donate-card">
            <p class="donate-title">💜 Love this tool?</p>
            <p class="donate-text">Your support keeps these tools free and ad-free for everyone.</p>
            <div id="paypal-container-HTT66RW4Z3GLQ"></div><br>
            <a href="https://zora.co/coin/base:0xd51d99de87ad3433e35f43132eddb3f68f4458e4" target="_blank" class="zora-link">Support with Crypto (Zora)</a>
        </div>
    </div>

    <script>
        function generate() {
            const length = parseInt(document.getElementById('length').value);
            const useUpper = document.getElementById('uppercase').checked;
            const useLower = document.getElementById('lowercase').checked;
            const useNums = document.getElementById('numbers').checked;
            const useSyms = document.getElementById('symbols').checked;
            
            let chars = '';
            if (useUpper) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            if (useLower) chars += 'abcdefghijklmnopqrstuvwxyz';
            if (useNums) chars += '0123456789';
            if (useSyms) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';
            
            if (!chars) { alert('Select at least one option'); return; }
            
            let password = '';
            const array = new Uint32Array(length);
            crypto.getRandomValues(array);
            for (let i = 0; i < length; i++) {
                password += chars[array[i] % chars.length];
            }
            
            document.getElementById('password').textContent = password;
        }

        function copyPassword() {
            const text = document.getElementById('password').textContent;
            if (text && text !== 'Click Generate') {
                navigator.clipboard.writeText(text).then(() => alert('Password copied!'));
            }
        }

        if (window.paypal && paypal.HostedButtons) {
            paypal.HostedButtons({ hostedButtonId: "HTT66RW4Z3GLQ" }).render("#paypal-container-HTT66RW4Z3GLQ");
        }
    </script>
