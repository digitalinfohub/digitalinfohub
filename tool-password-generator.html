<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator | Digital Infohub</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --card-bg: #ffffff; --text: #1e293b; --border: #e2e8f0; }
        [data-theme="dark"] { --bg: #0f172a; --card-bg: #1e293b; --text: #f1f5f9; --border: #334155; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }
        .container { max-width: 800px; margin: 0 auto; padding: 2rem; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        h1 { margin: 0; font-size: 1.8rem; }
        .badge { background: var(--primary); color: white; padding: 0.25rem 0.75rem; border-radius: 99px; font-size: 0.8rem; font-weight: bold; }
        .tool-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 2rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        
        .result-box { background: var(--bg); border: 2px solid var(--primary); border-radius: 8px; padding: 1.5rem; text-align: center; font-family: monospace; font-size: 1.5rem; margin-bottom: 1.5rem; word-break: break-all; position: relative; }
        .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
        .control-group { display: flex; flex-direction: column; gap: 0.5rem; }
        label { font-weight: 600; font-size: 0.9rem; }
        input[type="range"] { width: 100%; }
        input[type="checkbox"] { width: 20px; height: 20px; }
        .checkbox-label { display: flex; align-items: center; gap: 0.5rem; cursor: pointer; }
        
        button { background: var(--primary); color: white; border: none; padding: 1rem 2rem; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 1rem; width: 100%; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }
        .btn-row { display: flex; gap: 1rem; margin-top: 1rem; }
        .btn-row button { flex: 1; }
        button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
        
        .strength-meter { height: 8px; background: var(--border); border-radius: 4px; margin-top: 1rem; overflow: hidden; }
        .strength-bar { height: 100%; width: 0%; transition: all 0.3s; }
        .strength-text { text-align: right; font-size: 0.85rem; margin-top: 0.5rem; font-weight: 600; }
        .back-link { display: inline-block; margin-bottom: 1rem; color: var(--primary); text-decoration: none; font-weight: 500; }
    </style>
</head>
<body>
    <div class="container">
        <a href="software.html" class="back-link">← Back to Software Hub</a>
        <header>
            <div>
                <h1>Secure Password Generator</h1>
                <p style="opacity: 0.7; margin-top: 0.5rem;">Create strong, random passwords instantly.</p>
            </div>
            <span class="badge">✨ Digital Infohub Tool</span>
        </header>

        <div class="tool-card">
            <div class="result-box" id="passwordResult">Click Generate to create password</div>
            
            <div class="controls">
                <div class="control-group">
                    <label>Password Length: <span id="lengthValue">16</span></label>
                    <input type="range" id="length" min="6" max="64" value="16" oninput="document.getElementById('lengthValue').textContent = this.value">
                </div>
                <div class="control-group">
                    <label class="checkbox-label"><input type="checkbox" id="uppercase" checked> Include Uppercase (A-Z)</label>
                    <label class="checkbox-label"><input type="checkbox" id="lowercase" checked> Include Lowercase (a-z)</label>
                    <label class="checkbox-label"><input type="checkbox" id="numbers" checked> Include Numbers (0-9)</label>
                    <label class="checkbox-label"><input type="checkbox" id="symbols" checked> Include Symbols (!@#$)</label>
                </div>
            </div>

            <button onclick="generatePassword()">🔐 Generate Password</button>
            <div class="btn-row">
                <button class="secondary" onclick="copyPassword()">📋 Copy</button>
                <button class="secondary" onclick="generatePassword()">🔄 Regenerate</button>
            </div>

            <div class="strength-meter"><div class="strength-bar" id="strengthBar"></div></div>
            <div class="strength-text" id="strengthText">Strength: --</div>
        </div>
    </div>

    <script>
        function generatePassword() {
            const length = parseInt(document.getElementById('length').value);
            const useUpper = document.getElementById('uppercase').checked;
            const useLower = document.getElementById('lowercase').checked;
            const useNumbers = document.getElementById('numbers').checked;
            const useSymbols = document.getElementById('symbols').checked;

            let chars = '';
            if (useLower) chars += 'abcdefghijklmnopqrstuvwxyz';
            if (useUpper) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            if (useNumbers) chars += '0123456789';
            if (useSymbols) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';

            if (chars === '') { alert('Please select at least one character type'); return; }

            let password = '';
            const array = new Uint32Array(length);
            crypto.getRandomValues(array);
            for (let i = 0; i < length; i++) {
                password += chars[array[i] % chars.length];
            }

            document.getElementById('passwordResult').textContent = password;
            updateStrength(password);
        }

        function updateStrength(pwd) {
            let score = 0;
            if (pwd.length > 8) score++;
            if (pwd.length > 12) score++;
            if (/[A-Z]/.test(pwd)) score++;
            if (/[0-9]/.test(pwd)) score++;
            if (/[^A-Za-z0-9]/.test(pwd)) score++;

            const bar = document.getElementById('strengthBar');
            const text = document.getElementById('strengthText');
            const colors = ['#ef4444', '#f97316', '#eab308', '#84cc16', '#22c55e'];
            const labels = ['Very Weak', 'Weak', 'Fair', 'Good', 'Strong'];

            const idx = Math.min(score, 4);
            bar.style.width = ((idx + 1) * 20) + '%';
            bar.style.background = colors[idx];
            text.textContent = 'Strength: ' + labels[idx];
            text.style.color = colors[idx];
        }

        function copyPassword() {
            const pwd = document.getElementById('passwordResult').textContent;
            if (pwd === 'Click Generate to create password') return;
            navigator.clipboard.writeText(pwd).then(() => {
                const btn = event.target;
                const original = btn.textContent;
                btn.textContent = '✓ Copied!';
                setTimeout(() => btn.textContent = original, 1500);
            });
        }
    </script>
</body>
</html>
