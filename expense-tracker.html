    <style>
        :root { --primary: #10b981; --bg: #f8fafc; --card-bg: #ffffff; --text: #1e293b; --border: #e2e8f0; }
        [data-theme="dark"] { --bg: #0f172a; --card-bg: #1e293b; --text: #f1f5f9; --border: #334155; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; transition: background 0.3s; }
        .container { max-width: 800px; margin: 0 auto; padding: 2rem; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        h1 { margin: 0; font-size: 1.8rem; }
        .badge { background: var(--primary); color: white; padding: 0.25rem 0.75rem; border-radius: 99px; font-size: 0.8rem; font-weight: bold; }
        .tool-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 2rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        
        .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .summary-card { background: var(--bg); padding: 1.5rem; border-radius: 8px; text-align: center; }
        .summary-card h3 { margin: 0 0 0.5rem; font-size: 0.9rem; opacity: 0.8; }
        .summary-card .amount { font-size: 1.8rem; font-weight: bold; }
        .income { color: #10b981; }
        .expense { color: #ef4444; }
        
        .form-row { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 1rem; margin-bottom: 1.5rem; align-items: end; }
        @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
        .input-group { display: flex; flex-direction: column; gap: 0.5rem; }
        label { font-weight: 600; font-size: 0.9rem; }
        input, select { padding: 0.75rem; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font-size: 1rem; width: 100%; box-sizing: border-box; }
        button { padding: 0.75rem 1.5rem; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 1rem; transition: all 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        button:hover { transform: translateY(-2px); opacity: 0.9; }
        
        .transaction-list { list-style: none; padding: 0; margin: 0; }
        .transaction-item { display: flex; justify-content: space-between; align-items: center; padding: 1rem; border-bottom: 1px solid var(--border); animation: slideIn 0.3s ease-out; }
        .transaction-item:last-child { border-bottom: none; }
        .delete-btn { background: #ef4444; color: white; padding: 0.4rem 0.8rem; font-size: 0.8rem; }
        
        .back-link { display: inline-block; margin-bottom: 1rem; color: var(--primary); text-decoration: none; font-weight: 500; }
        
        /* Donate Section */
        .donate-card { margin-top: 3rem; padding: 2rem; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .donate-title { font-size: 1.1rem; font-weight: 600; color: var(--text); margin: 0 0 0.5rem; }
        .donate-text { font-size: 0.9rem; color: var(--text); opacity: 0.8; margin: 0 0 1.5rem; }
        #paypal-container-HTT66RW4Z3GLQ { width: min(320px, 100%); min-height: 55px; margin: 0 auto; }
        .zora-link { display: inline-block; margin-top: 1rem; padding: 0.75rem 1.5rem; background: linear-gradient(45deg, #6d28d9, #ec4899); color: white; text-decoration: none; border-radius: 8px; font-weight: 600; transition: transform 0.2s; }
        .zora-link:hover { transform: scale(1.05); }

        /* Animations */
        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
        .summary-card { animation: fadeInUp 0.5s ease-out; }
        .summary-card:nth-child(1) { animation-delay: 0.1s; }
        .summary-card:nth-child(2) { animation-delay: 0.2s; }
        .summary-card:nth-child(3) { animation-delay: 0.3s; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        button, .transaction-item { transition: all 0.2s ease; }
        button:hover { transform: translateY(-2px); }

<body>
    <div class="container">
        <a href="/software" class="back-link">← Back to Software Hub</a>
        <header>
            <div>
                <h1>Expense Tracker</h1>
                <p style="opacity: 0.7; margin-top: 0.5rem;">Track your income and expenses easily.</p>
            </div>
            <span class="badge">✨ Digital Infohub Tool</span>
        </header>

        <div class="tool-card">
            <div class="summary-grid">
                <div class="summary-card">
                    <h3>Balance</h3>
                    <div class="amount" id="balance">$0.00</div>
                </div>
                <div class="summary-card">
                    <h3>Income</h3>
                    <div class="amount income" id="income">$0.00</div>
                </div>
                <div class="summary-card">
                    <h3>Expenses</h3>
                    <div class="amount expense" id="expenses">$0.00</div>
                </div>
            </div>

            <div class="form-row">
                <div class="input-group">
                    <label>Description</label>
                    <input type="text" id="desc" placeholder="e.g., Salary, Rent">
                </div>
                <div class="input-group">
                    <label>Amount</label>
                    <input type="number" id="amount" placeholder="0.00" step="0.01">
                </div>
                <div class="input-group">
                    <label>Type</label>
                    <select id="type">
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>
                </div>
                <button class="btn-primary" onclick="addTransaction()">Add</button>
            </div>

            <ul class="transaction-list" id="list"></ul>
        </div>

        <!-- AdSense -->
        <div style="margin: 2rem 0; text-align: center;">
            <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-5443646750699471" data-ad-slot="1234567890" data-ad-format="auto" data-full-width-responsive="true"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>

        <!-- Donation -->
        <div class="donate-card">
            <p class="donate-title">💜 Love this tool?</p>
            <p class="donate-text">Your support keeps these tools free and ad-free for everyone.</p>
            <div id="paypal-container-HTT66RW4Z3GLQ"></div>
            <br>
            <a href="https://zora.co/coin/base:0xd51d99de87ad3433e35f43132eddb3f68f4458e4" target="_blank" class="zora-link">Support with Crypto (Zora)</a>
        </div>
    </div>

    <script>
        let transactions = JSON.parse(localStorage.getItem('transactions')) || [];

        function updateSummary() {
            const income = transactions.filter(t => t.type === 'income').reduce((sum, t) => sum + t.amount, 0);
            const expense = transactions.filter(t => t.type === 'expense').reduce((sum, t) => sum + t.amount, 0);
            const balance = income - expense;

            document.getElementById('balance').textContent = `$${balance.toFixed(2)}`;
            document.getElementById('income').textContent = `$${income.toFixed(2)}`;
            document.getElementById('expenses').textContent = `$${expense.toFixed(2)}`;
        }

        function renderList() {
            const list = document.getElementById('list');
            list.innerHTML = '';
            transactions.forEach((t, i) => {
                const li = document.createElement('li');
                li.className = 'transaction-item';
                li.innerHTML = `
                    <div>
                        <strong>${t.desc}</strong>
                        <div style="font-size: 0.8rem; opacity: 0.7;">${new Date(t.date).toLocaleDateString()}</div>
                    </div>
                    <div style="display: flex; align-items: center; gap: 1rem;">
                        <span class="${t.type === 'income' ? 'income' : 'expense'}" style="font-weight: bold;">
                            ${t.type === 'income' ? '+' : '-'}$${t.amount.toFixed(2)}
                        </span>
                        <button class="delete-btn" onclick="deleteTransaction(${i})">Delete</button>
                    </div>
                `;
                list.appendChild(li);
            });
            updateSummary();
        }

        function addTransaction() {
            const desc = document.getElementById('desc').value.trim();
            const amount = parseFloat(document.getElementById('amount').value);
            const type = document.getElementById('type').value;

            if (!desc || isNaN(amount) || amount <= 0) {
                alert('Please enter valid description and amount');
                return;
            }

            transactions.push({ desc, amount, type, date: new Date().toISOString() });
            localStorage.setItem('transactions', JSON.stringify(transactions));
            
            document.getElementById('desc').value = '';
            document.getElementById('amount').value = '';
            renderList();
        }

        function deleteTransaction(index) {
            transactions.splice(index, 1);
            localStorage.setItem('transactions', JSON.stringify(transactions));
            renderList();
        }

        renderList();

        // PayPal
        if (window.paypal && paypal.HostedButtons) {
            paypal.HostedButtons({ hostedButtonId: "HTT66RW4Z3GLQ" }).render("#paypal-container-HTT66RW4Z3GLQ");
        }
    </script>
</body>
