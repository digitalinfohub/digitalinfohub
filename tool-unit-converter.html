<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter | Digital Infohub</title>
    <!-- PayPal SDK - Part 1 -->
    <script src="https://www.paypal.com/sdk/js?client-id=BAAWPO7p_oIMxRK7-euIX6su8WnqCJLuHdvvNOwh3Fc7ycnF1ripj2YSUbBdZVy8DfoJN6E-AJeUfSESRM&components=hosted-buttons&disable-funding=venmo&currency=GBP"></script>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --card-bg: #ffffff; --text: #1e293b; --border: #e2e8f0; }
        [data-theme="dark"] { --bg: #0f172a; --card-bg: #1e293b; --text: #f1f5f9; --border: #334155; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }
        .container { max-width: 800px; margin: 0 auto; padding: 2rem; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        h1 { margin: 0; font-size: 1.8rem; }
        .badge { background: var(--primary); color: white; padding: 0.25rem 0.75rem; border-radius: 99px; font-size: 0.8rem; font-weight: bold; }
        .tool-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 2rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        
        .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .tab { padding: 0.75rem 1.5rem; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; background: transparent; color: var(--text); font-weight: 600; transition: all 0.2s; }
        .tab.active { background: var(--primary); color: white; border-color: var(--primary); }
        
        .converter-grid { display: grid; grid-template-columns: 1fr auto 1fr; gap: 1rem; align-items: end; margin-bottom: 1.5rem; }
        @media (max-width: 600px) { .converter-grid { grid-template-columns: 1fr; } }
        .input-group { display: flex; flex-direction: column; gap: 0.5rem; }
        label { font-weight: 600; font-size: 0.9rem; }
        input, select { padding: 0.75rem; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font-size: 1rem; width: 100%; box-sizing: border-box; }
        .equals { font-size: 2rem; text-align: center; padding-bottom: 0.5rem; }
        
        .back-link { display: inline-block; margin-bottom: 1rem; color: var(--primary); text-decoration: none; font-weight: 500; }
    </style>
</head>
<body>
    <div class="container">
        <a href="software.html" class="back-link">← Back to Software Hub</a>
        <header>
            <div>
                <h1>Universal Unit Converter</h1>
                <p style="opacity: 0.7; margin-top: 0.5rem;">Convert between different units instantly.</p>
            </div>
            <span class="badge">✨ Digital Infohub Tool</span>
        </header>

        <div class="tool-card">
            <div class="tabs">
                <button class="tab active" onclick="setCategory('length')">Length</button>
                <button class="tab" onclick="setCategory('weight')">Weight</button>
                <button class="tab" onclick="setCategory('temp')">Temperature</button>
                <button class="tab" onclick="setCategory('data')">Data</button>
                <button class="tab" onclick="setCategory('time')">Time</button>
            </div>

            <div class="converter-grid">
                <div class="input-group">
                    <label>From</label>
                    <input type="number" id="inputVal" value="1" oninput="convert()">
                    <select id="fromUnit" onchange="convert()"></select>
                </div>
                <div class="equals">=</div>
                <div class="input-group">
                    <label>To</label>
                    <input type="number" id="outputVal" readonly>
                    <select id="toUnit" onchange="convert()"></select>
                </div>
            </div>
        </div>
    </div>

    <script>
        const units = {
            length: { m: 1, km: 1000, cm: 0.01, mm: 0.001, mi: 1609.34, ft: 0.3048, in: 0.0254 },
            weight: { kg: 1, g: 0.001, mg: 0.000001, lb: 0.453592, oz: 0.0283495 },
            data: { B: 1, KB: 1024, MB: 1048576, GB: 1073741824, TB: 1099511627776 },
            time: { s: 1, min: 60, h: 3600, day: 86400, week: 604800 }
        };
        
        let currentCat = 'length';

        function setCategory(cat) {
            currentCat = cat;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            const fromSel = document.getElementById('fromUnit');
            const toSel = document.getElementById('toUnit');
            fromSel.innerHTML = '';
            toSel.innerHTML = '';
            
            const keys = Object.keys(units[cat]);
            keys.forEach((k, i) => {
                fromSel.add(new Option(k.toUpperCase(), k));
                toSel.add(new Option(k.toUpperCase(), k));
            });
            if(keys.length > 1) toSel.selectedIndex = 1;
            convert();
        }

        function convert() {
            const val = parseFloat(document.getElementById('inputVal').value) || 0;
            const from = document.getElementById('fromUnit').value;
            const to = document.getElementById('toUnit').value;
            
            let result;
            if (currentCat === 'temp') {
                result = convertTemp(val, from, to);
            } else {
                const base = val * units[currentCat][from];
                result = base / units[currentCat][to];
            }
            
            document.getElementById('outputVal').value = Number(result.toPrecision(10));
        }

        function convertTemp(val, from, to) {
            if (from === to) return val;
            let celsius;
            if (from === 'c') celsius = val;
            else if (from === 'f') celsius = (val - 32) * 5/9;
            else if (from === 'k') celsius = val - 273.15;
            
            if (to === 'c') return celsius;
            if (to === 'f') return celsius * 9/5 + 32;
            if (to === 'k') return celsius + 273.15;
        }

        setCategory('length');
    </script>
    <!-- PayPal Button - Part 2 -->
    <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border); text-align: center;">
        <p style="font-size: 0.9rem; color: var(--text); margin-bottom: 1rem;">If this tool helps you, consider supporting us!</p>
        <div id="paypal-container-HTT66RW4Z3GLQ"></div>
        <script>
          paypal.HostedButtons({
            hostedButtonId: "HTT66RW4Z3GLQ",
          }).render("#paypal-container-HTT66RW4Z3GLQ")
        </script>
    </div>
</body>
</html>
