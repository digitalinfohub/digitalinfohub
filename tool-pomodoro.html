            <button class="mode-btn active" onclick="setMode('work')">Work</button>
            <button class="mode-btn" onclick="setMode('shortBreak')">Short Break</button>
            <button class="mode-btn" onclick="setMode('longBreak')">Long Break</button>
        </div>

        <div class="timer-display" id="timerDisplay">25:00</div>

        <div class="controls">
            <button class="timer-btn primary" id="startBtn" onclick="toggleTimer()">Start</button>
            <button class="timer-btn" onclick="resetTimer()">Reset</button>
        </div>

        </a>

</div>

<script>
let timeLeft = 25 * 60;
let timerId = null;
let isRunning = false;
let mode = 'work';
let completedSessions = 0;

const modes = {
    work: 25 * 60,
    shortBreak: 5 * 60,
    longBreak: 15 * 60
};

function updateDisplay() {
    const mins = Math.floor(timeLeft / 60);
    const secs = timeLeft % 60;
    document.getElementById('timerDisplay').textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    document.title = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')} - Pomodoro`;
}

function toggleTimer() {
    if (isRunning) {
        clearInterval(timerId);
        document.getElementById('startBtn').textContent = 'Start';
        isRunning = false;
    } else {
        timerId = setInterval(() => {
            timeLeft--;
            updateDisplay();
            if (timeLeft <= 0) {
                clearInterval(timerId);
                playNotification();
                if (mode === 'work') {
                    completedSessions++;
                    addSessionDot();
                    setMode(completedSessions % 4 === 0 ? 'longBreak' : 'shortBreak');
                } else {
                    setMode('work');
                }
            }
        }, 1000);
        document.getElementById('startBtn').textContent = 'Pause';
        isRunning = true;
    }
}

function resetTimer() {
    clearInterval(timerId);
    timeLeft = modes[mode];
    isRunning = false;
    document.getElementById('startBtn').textContent = 'Start';
    updateDisplay();
}

function setMode(newMode) {
    mode = newMode;
    timeLeft = modes[mode];
    isRunning = false;
    clearInterval(timerId);
    document.getElementById('startBtn').textContent = 'Start';
    
    document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    
    updateDisplay();
}

function playNotification() {
    const audio = new AudioContext();
    const oscillator = audio.createOscillator();
    const gainNode = audio.createGain();
    oscillator.connect(gainNode);
    gainNode.connect(audio.destination);
    oscillator.frequency.value = 800;
    oscillator.type = 'sine';
    gainNode.gain.setValueAtTime(0.3, audio.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audio.currentTime + 0.5);
    oscillator.start(audio.currentTime);
    oscillator.stop(audio.currentTime + 0.5);
}

function addSessionDot() {
    const container = document.getElementById('sessionDots');
    const dot = document.createElement('div');
    dot.className = 'session-dot completed';
    container.appendChild(dot);
}

// Initialize
updateDisplay();
</script>
