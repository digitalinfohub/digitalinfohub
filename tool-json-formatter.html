<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Formatter | Digital Infohub</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }
        [data-theme="dark"] {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f1f5f9;
            --border: #334155;
        }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; transition: background 0.3s; }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        h1 { margin: 0; font-size: 1.8rem; }
        .badge { background: var(--primary); color: white; padding: 0.25rem 0.75rem; border-radius: 99px; font-size: 0.8rem; font-weight: bold; }
        
        .tool-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 2rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .editor-container { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; height: 60vh; }
        @media (max-width: 768px) { .editor-container { grid-template-columns: 1fr; height: auto; } textarea { height: 300px; } }
        
        textarea { width: 100%; height: 100%; padding: 1rem; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-family: monospace; resize: none; box-sizing: border-box; }
        .controls { display: flex; gap: 1rem; margin-top: 1rem; }
        button { background: var(--primary); color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 6px; cursor: pointer; font-weight: 600; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }
        button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .status { margin-top: 1rem; font-weight: 500; }
        .success { color: #10b981; }
        .error { color: #ef4444; }
        .back-link { display: inline-block; margin-bottom: 1rem; color: var(--primary); text-decoration: none; font-weight: 500; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <a href="software.html" class="back-link">← Back to Software Hub</a>
        <header>
            <div>
                <h1>JSON Formatter & Validator</h1>
                <p style="opacity: 0.7; margin-top: 0.5rem;">Beautify, validate, and minify your JSON data instantly.</p>
            </div>
            <span class="badge">✨ Digital Infohub Tool</span>
        </header>

        <div class="tool-card">
            <div class="editor-container">
                <div>
                    <label style="font-weight:600; display:block; margin-bottom:0.5rem;">Input JSON</label>
                    <textarea id="inputJson" placeholder='{"paste": "your json here"}'></textarea>
                </div>
                <div>
                    <label style="font-weight:600; display:block; margin-bottom:0.5rem;">Formatted Output</label>
                    <textarea id="outputJson" readonly></textarea>
                </div>
            </div>
            <div class="controls">
                <button onclick="formatJSON()">Format JSON</button>
                <button class="secondary" onclick="minifyJSON()">Minify</button>
                <button class="secondary" onclick="copyOutput()">Copy Result</button>
                <button class="secondary" onclick="clearAll()">Clear</button>
            </div>
            <div id="status" class="status"></div>
        </div>
    </div>

    <script>
        function formatJSON() {
            const input = document.getElementById('inputJson').value;
            const status = document.getElementById('status');
            const output = document.getElementById('outputJson');
            try {
                if (!input.trim()) throw new Error("Input is empty");
                const parsed = JSON.parse(input);
                output.value = JSON.stringify(parsed, null, 4);
                status.innerHTML = '<span class="success">✓ Valid JSON</span>';
            } catch (e) {
                status.innerHTML = `<span class="error">✗ Invalid JSON: ${e.message}</span>`;
                output.value = "";
            }
        }

        function minifyJSON() {
            const input = document.getElementById('inputJson').value;
            const status = document.getElementById('status');
            const output = document.getElementById('outputJson');
            try {
                if (!input.trim()) throw new Error("Input is empty");
                const parsed = JSON.parse(input);
                output.value = JSON.stringify(parsed);
                status.innerHTML = '<span class="success">✓ Minified Successfully</span>';
            } catch (e) {
                status.innerHTML = `<span class="error">✗ Error: ${e.message}</span>`;
            }
        }

        function copyOutput() {
            const output = document.getElementById('outputJson');
            if (!output.value) return;
            output.select();
            document.execCommand('copy');
            const status = document.getElementById('status');
            status.innerHTML = '<span class="success">✓ Copied to clipboard!</span>';
        }

        function clearAll() {
            document.getElementById('inputJson').value = '';
            document.getElementById('outputJson').value = '';
            document.getElementById('status').innerHTML = '';
        }
    </script>
</body>
</html>
