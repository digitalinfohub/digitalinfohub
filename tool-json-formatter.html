<body>
    <div class="container">
        <a href="/software" class="back-link">← Back to Software Hub</a>
        <header>
            <div><h1>JSON Formatter</h1><p style="opacity: 0.7; margin-top: 0.5rem;">Format, validate, and beautify JSON.</p></div>
            <span class="badge">✨ Digital Infohub Tool</span>
        </header>

        <div class="tool-card">
            <div class="btn-group">
                <button class="btn-primary" onclick="formatJSON()">Format JSON</button>
                <button class="btn-secondary" onclick="minifyJSON()">Minify</button>
                <button class="btn-secondary" onclick="copyOutput()">Copy Output</button>
                <button class="btn-secondary" onclick="clearAll()">Clear</button>
            </div>
            
            <div class="editor-grid">
                <div>
                    <label style="font-weight: 600; margin-bottom: 0.5rem; display: block;">Input JSON</label>
                    <textarea id="input" placeholder='{"paste": "your json here"}'></textarea>
                </div>
                <div>
                    <label style="font-weight: 600; margin-bottom: 0.5rem; display: block;">Output</label>
                    <div class="output-area" id="output"></div>
                </div>
            </div>
        </div>

        <div style="margin: 2rem 0; text-align: center;">
            <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-5443646750699471" data-ad-slot="1234567890" data-ad-format="auto" data-full-width-responsive="true"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>

        <div class="donate-card">
            <p class="donate-title">💜 Love this tool?</p>
            <p class="donate-text">Your support keeps these tools free and ad-free for everyone.</p>
            <div id="paypal-container-HTT66RW4Z3GLQ"></div><br>
            <a href="https://zora.co/coin/base:0xd51d99de87ad3433e35f43132eddb3f68f4458e4" target="_blank" class="zora-link">Support with Crypto (Zora)</a>
        </div>
    </div>

    <script>
        function formatJSON() {
            const input = document.getElementById('input').value.trim();
            const output = document.getElementById('output');
            if (!input) { output.innerHTML = '<span class="error">Please enter JSON</span>'; return; }
            try {
                const obj = JSON.parse(input);
                output.innerHTML = `<span class="success">${JSON.stringify(obj, null, 2)}</span>`;
            } catch (e) {
                output.innerHTML = `<span class="error">Invalid JSON: ${e.message}</span>`;
            }
        }

        function minifyJSON() {
            const input = document.getElementById('input').value.trim();
            const output = document.getElementById('output');
            if (!input) { output.innerHTML = '<span class="error">Please enter JSON</span>'; return; }
            try {
                const obj = JSON.parse(input);
                output.innerHTML = `<span class="success">${JSON.stringify(obj)}</span>`;
            } catch (e) {
                output.innerHTML = `<span class="error">Invalid JSON: ${e.message}</span>`;
            }
        }

        function copyOutput() {
            const text = document.getElementById('output').textContent;
            navigator.clipboard.writeText(text).then(() => alert('Copied!'));
        }

        function clearAll() {
            document.getElementById('input').value = '';
            document.getElementById('output').innerHTML = '';
        }

        if (window.paypal && paypal.HostedButtons) {
            paypal.HostedButtons({ hostedButtonId: "HTT66RW4Z3GLQ" }).render("#paypal-container-HTT66RW4Z3GLQ");
        }
    </script>
