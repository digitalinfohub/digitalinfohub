        constructor() {
          this.ctx = null;
          this.muted = false;
        }

        init() {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
        }

        toggleMute() {
          this.muted = !this.muted;
          return this.muted;
        }

        playTone(freq, type, duration, gainVal, delay = 0, slideTo = null) {
          if (this.muted) return;
          this.init();
          if (!this.ctx) return;

          const now = this.ctx.currentTime + delay;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);
          if (slideTo) {
            osc.frequency.exponentialRampToValueAtTime(slideTo, now + duration);
          }

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(gainVal, now + 0.012);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + duration + 0.02);
        }

          this.playTone(1046.5, 'sine', 0.16, 0.08, 0);

      function formatMoney(num) {
        if (num < 1000) return '$' + Math.floor(num).toLocaleString();
        const units = ['K', 'M', 'B', 'T'];
        let unitIndex = -1;
        let scaled = num;
        while (scaled >= 1000 && unitIndex < units.length - 1) {
          scaled /= 1000;
          unitIndex++;
        }
        return '$' + scaled.toFixed(scaled >= 100 ? 1 : 2) + units[unitIndex];
      }

      function getShopUpgradeCost(cfg, level) {
        return Math.floor(cfg.baseCost * Math.pow(cfg.costMult, level));
      }

      function getGlobalMultiplier() {
        const vanBonus = 1 + state.upgrades.delivery_van * 0.30;
        const charterBonus = Math.pow(2, state.upgrades.pedestrian_zone);
        const rushBonus = state.rushTimer > 0 ? 1.5 : 1.0;
        return vanBonus * charterBonus * rushBonus;
      }

      function getShopIncomePerSec(cfg, level) {
        if (level <= 0) return 0;
        const milestoneMult = Math.pow(1.32, Math.floor(level / 5));
        return cfg.baseIncome * level * milestoneMult * getGlobalMultiplier();
      }

      function getTotalIncomePerSec() {
        let total = 0;
        for (const cfg of SHOP_CONFIGS) {
          total += getShopIncomePerSec(cfg, state.shops[cfg.id].level);
        }
        return total;
      }

      function getUpgradeCost(upg) {
        const lv = state.upgrades[upg.id] || 0;
        return Math.floor(upg.baseCost * Math.pow(upg.costMult, lv));
      }

            upgrades: state.upgrades

        } catch (e) { /* Ignore storage restrictions */ }
      }

          if (typeof parsed.cash === 'number') state.cash = parsed.cash;
          if (typeof parsed.totalEarned === 'number') state.totalEarned = parsed.totalEarned;
          if (parsed.shops) {

                state.shops[cfg.id].level = parsed.shops[cfg.id].level;

            });

          if (parsed.upgrades) {

      function createCobblestoneTexture() {
        const c = document.createElement('canvas');
        c.width = 256;
        c.height = 256;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#b8b2a6';
        ctx.fillRect(0, 0, 256, 256);

        const rows = 8;
        const cols = 8;
        const w = 256 / cols;
        const h = 256 / rows;
        const shades = ['#c7c1b6', '#b0a99c', '#d1cbc0', '#a69f92'];

        for (let r = 0; r < rows; r++) {
          const offsetX = (r % 2) * (w * 0.5);
          for (let col = -1; col <= cols; col++) {
            ctx.fillStyle = shades[(r * 7 + col * 3 + 8) % shades.length];
            ctx.beginPath();
            ctx.roundRect(col * w + offsetX + 2, r * h + 2, w - 4, h - 4, 5);
            ctx.fill();
          }
        }
        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(14, 14);
        return tex;
      }

      function createGrassTexture() {
        const c = document.createElement('canvas');
        c.width = 256;
        c.height = 256;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#6f9654';
        ctx.fillRect(0, 0, 256, 256);

        for (let i = 0; i < 650; i++) {
          ctx.fillStyle = i % 2 === 0 ? '#7ca360' : '#618747';
          ctx.fillRect(Math.random() * 256, Math.random() * 256, 3, 6);
        }
        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(24, 24);
        return tex;
      }

          ctx.font = 'bold 22px Inter, sans-serif';

      let toastTimeout = null;
      function showToast(msg) {
        const container = document.getElementById('toast-container');

        container.classList.remove('opacity-0', '-translate-y-2');

      function purchaseOrUpgradeShop(shopId) {
        const cfg = SHOP_CONFIGS.find(c => c.id === shopId);
        if (!cfg) return;

        const currentLv = state.shops[shopId].level;
        const cost = getShopUpgradeCost(cfg, currentLv);

        if (state.cash >= cost) {
          state.cash -= cost;
          state.shops[shopId].level += 1;
          sound.playUpgrade();
          rebuildShopVisuals(cfg);
          updateUI();
          saveGame();

          const ent = shopEntities[shopId];
          spawnCashPopup(ent.group.position, getShopIncomePerSec(cfg, state.shops[shopId].level), '#15803d');
          showToast(
            currentLv === 0
              ? `Opened ${cfg.name}!`
              : `Expanded ${cfg.name} to Level ${state.shops[shopId].level}!`
          );

          spawnShopper();
        } else {
          if (currentLv > 0) {
            const tapBonus = Math.max(4, Math.ceil(getShopIncomePerSec(cfg, currentLv) * 0.45));
            state.cash += tapBonus;
            state.totalEarned += tapBonus;
            sound.playCoin();
            const ent = shopEntities[shopId];
            spawnCashPopup(ent.group.position, tapBonus, '#15803d');
            updateUI();
          } else {
            sound.playClick();
            showToast(`Need ${formatMoney(cost)} to open ${cfg.name}`);
          }
        }
      }

      // --------------------------------------------------------------------------
      // 8. DESKTOP ORBIT / WASD & TOUCH / VR RAYCASTING
      // --------------------------------------------------------------------------
      const raycaster = new THREE.Raycaster();
      const pointerNDC = new THREE.Vector2();

      let isPointerDown = false;
      let lastPointerPos = { x: 0, y: 0 };
      let draggedDistance = 0;

      canvas.addEventListener('pointerdown', (e) => {
        sound.init();
        isPointerDown = true;
        lastPointerPos = { x: e.clientX, y: e.clientY };
        draggedDistance = 0;
      });

      window.addEventListener('pointermove', (e) => {
        if (!isPointerDown || renderer.xr.isPresenting) return;
        const dx = e.clientX - lastPointerPos.x;
        const dy = e.clientY - lastPointerPos.y;
        draggedDistance += Math.hypot(dx, dy);
        lastPointerPos = { x: e.clientX, y: e.clientY };

        camOrbit.theta -= dx * 0.0065;
        camOrbit.phi = Math.max(0.28, Math.min(1.42, camOrbit.phi - dy * 0.0065));
        updateDesktopCamera();
      });

      window.addEventListener('pointerup', (e) => {
        if (!isPointerDown) return;
        isPointerDown = false;

        if (draggedDistance < 8 && !renderer.xr.isPresenting) {
          const rect = canvas.getBoundingClientRect();
          pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
          pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

          raycaster.setFromCamera(pointerNDC, camera);
          const hits = raycaster.intersectObjects(interactiveMeshes, false);
          if (hits.length > 0) {
            const data = hits[0].object.userData;
            if (data.shopId) purchaseOrUpgradeShop(data.shopId);
            else if (data.upgradeId) purchaseTownImprovement(data.upgradeId);
          }
        }
      });

      canvas.addEventListener('wheel', (e) => {
        if (renderer.xr.isPresenting) return;
        e.preventDefault();
        camOrbit.radius = Math.max(
          camOrbit.minRadius,
          Math.min(camOrbit.maxRadius, camOrbit.radius + e.deltaY * 0.02)
        );
        updateDesktopCamera();
      }, { passive: false });

      let initialPinchDist = null;
      canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          initialPinchDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
        }
      }, { passive: true });

      canvas.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && initialPinchDist) {
          const dist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          const delta = initialPinchDist - dist;
          camOrbit.radius = Math.max(
            camOrbit.minRadius,
            Math.min(camOrbit.maxRadius, camOrbit.radius + delta * 0.05)
          );
          initialPinchDist = dist;
          updateDesktopCamera();
        }
      }, { passive: true });

      const keysPressed = {};
      window.addEventListener('keydown', (e) => { keysPressed[e.code] = true; });
      window.addEventListener('keyup', (e) => { keysPressed[e.code] = false; });

      function processKeyboardMovement(dt) {
        if (renderer.xr.isPresenting) return;
        const speed = 16 * dt;
        let moved = false;

        const forward = new THREE.Vector3(-Math.sin(camOrbit.theta), 0, -Math.cos(camOrbit.theta));
        const right = new THREE.Vector3(Math.cos(camOrbit.theta), 0, -Math.sin(camOrbit.theta));

        if (keysPressed['KeyW'] || keysPressed['ArrowUp']) {
          camOrbit.target.addScaledVector(forward, speed);
          moved = true;
        }
        if (keysPressed['KeyS'] || keysPressed['ArrowDown']) {
          camOrbit.target.addScaledVector(forward, -speed);
          moved = true;
        }
        if (keysPressed['KeyA'] || keysPressed['ArrowLeft']) {
          camOrbit.target.addScaledVector(right, -speed);
          moved = true;
        }
        if (keysPressed['KeyD'] || keysPressed['ArrowRight']) {
          camOrbit.target.addScaledVector(right, speed);
          moved = true;
        }

        if (moved) {
          camOrbit.target.x = Math.max(-22, Math.min(22, camOrbit.target.x));
          camOrbit.target.z = Math.max(-22, Math.min(22, camOrbit.target.z));
          updateDesktopCamera();
        }
      }

      // --------------------------------------------------------------------------
      // 9. WEBXR VIRTUAL REALITY CONTROLLERS (LASER POINTER + SNAP TURN)
      // --------------------------------------------------------------------------
      const vrControllers = [];
      const tempMatrix = new THREE.Matrix4();
      let snapTurnCooldown = 0;

      function setupVRControllers() {
        for (let i = 0; i < 2; i++) {
          const controller = renderer.xr.getController(i);

          const lineGeo = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(0, 0, 0),
            new THREE.Vector3(0, 0, -22)
          ]);
          const lineMat = new THREE.LineBasicMaterial({ color: 0xd97706 });
          const laser = new THREE.Line(lineGeo, lineMat);
          controller.add(laser);

          const grip = new THREE.Mesh(
            new THREE.CylinderGeometry(0.025, 0.03, 0.12, 10),
            new THREE.MeshStandardMaterial({ color: 0x334155 })
          );
          grip.rotation.x = Math.PI / 2;
          controller.add(grip);

          controller.addEventListener('selectstart', () => {
            tempMatrix.identity().extractRotation(controller.matrixWorld);
            raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
            raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

            const hits = raycaster.intersectObjects(interactiveMeshes, false);
            if (hits.length > 0) {
              const data = hits[0].object.userData;
              if (data.shopId) purchaseOrUpgradeShop(data.shopId);
              else if (data.upgradeId) purchaseTownImprovement(data.upgradeId);
            } else {
              triggerMarketRush();
            }
          });

          cameraRig.add(controller);
          vrControllers.push(controller);
        }
      }
      setupVRControllers();

      // VR Thumbstick Smooth Walk & Snap Turn
      function processVRThumbsticks(dt) {
        if (!renderer.xr.isPresenting) return;
        const session = renderer.xr.getSession();
        if (!session) return;

        if (snapTurnCooldown > 0) snapTurnCooldown -= dt;

        for (const source of session.inputSources) {
          if (!source.gamepad) continue;
          const axes = source.gamepad.axes;
          if (axes.length >= 4) {
            const xAxis = axes[2];
            const yAxis = axes[3];

            if (source.handedness === 'left') {
              // Smooth locomotion along head direction
              if (Math.abs(xAxis) > 0.15 || Math.abs(yAxis) > 0.15) {
                const headDir = new THREE.Vector3();
                camera.getWorldDirection(headDir);
                headDir.y = 0;
                headDir.normalize();
                const rightDir = new THREE.Vector3().crossVectors(headDir, new THREE.Vector3(0, 1, 0));

                cameraRig.position.addScaledVector(headDir, -yAxis * 5.5 * dt);
                cameraRig.position.addScaledVector(rightDir, xAxis * 5.5 * dt);
                cameraRig.position.x = Math.max(-22, Math.min(22, cameraRig.position.x));
                cameraRig.position.z = Math.max(-22, Math.min(22, cameraRig.position.z));
              }
            } else if (source.handedness === 'right') {
              // 30-degree comfort snap turning
              if (snapTurnCooldown <= 0 && Math.abs(xAxis) > 0.65) {
                cameraRig.rotation.y -= Math.sign(xAxis) * (Math.PI / 6);
                snapTurnCooldown = 0.32;
              }
            }
          }
        }
      }

      const btnEnterVR = document.getElementById('btn-enter-vr');
      const vrBtnLabel = document.getElementById('vr-btn-label');
      let currentXRSession = null;

      btnEnterVR.addEventListener('click', async () => {
        sound.init();
        if (!navigator.xr) {
          showToast('WebXR not detected — playing in 3D Desktop/Mobile Mode!');
          return;
        }
        try {
          const supported = await navigator.xr.isSessionSupported('immersive-vr');
          if (!supported) {
            showToast('No VR Headset connected — enjoy 3D Town Square Mode!');
            return;
          }
          if (!currentXRSession) {
            const session = await navigator.xr.requestSession('immersive-vr', {
              optionalFeatures: ['local-floor', 'bounded-floor']
            });
            renderer.xr.setSession(session);
            currentXRSession = session;
            cameraRig.position.set(0, 0, 12);
            vrBtnLabel.textContent = 'EXIT VR';

            session.addEventListener('end', () => {
              currentXRSession = null;
              cameraRig.position.set(0, 0, 0);
              cameraRig.rotation.set(0, 0, 0);
              vrBtnLabel.textContent = 'ENTER VR';
              updateDesktopCamera();
            });
          } else {
            await currentXRSession.end();
          }
        } catch (err) {
          showToast('VR Session unavailable in current browser frame.');
        }
      });

      // --------------------------------------------------------------------------
      // 10. HUD RENDERING & UI BINDINGS
      // --------------------------------------------------------------------------
      const uiCash = document.getElementById('ui-cash');
      const uiIncome = document.getElementById('ui-income');
      const uiShoppers = document.getElementById('ui-shoppers');
      const uiBoostSub = document.getElementById('ui-boost-sub');
      const panelShops = document.getElementById('panel-shops');
      const panelUpgrades = document.getElementById('panel-upgrades');

      function updateUI() {
        const incPerSec = getTotalIncomePerSec();
        uiCash.textContent = formatMoney(state.cash);
        uiIncome.textContent = `${formatMoney(incPerSec)}/s` + (state.rushTimer > 0 ? ' (1.5x)' : '');
        uiShoppers.textContent = shoppers.length;

        const clickVal = Math.max(10, Math.floor(incPerSec * 0.5 + 10));
        uiBoostSub.textContent = state.rushTimer > 0
          ? `Market Rush Active (${state.rushTimer.toFixed(1)}s)`
          : `Ring Bell (+${formatMoney(clickVal)})`;

        // Render Local Shops Cards
        panelShops.innerHTML = SHOP_CONFIGS.map(cfg => {
          const lv = state.shops[cfg.id].level;
          const cost = getShopUpgradeCost(cfg, lv);
          const inc = getShopIncomePerSec(cfg, lv);
          const canAfford = state.cash >= cost;

          return `
            <div class="warm-card rounded-xl p-3 flex flex-col justify-between gap-2">
              <div class="flex items-start justify-between gap-2">
                <div>
                  <div class="flex items-center gap-1.5">
                    <span class="w-2.5 h-2.5 rounded-full" style="background:${cfg.accentCss}"></span>
                    <span class="text-xs font-bold text-stone-800">${cfg.name}</span>
                  </div>
                  <div class="text-[11px] text-stone-500 mt-0.5">${cfg.tag} • <span class="text-stone-700 font-semibold">${lv === 0 ? 'Available' : 'Lv.' + lv}</span></div>
                </div>
                <div class="text-right font-mono-num text-[11px] font-bold text-emerald-700">
                  ${lv === 0 ? `+${formatMoney(cfg.baseIncome * getGlobalMultiplier())}/s` : `${formatMoney(inc)}/s`}
                </div>
              </div>
              <button data-shop-btn="${cfg.id}"
                class="w-full py-1.5 px-3 rounded-lg text-xs font-bold font-mono-num transition-all cursor-pointer ${
                  canAfford
                    ? 'bg-amber-600 hover:bg-amber-500 text-white shadow-sm'
                    : 'bg-stone-200 text-stone-500'
                }">
                ${lv === 0 ? 'OPEN SHOP' : 'EXPAND'} • ${formatMoney(cost)}
              </button>
            </div>
          `;
        }).join('');

        panelShops.querySelectorAll('[data-shop-btn]').forEach(btn => {
          btn.addEventListener('click', () => {
            purchaseOrUpgradeShop(btn.getAttribute('data-shop-btn'));
          });
        });

        // Render Town Improvements Cards
        panelUpgrades.innerHTML = TOWN_IMPROVEMENTS.map(upg => {
          const lv = state.upgrades[upg.id] || 0;
          const maxed = lv >= upg.maxLevel;
          const cost = getUpgradeCost(upg);
          const canAfford = !maxed && state.cash >= cost;

          return `
            <div class="warm-card rounded-xl p-3 flex items-center justify-between gap-3">
              <div class="flex-1">
                <div class="flex items-center gap-2">
                  <span class="text-xs font-bold text-stone-800">${upg.name}</span>
                  <span class="text-[10px] font-mono-num px-1.5 py-0.5 rounded bg-amber-100 text-amber-800 border border-amber-300">
                    Tier ${lv}/${upg.maxLevel}
                  </span>
                </div>
                <p class="text-[11px] text-stone-500 mt-0.5 leading-snug">${upg.desc}</p>
              </div>
              <button data-upg-btn="${upg.id}" ${maxed ? 'disabled' : ''}
                class="shrink-0 py-2 px-3.5 rounded-lg text-xs font-bold font-mono-num transition-all cursor-pointer ${
                  maxed
                    ? 'bg-emerald-100 text-emerald-800 border border-emerald-300 cursor-default'
                    : canAfford
                      ? 'bg-emerald-700 hover:bg-emerald-600 text-white shadow-sm'
                      : 'bg-stone-200 text-stone-500'
                }">
                ${maxed ? 'MAXED' : formatMoney(cost)}
              </button>
            </div>
          `;
        }).join('');

        panelUpgrades.querySelectorAll('[data-upg-btn]').forEach(btn => {
          btn.addEventListener('click', () => {
            purchaseTownImprovement(btn.getAttribute('data-upg-btn'));
          });
        });

        updateNoticeboardTexture();
      }

      // Tabs & Drawer Collapse
      const tabShops = document.getElementById('tab-shops');
      const tabUpgrades = document.getElementById('tab-upgrades');
      const btnToggleDrawer = document.getElementById('btn-toggle-drawer');
      const drawerBody = document.getElementById('drawer-body');
      const drawerToggleText = document.getElementById('drawer-toggle-text');
      const drawerChevron = document.getElementById('drawer-chevron');
      let drawerOpen = true;

      tabShops.addEventListener('click', () => {
        sound.playClick();
        panelShops.classList.remove('hidden');
        panelShops.classList.add('grid');
        panelUpgrades.classList.add('hidden');
        panelUpgrades.classList.remove('grid');

        tabShops.className = 'px-3 py-1.5 rounded-lg text-xs font-bold bg-amber-600 text-white cursor-pointer transition-all shadow-sm';
        tabUpgrades.className = 'px-3 py-1.5 rounded-lg text-xs font-bold text-stone-600 hover:text-stone-900 cursor-pointer transition-all';
      });

      tabUpgrades.addEventListener('click', () => {
        sound.playClick();
        panelUpgrades.classList.remove('hidden');
        panelUpgrades.classList.add('grid');
        panelShops.classList.add('hidden');
        panelShops.classList.remove('grid');

        tabUpgrades.className = 'px-3 py-1.5 rounded-lg text-xs font-bold bg-emerald-700 text-white cursor-pointer transition-all shadow-sm';
        tabShops.className = 'px-3 py-1.5 rounded-lg text-xs font-bold text-stone-600 hover:text-stone-900 cursor-pointer transition-all';
      });

      btnToggleDrawer.addEventListener('click', () => {
        sound.playClick();
        drawerOpen = !drawerOpen;
        drawerBody.style.display = drawerOpen ? 'block' : 'none';
        drawerToggleText.textContent = drawerOpen ? 'Minimize' : 'Expand';
        drawerChevron.style.transform = drawerOpen ? 'rotate(0deg)' : 'rotate(180deg)';
      });

      document.getElementById('btn-boost').addEventListener('click', triggerMarketRush);

      document.getElementById('btn-audio').addEventListener('click', () => {
        const muted = sound.toggleMute();
        document.getElementById('icon-sound-on').classList.toggle('hidden', muted);
        document.getElementById('icon-sound-off').classList.toggle('hidden', !muted);
        if (!muted) sound.playClick();
      });

      document.getElementById('btn-cam-reset').addEventListener('click', () => {
        sound.playClick();
        camOrbit.target.set(0, 1.4, 1.5);
        camOrbit.radius = 32;
        camOrbit.theta = 0;
        camOrbit.phi = 0.94;
        updateDesktopCamera();
      });

      const modalReset = document.getElementById('modal-reset');
      document.getElementById('btn-reset-prompt').addEventListener('click', () => {
        sound.playClick();
        modalReset.classList.remove('hidden');
        modalReset.classList.add('flex');
      });
      document.getElementById('btn-reset-cancel').addEventListener('click', () => {
        sound.playClick();
        modalReset.classList.add('hidden');
        modalReset.classList.remove('flex');
      });
      document.getElementById('btn-reset-confirm').addEventListener('click', () => {
        localStorage.removeItem(SAVE_KEY);
        state.cash = 120;
        state.totalEarned = 120;
        state.rushTimer = 0;
        state.upgrades = { newspaper: 0, delivery_van: 0, pedestrian_zone: 0 };
        SHOP_CONFIGS.forEach(cfg => {
          state.shops[cfg.id].level = 0;
          rebuildShopVisuals(cfg);
        });
        modalReset.classList.add('hidden');
        modalReset.classList.remove('flex');
        updateUI();
        showToast('Town reset! Starting fresh with $120.');
      });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // --------------------------------------------------------------------------
      // 11. MAIN SIMULATION & RENDER LOOP (DESKTOP + WEBXR VR)
      // --------------------------------------------------------------------------
      let lastTime = performance.now();
      let saveAccumulator = 0;
      let uiAccumulator = 0;
      let spawnAccumulator = 0;

      function animate(now) {
        const dt = Math.min(0.1, (now - lastTime) / 1000);
        lastTime = now;

        // 1. Passive Income & Market Rush Timer
        if (state.rushTimer > 0) {
          state.rushTimer = Math.max(0, state.rushTimer - dt);
        }

        const passiveGain = getTotalIncomePerSec() * dt;
        if (passiveGain > 0) {
          state.cash += passiveGain;
          state.totalEarned += passiveGain;
        }

        // 2. Fountain Water Ripples & Drifting Clouds
        waterRipples.forEach(rip => {
          rip.userData.phase = (rip.userData.phase + dt * 0.65) % 1.0;
          const sc = 0.6 + rip.userData.phase * 2.8;
          rip.scale.set(sc, sc, 1);
          rip.material.opacity = (1.0 - rip.userData.phase) * 0.65;
        });

        clouds.forEach(cloud => {
          cloud.position.x += dt * 0.65;
          if (cloud.position.x > 75) cloud.position.x = -75;
        });

        // 3. Passing Delivery Van Animation & Wholesale Drop
        const vanSpeed = 8.5 + state.upgrades.delivery_van * 1.4;
        vanGroup.position.x += vanSpeed * dt;
        if (!vanDropTriggered && vanGroup.position.x >= 0) {
          vanDropTriggered = true;
          if (state.upgrades.delivery_van > 0 && getTotalIncomePerSec() > 0) {
            const dropBonus = Math.max(15, Math.floor(getTotalIncomePerSec() * (1.2 + state.upgrades.delivery_van * 0.4)));
            state.cash += dropBonus;
            state.totalEarned += dropBonus;
            spawnCashPopup(new THREE.Vector3(0, 1.8, 25), dropBonus, '#b45309');
          }
        }
        if (vanGroup.position.x > 78) {
          vanGroup.position.x = -78;
          vanDropTriggered = false;
        }

        // 4. Autonomous Townsfolk Pedestrians
        const maxShoppers = 5 + state.upgrades.newspaper * 3 + getUnlockedShops().length * 2;
        const spawnInterval = Math.max(0.5, 2.5 - state.upgrades.newspaper * 0.18);

        spawnAccumulator += dt;
        if (spawnAccumulator >= spawnInterval && shoppers.length < maxShoppers) {
          spawnAccumulator = 0;
          spawnShopper();
        }

        const walkSpeed = (2.8 + state.upgrades.newspaper * 0.25) * (state.rushTimer > 0 ? 1.35 : 1.0);

        for (let i = shoppers.length - 1; i >= 0; i--) {
          const s = shoppers[i];
          s.walkPhase += dt * 9;

          // Natural leg swing & subtle vertical stride
          if (s.mesh.userData.legL && s.mesh.userData.legR) {
            s.mesh.userData.legL.rotation.x = Math.sin(s.walkPhase) * 0.45;
            s.mesh.userData.legR.rotation.x = -Math.sin(s.walkPhase) * 0.45;
          }
          s.mesh.position.y = 0.1 + Math.abs(Math.sin(s.walkPhase)) * 0.04;

          let target = s.waypoint;
          if (s.phase === 'to_shop') target = s.doorway;
          else if (s.phase === 'leaving') target = s.exitPos;

          const dir = new THREE.Vector3().subVectors(target, s.mesh.position);
          dir.y = 0;
          const dist = dir.length();

          if (dist < 0.45) {
            if (s.phase === 'to_plaza') {
              s.phase = 'to_shop';
            } else if (s.phase === 'to_shop') {
              const cfg = SHOP_CONFIGS.find(c => c.id === s.targetShopId);
              const lv = cfg ? state.shops[cfg.id].level : 0;
              if (cfg && lv > 0) {
                const purchaseBonus = Math.max(2, getShopIncomePerSec(cfg, lv) * 0.65);
                state.cash += purchaseBonus;
                state.totalEarned += purchaseBonus;
                spawnCashPopup(s.doorway, purchaseBonus, '#15803d');
              }
              s.phase = 'leaving';
            } else {
              scene.remove(s.mesh);
              shoppers.splice(i, 1);
              continue;
            }
          } else {
            dir.normalize();
            s.mesh.position.addScaledVector(dir, walkSpeed * dt);
            s.mesh.lookAt(s.mesh.position.x + dir.x, s.mesh.position.y, s.mesh.position.z + dir.z);
          }
        }

        // 5. Floating "+$XX" Popups Update
        for (let i = floatingPopups.length - 1; i >= 0; i--) {
          const p = floatingPopups[i];
          p.life -= dt;
          p.sprite.position.y += dt * 1.45;
          p.mat.opacity = Math.max(0, p.life);
          if (p.life <= 0) {
            scene.remove(p.sprite);
            p.tex.dispose();
            p.mat.dispose();
            floatingPopups.splice(i, 1);
          }
        }

        // 6. Desktop WASD & VR Thumbstick Locomotion
        processKeyboardMovement(dt);
        processVRThumbsticks(dt);

        uiAccumulator += dt;
        if (uiAccumulator >= 0.25) {
          uiAccumulator = 0;
          updateUI();
        }

        saveAccumulator += dt;
        if (saveAccumulator >= 5.0) {
          saveAccumulator = 0;
          saveGame();
        }

        renderer.render(scene, camera);
      }

      window.addEventListener('load', () => {
        updateUI();
        for (let i = 0; i < 3; i++) spawnShopper();
        renderer.setAnimationLoop(animate);
      });
    })();
  </script>
</body>
</html>
